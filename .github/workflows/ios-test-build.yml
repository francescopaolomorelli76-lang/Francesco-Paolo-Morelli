# Compila Manga Vox per iPhone su un Mac di GitHub, SENZA firma.
# Il file .ipa prodotto si installa con Sideloadly e un Apple ID gratuito
# (guida: docs/PROVA_IPHONE.md).
name: iOS test build (IPA non firmata)

on:
  push:
    branches: [claude/offline-translation-app-32rsjv]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

# Una sola build alla volta: una nuova sostituisce quella in coda.
concurrency:
  group: ios-test-build
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Pacchetti Flutter
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: CocoaPods
        run: cd ios && pod install --repo-update

      - name: Compila (senza firma)
        run: flutter build ios --release --no-codesign

      - name: Crea IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry MangaVox.ipa Payload
          ls -lh MangaVox.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MangaVox-iPhone-ipa
          path: MangaVox.ipa
          retention-days: 14
