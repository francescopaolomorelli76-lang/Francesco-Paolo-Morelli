<title>Clinia App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2b4a64">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icone/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="img/clinia-mark.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clinia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Lora:wght@500;600;700&display=swap">
<style>
/* Layout: una colonna "telefono" centrata (piena larghezza su smartphone), contenuto scorrevole e barra schede fissa in basso. */
:root{
  /* Colori istituzionali Clinia (Brand Manual): #2B4A64 primario, #2C5E66 secondario, #A38258 terzo, #F5F5F5 quarto */
  --bg:#ffffff; --bg-2:#f5f5f5; --card:#ffffff; --ink:#1c3144; --ink-2:#465a6b; --ink-3:#717f8b;
  --line:#e1e5e9; --accent:#2c5e66; --accent-2:#214a51; --accent-soft:#e5eef0; --on-accent:#ffffff;
  --azure:#2b4a64; --azure-soft:#e5ebf1; --gold:#a38258; --gold-soft:#f3ece3; --green:#2c7a5e; --warn:#b45309; --warn-soft:#fdf2e3;
  --danger:#b91c1c; --danger-soft:#fdecec; --busy:#c9d9df; --shade:rgba(6,24,32,.55);
  --grad:linear-gradient(120deg,#2c5e66 0%,#2b4a64 100%);
  --f-display:Lora,Georgia,"Times New Roman",serif;
  --f-body:"Myriad Pro","Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:12px;
  --shadow:0 8px 24px -10px rgba(43,74,100,.26),0 2px 6px -2px rgba(28,49,68,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111a22; --bg-2:#16212b; --card:#1b2833; --ink:#eef1f4; --ink-2:#bcc6cf; --ink-3:#8e9aa5;
  --line:#2a3a47; --accent:#6fb0b8; --accent-2:#94c7cd; --accent-soft:#1d3a3f; --on-accent:#0d2226;
  --azure:#8fb2d1; --azure-soft:#1d3044; --gold:#cdab7d; --gold-soft:#3a2f22; --green:#5cc29a; --warn:#f0b35a; --warn-soft:#3a2a12;
  --danger:#f08080; --danger-soft:#3a1717; --busy:#2c4a55; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a22; --bg-2:#16212b; --card:#1b2833; --ink:#eef1f4; --ink-2:#bcc6cf; --ink-3:#8e9aa5;
  --line:#2a3a47; --accent:#6fb0b8; --accent-2:#94c7cd; --accent-soft:#1d3a3f; --on-accent:#0d2226;
  --azure:#8fb2d1; --azure-soft:#1d3044; --gold:#cdab7d; --gold-soft:#3a2f22; --green:#5cc29a; --warn:#f0b35a; --warn-soft:#3a2a12;
  --danger:#f08080; --danger-soft:#3a1717; --busy:#2c4a55; --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg-2);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--azure);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:20px max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.tiny{font-size:.76rem;color:var(--ink-3)}
.hidden{display:none!important}

/* Icone */
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}

/* Barra superiore */
.topbar{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px max(8px,env(safe-area-inset-left,0px)) 6px max(8px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.topbar h2{flex:1;font-size:1.05rem;font-weight:700;text-align:center;font-family:var(--f-body)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--bg-2)}
.topbar.plain{border:0}

/* Pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:700;font-size:1rem;transition:transform .15s,background .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border:1.5px solid var(--line);background:var(--card)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{border:1.5px solid var(--line);color:var(--danger);background:var(--card)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--accent);font-weight:700}
.link.az{color:var(--azure)}
.actions{display:flex;flex-direction:column;gap:12px;padding:16px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--bg)}

/* Logo */
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.5rem;color:var(--ink);letter-spacing:-.02em}
.brand svg{height:34px;width:auto}

/* Splash */
.splash{flex:1;display:grid;place-items:center;position:relative}
.splash svg{width:96px;height:112px;animation:pop .8s cubic-bezier(.2,.7,.2,1.2)}
.spinner{position:absolute;bottom:64px;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink-3);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* Titoli */
.hello{font-family:var(--f-display);font-weight:500;font-size:2.1rem;letter-spacing:-.02em}
.hello b{color:var(--accent);font-weight:600}
.h-xl{font-family:var(--f-display);font-weight:500;font-size:1.9rem;letter-spacing:-.015em}
.h-xl b{color:var(--accent);font-weight:600}
.h-sec{font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.lead{color:var(--ink-2);font-size:1.02rem}

/* Ricerca */
.searchbox{display:flex;align-items:center;gap:12px;padding:0 18px;min-height:56px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);text-align:left;width:100%}
.searchbox .ic{color:var(--accent)}
.searchbox input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:1rem}

/* Banner */
.banner{position:relative;display:flex;align-items:center;gap:12px;padding:18px 48px 18px 18px;border-radius:var(--r-sm);background:var(--grad);color:#fff;overflow:hidden}
.banner::before{content:"";position:absolute;left:22px;top:-8px;width:16px;height:16px;background:#2c5e66;transform:rotate(45deg)}
.banner b{display:block;font-size:1.05rem;line-height:1.3}
.banner span{font-size:.9rem;opacity:.92}
.banner .x{position:absolute;right:6px;top:6px;color:#fff}
.banner svg.mk{flex:none;width:52px;height:60px;opacity:.95}

/* Chip specialità */
.chips{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:10px;overflow-x:auto;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);white-space:nowrap;font-size:1rem;color:var(--ink-2);font-weight:600}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.a-chirurgia{background:var(--azure)}.a-medicina{background:var(--accent)}.a-riabilitazione{background:var(--green)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.pill{flex:none;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:.88rem;color:var(--ink-2);background:var(--card)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* Card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 20px}
.card h3{font-size:1.08rem;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--accent-soft);color:var(--accent-2)}
.badge.az{background:var(--azure-soft);color:var(--azure)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.badge.grey{background:var(--bg-2);color:var(--ink-3)}
.illo{width:120px;height:110px}

/* Avatar */
.av{flex:none;width:56px;height:56px;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:1.25rem}
.av.lg{width:96px;height:96px;border-radius:28px;font-size:2.2rem}
.av.round{border-radius:50%}
.av.sm{width:40px;height:40px;border-radius:12px;font-size:.95rem}

/* Lista specialisti */
.doc{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.doc:hover{border-color:var(--accent)}
.doc .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.doc .info b{font-size:1.02rem}
.doc .info .r{color:var(--ink-2);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--accent-2);margin-top:4px}
.stars{color:var(--accent);letter-spacing:1px}

/* Barra schede */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px max(4px,env(safe-area-inset-left,0px)) 8px max(4px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink-3);font-size:.74rem;font-weight:600}
.tab .ic{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* Profilo specialista */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 16px 20px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.hero h1{font-size:1.4rem;font-weight:800}
.blist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.blist li{display:flex;gap:10px;color:var(--ink-2);font-size:.95rem}
.blist li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:9px}
.svc{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.svc:last-child{border-bottom:0}
.svc .t{flex:1;min-width:0}
.svc .t b{display:block;font-size:.98rem}
.price{font-weight:800;white-space:nowrap}

/* Prenotazione */
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--card);text-align:left;width:100%}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .radio{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3)}
.opt.on .radio{border:6px solid var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;padding:10px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:2px}
.day small{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.day b{font-size:1.25rem}
.day i{font-style:normal;font-size:.68rem;font-weight:700;color:var(--accent-2)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.on small,.day.on i{color:var(--on-accent)}
.day[disabled]{opacity:.4}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:11px 0;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:.95rem;background:var(--card)}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.slot[disabled]{text-decoration:line-through;color:var(--ink-3);background:var(--bg-2);opacity:.7}
.sum{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.95rem}
.sum dt{color:var(--ink-3)}
.sum dd{margin:0;font-weight:700;text-align:right}
textarea,.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:14px;outline:none}
textarea:focus,.field input:focus,.field select:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}

/* Form a etichetta interna */
.field{position:relative;display:block}
.field span{position:absolute;left:15px;top:8px;font-size:.78rem;color:var(--azure);font-weight:600}
.field input,.field select{padding:28px 14px 10px;min-height:60px}
.grid2{display:grid;grid-template-columns:120px 1fr;gap:12px}
.inline-field{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0 16px;background:var(--card);min-height:56px}
.inline-field:focus-within{border-color:var(--accent)}
.inline-field input{flex:1;border:0;background:none;outline:none;min-width:0;padding:14px 0}
.inline-field .ic{color:var(--ink-3)}
.err{color:var(--danger);font-weight:600;font-size:.9rem;min-height:1.3em}
.or{display:flex;align-items:center;gap:14px;color:var(--ink-3)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* Segmenti */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line)}
.seg button{padding:10px;border-radius:999px;font-weight:700;color:var(--ink-2);font-size:.92rem}
.seg button.on{background:var(--card);color:var(--accent-2);box-shadow:var(--shadow)}

/* PIN */
.pinwrap{flex:1;display:flex;flex-direction:column;padding:56px max(24px,env(safe-area-inset-left,0px)) 24px max(24px,env(safe-area-inset-right,0px))}
.dots{display:flex;justify-content:center;gap:28px;margin:48px 0 40px}
.dots i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink)}
.dots i.f{background:var(--ink)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 0;margin-top:auto;max-width:340px;width:100%;align-self:center}
.key{height:68px;font-size:2rem;font-weight:700;border-radius:50%;width:68px;justify-self:center}
.key:hover{background:var(--bg-2)}
.key.small{font-size:.95rem;color:var(--accent-2);width:auto;border-radius:12px;padding:0 10px}
.otp{display:flex;justify-content:center;gap:12px;margin:40px 0}
.otp i{width:56px;height:62px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:1.6rem;font-weight:700}
.otp i.cur{border-color:var(--accent)}

/* Liste impostazioni */
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--ink-3);font-size:.82rem}
.li>.ic{color:var(--accent)}
.sw{flex:none;width:48px;height:28px;border-radius:999px;background:var(--busy);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.label{font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* Chat */
.bubbles{display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:10px 14px;border-radius:18px;font-size:.95rem;background:var(--bg-2);border:1px solid var(--line);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bub small{display:block;font-size:.7rem;opacity:.75;margin-top:2px}
.composer{display:flex;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px)) 12px max(12px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--bg)}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;background:var(--card);outline:none}
.composer button{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}

/* Stanze */
.room{display:flex;flex-direction:column;gap:10px}
.tl{position:relative;height:30px;border-radius:8px;background:var(--accent-soft);overflow:hidden}
.tl .blk{position:absolute;top:0;bottom:0;background:var(--busy);border-left:2px solid var(--bg);font-size:.66rem;font-weight:800;display:grid;place-items:center;color:var(--ink-2);overflow:hidden;white-space:nowrap}
.tl .blk.mine{background:var(--accent);color:var(--on-accent)}
.tl .blk.sel{background:repeating-linear-gradient(45deg,var(--azure),var(--azure) 6px,transparent 6px,transparent 10px);border:2px solid var(--azure)}
.tl-scale{display:flex;justify-content:space-between;font-size:.68rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 12px;border-radius:var(--r-sm);background:var(--bg-2);border:1px solid var(--line)}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;color:var(--ink-3);font-weight:600}
.shift{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.shift-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--accent-soft);color:var(--accent-2);font-weight:800;font-size:.92rem}
.ap{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.ap .tm{width:52px;font-weight:800;font-variant-numeric:tabular-nums}
.ap .t{flex:1;min-width:0}
.ap .t small{display:block;color:var(--ink-3);font-size:.8rem}
.ap.free .t{color:var(--ink-3)}
table.tar{width:100%;border-collapse:collapse;font-size:.92rem}
table.tar th,table.tar td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}

function allBookings(){
  const out=[];const t0=today();if(DB.on)return S.rooms.slice();
  for(let k=-7;k<=HORIZON;k++){const ds=addDays(t0,k),wd=parseD(ds).getDay();
    for(const[id,days,a,b,r] of SCHEDULE){if(!days.includes(wd))continue;const bid=`seed-${id}-${ds}-${a}`;
      if(S.cancelled.includes(bid))continue;out.push({id:bid,doctorId:id,date:ds,start:a,end:b,roomId:r,seed:true})}}
  return out.concat(S.rooms)}
const bookingsOn=(ds,f)=>allBookings().filter(b=>b.date===ds&&(!f||f(b)));
/* Appuntamenti di esempio (altri pazienti), stabili per data e orario */
function demoBusy(docId,ds){if(DB.on)return[];const base=services(docId)[0].dur,out=[];
  for(const b of bookingsOn(ds,b=>b.doctorId===docId))for(let t=toMin(b.start);t+base<=toMin(b.end);t+=base)
    if(hash(docId+ds+t)%100<32)out.push({start:t,end:t+base,name:DEMO_NAMES[hash(ds+t+docId)%DEMO_NAMES.length],svc:services(docId)[hash(t+docId)%services(docId).length].name,roomId:b.roomId});
  return out}
const activeAppts=()=>S.appts.filter(a=>a.status!=="annullata"&&a.status!=="rifiutata");
function slotsFor(docId,ds,dur){
  const busy=demoBusy(docId,ds),mine=activeAppts().filter(a=>a.doctorId===docId&&a.date===ds),res=[];
  const isToday=ds===today(),nm=nowMin();
  for(const b of bookingsOn(ds,b=>b.doctorId===docId).sort((x,y)=>toMin(x.start)-toMin(y.start)))
    for(let t=toMin(b.start);t+dur<=toMin(b.end);t+=dur){
      if(isToday&&t<=nm+30)continue;
      const taken=busy.some(x=>overlap(t,t+dur,x.start,x.end))||mine.some(a=>overlap(t,t+dur,toMin(a.time),toMin(a.time)+a.dur));
      res.push({time:toT(t),roomId:b.roomId,free:!taken})}
  return res}
function nextAvail(docId){const d=services(docId)[0].dur;
  for(let k=0;k<=HORIZON;k++){const ds=addDays(today(),k),s=slotsFor(docId,ds,d).find(x=>x.free);if(s)return{date:ds,time:s.time}}return null}

let lastKey="";
function render(){
  const sc=app.querySelector(".content");const key=viewKey();const top=sc&&key===lastKey?sc.scrollTop:0;
  // Conserva quello che l'utente sta scrivendo se la schermata viene ridisegnata (avvisi, notifiche, tempo reale)
  const keep={},act=document.activeElement&&document.activeElement.id;
  if(key===lastKey)app.querySelectorAll("input[id],select[id],textarea[id]").forEach(el=>{if(!["file","checkbox","radio"].includes(el.type))keep[el.id]=el.value});
  const errs={};if(key===lastKey)app.querySelectorAll(".err[id]").forEach(el=>{if(el.textContent)errs[el.id]=el.textContent});
  app.innerHTML=screenHTML()+overlayHTML();lastKey=key;
  for(const id in keep){const el=document.getElementById(id);if(el&&el.value!==keep[id])el.value=keep[id]}
  for(const id in errs){const el=document.getElementById(id);if(el&&!el.textContent)el.textContent=errs[id]}
  if(act){const el=document.getElementById(act);if(el&&el.focus)el.focus({preventScroll:true})}
  const nc=app.querySelector(".content");if(nc)nc.scrollTop=top;
  const af=app.querySelector("[data-autofocus]");if(af)af.focus();
  const qi=app.querySelector("#q");if(qi&&qi.value)qi.dispatchEvent(new Event("input",{bubbles:true}));
  app.querySelectorAll(".content,.pinwrap").forEach(c=>{if(!c.querySelector(".fpm-foot"))c.insertAdjacentHTML("beforeend",FPM_FOOT)});
  const r3=app.querySelector("#r3d");if(r3)start3D(r3);const a3=app.querySelector("#a3d");if(a3)startModel(a3);
}

function readCard(f,err){const num=f.num.value.replace(/\D/g,""),m=f.exp.value.replace(/\s/g,"").match(/^(\d{1,2})\/?(\d{2})$/);
  if(!f.holder.value.trim()){err.textContent="Inserisci il nome dell’intestatario.";return null}
  if(num.length<13||num.length>19||!luhn(num)){err.textContent="Il numero della carta non è valido. Controlla le cifre.";return null}
  if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],0)<new Date()){err.textContent="Scadenza non valida o carta scaduta. Usa il formato MM/AA.";return null}
  if(!/^\d{3,4}$/.test(f.cvv.value)){err.textContent="Il CVV ha 3 o 4 cifre.";return null}
  return{id:uid(),brand:cardBrand(num),last4:num.slice(-4),exp:m[1].padStart(2,"0")+"/"+m[2],holder:f.holder.value.trim()}}

function timeline(ds,r,sel){const[o,c]=OPEN[parseD(ds).getDay()];const span=c-o;

  const s=sel?`<span class="blk sel" style="left:${(sel[0]-o)/span*100}%;width:${(sel[1]-sel[0])/span*100}%"></span>`:"";
  const marks=[];for(let t=o;t<=c;t+=span>360?120:60)marks.push(`<span>${t/60}</span>`);

/* ===================== Azioni ===================== */
function go(screen){UI.screen=screen;UI.buf="";UI.pinErr="";UI.shake=false;render()}
function push(p){UI.stack.push(p);render()}
function afterAuthFlow(){if(S.notif!==false)chiediPermessoNotifiche(); // prossimo passo dell'onboarding
  if(isFpm()){if(!S.pin)return go("pin-create");UI.screen="main";UI.stack=[];UI.tab="fpm";return render()}
  if(isPro()&&!subActive())return go("sub");
  if(!S.pin)return go("pin-create");
  if(!S.user||!S.user.tel)return go("phone");
  if(!S.health)return go("health");
  if(isPro()&&!S.proId)return go("pro-pick");
  if(isPro()&&!(S.proProfile[S.proId]&&S.proProfile[S.proId].done)&&!UI.skipProf)return go("proprof");
  if(isPro()&&!isOwner()&&!S.payAcc[S.proId]&&!UI.skipIban)return go("iban");
  if(S.notif==null)return go("notifs");
  UI.screen="main";
  if(UI.pending){const p=UI.pending;UI.pending=null;UI.stack=p.stack;UI.book=p.book;UI.tab=p.tab;return doConfirmBook()}
  UI.stack=[];UI.tab=isPro()?"agenda":"home";if(!isPro()&&S.stats==null)UI.sheet={type:"stats"};render()}
function doConfirmBook(){const b=UI.book,top=UI.stack[UI.stack.length-1],id=top.id,s=services(id)[b.svc];
  const slot=slotsFor(id,b.date,s.dur).find(x=>x.time===b.time&&x.free);if(!slot){toast("Questo orario non è più disponibile. Scegline un altro.");return render()}
  const a={id:uid(),doctorId:id,date:b.date,time:b.time,dur:s.dur,service:s.name,price:s.price,roomId:s.online?null:slot.roomId,online:!!s.online,note:b.note||"",patient:(p=>p.nome+" "+p.cognome)(personOf(b.forId)),forId:b.forId||"me",pay:b.pay||"clinic",paid:!!(b.pay&&b.pay!=="clinic"),fee:APP_FEE,feeBy:b.pay&&b.pay!=="clinic"?"paziente":"specialista",status:"richiesta",created:Date.now(),ownerEmail:S.auth&&S.auth.email};a.paid=false;a.payAuth=!!(b.pay&&b.pay!=="clinic");
  S.appts.push(a);save();DB.saveAppt(a);UI.stack=[{page:"done",id:a.id}];
  const q=`${fmtD(a.date,{weekday:"short",day:"numeric",month:"short"})} alle ${a.time}`;
  addNotif("spec:"+id,"richiesta_visita","Nuova richiesta di visita",`${a.patient} · ${a.service} · ${q}${a.roomId?" · "+room(a.roomId).name:""}. Conferma o rifiuta dall’Agenda.`,a.id);
  S.notifs.unshift({id:uid(),to:"user:"+S.auth.email,tipo:"richiesta_inviata",titolo:"Richiesta inviata",testo:`${a.service} con ${doc(id).name}, ${q}: in attesa di conferma.`,ref:a.id,at:Date.now(),letta:true});save();render();
  setTimeout(()=>notify("Richiesta inviata",`${a.service} con ${doc(id).name}, ${q}. Ti avvisiamo appena lo specialista conferma.${a.payAuth?" La carta viene addebitata solo alla conferma.":""}`,"Clinia"),900)}
function keyPress(v){
  if(v==="del"){UI.buf=UI.buf.slice(0,-1);UI.pinErr="";return render()}
  if(UI.buf.length>=4)return;UI.buf+=v;UI.pinErr="";UI.shake=false;render();
  if(UI.buf.length<4)return;
  setTimeout(()=>{const s=UI.screen,b=UI.buf;
    if(s==="pin-create"){UI.firstPin=b;go("pin-confirm")}
    else if(s==="pin-confirm"){if(b===UI.firstPin){S.pin=b;save();if(UI.changingPin){UI.changingPin=false;UI.screen="main";toast("PIN aggiornato");}else{UI.buf="";UI.modal={type:"faceid"};render()}}
      else{UI.screen="pin-create";UI.buf="";UI.pinErr="I PIN non coincidono. Riprova.";UI.shake=true;render()}}
    else if(s==="lock"){if(b===S.pin){UI.screen="main";UI.buf="";render()}else{UI.buf="";UI.pinErr="PIN errato. Riprova.";UI.shake=true;render()}}
    else if(s==="otp"){if(b===UI.otp&&Date.now()>UI.otpExp){UI.buf="";UI.pinErr="Il codice è scaduto. Richiedine uno nuovo.";UI.shake=true;render()}else if(b===UI.otp){UI.buf="";afterAuthFlow()}else{UI.buf="";UI.pinErr=UI.otpChannel==="whatsapp"?"Codice non valido. Controlla il messaggio su WhatsApp e riprova.":"Codice non valido. Controlla l’SMS e riprova.";UI.shake=true;render()}}
  },180)}
let otpTimer;
function sendOtp(){UI.otp=String(1000+Math.floor(Math.random()*9000));UI.otpExp=Date.now()+10*60e3;UI.otpWait=Date.now()+30e3;
  const wa=UI.otpChannel==="whatsapp";
  setTimeout(()=>notify(wa?`${UI.otp} è il tuo codice di verifica`:"Clinia",wa?"Per la tua sicurezza non condividere questo codice con nessuno. Scade tra 10 minuti.":`${UI.otp} è il tuo codice di verifica Clinia. Non condividerlo con nessuno.`,wa?"WhatsApp":"Messaggi"),700);
  clearInterval(otpTimer);otpTimer=setInterval(()=>{if(UI.screen!=="otp"){clearInterval(otpTimer);return}
    const w=Math.max(0,Math.ceil((UI.otpWait-Date.now())/1000)),el=$("#otp-wait");if(!el){clearInterval(otpTimer);return}
    if(w)el.querySelector("b").textContent=w;else{clearInterval(otpTimer);render()}},1000)}

  img.onload=()=>{const z=400,c=document.createElement("canvas"),r=Math.max(z/img.width,z/img.height);c.width=c.height=z;c.getContext("2d").drawImage(img,(z-img.width*r)/2,(z-img.height*r)/2,img.width*r,img.height*r);
    UI.ppPhoto=c.toDataURL("image/jpeg",.85);URL.revokeObjectURL(url);const pv=$("#pp-prev");if(pv){pv.querySelector("img")?.remove();pv.insertAdjacentHTML("beforeend",`<img src="${UI.ppPhoto}" alt="">`)}toast("Foto pronta: tocca Salva il profilo")};

/* Archivio dei file sul telefono (IndexedDB): foto delle stanze, ricevute, documenti FPM */
const IDB={db:null,async open(){if(this.db)return this.db;this.db=await new Promise((ok,ko)=>{const r=indexedDB.open("clinia-app",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});return this.db},
  async get(k){try{const db=await this.open();return await new Promise(ok=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(undefined)})}catch(e){return undefined}},
  async set(k,v){try{const db=await this.open();await new Promise((ok,ko)=>{const t=db.transaction("kv","readwrite");v==null?t.objectStore("kv").delete(k):t.objectStore("kv").put(v,k);t.oncomplete=ok;t.onerror=()=>ko(t.error)});return true}catch(e){toast("Spazio esaurito sul telefono: file non salvato");return false}}};
async function loadRoomPhotos(){UI.roomPhotosLoaded=true;UI.roomPhotos={};for(const r of ROOMS)UI.roomPhotos[r.id]=(await IDB.get("room:"+r.id))||[];render()}
const shrink=(file,max=1400)=>new Promise((ok,ko)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{const k=Math.min(1,(img.width/img.height>=1.9?Math.max(max,4096):max)/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.8))};img.onerror=()=>ko(new Error("immagine"));img.src=u});
async function addRoomPhotos(id,files){files=files.filter(f=>f.type.startsWith("image/"));if(!files.length)return toast("Scegli delle foto (JPG o PNG).");
  const l=(await IDB.get("room:"+id))||[];for(const f of files){if(l.length>=6){toast("Massimo 6 foto per stanza");break}try{l.push(await shrink(f,/pano/i.test(f.name)?4096:1400))}catch(e){toast("Non riesco a leggere "+f.name)}}

  const first=await load(photos[0]),asp=first.image.width/first.image.height,arcoFisso=!own.length&&dflt&&dflt.arco||0;
  let arc=0,vHalf=80;
  if(photos.length===1&&(asp>=1.9||arcoFisso)){/* panoramica: cilindro con l’arco coperto dalla foto (circa 60° in verticale) */
    arc=arcoFisso||Math.min(360,asp*60);const R=5,th=T.MathUtils.degToRad(arc),Hc=th*R/asp;vHalf=T.MathUtils.radToDeg(Math.atan(Hc/2/R));
    const g=new T.CylinderGeometry(R,R,Hc,128,1,true,-Math.PI/2-th/2,th);g.scale(-1,1,1);scene.add(new T.Mesh(g,new T.MeshBasicMaterial({map:first,side:T.DoubleSide})));
    const cv=document.createElement("canvas");cv.width=64;cv.height=32;const cx=cv.getContext("2d");cx.drawImage(first.image,0,0,64,32);
    const avg=y=>{const d=cx.getImageData(0,y,64,1).data;let r=0,g2=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g2+=d[i+1];b+=d[i+2]}const n=d.length/4;return new T.Color(r/n/255,g2/n/255,b/n/255)};
    const disc=(y,c)=>{const m=new T.Mesh(new T.CircleGeometry(R,96),new T.MeshBasicMaterial({color:c,side:T.DoubleSide}));m.rotation.x=Math.PI/2;m.position.y=y;scene.add(m)};
