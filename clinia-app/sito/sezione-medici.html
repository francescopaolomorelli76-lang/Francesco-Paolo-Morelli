<section id="clinia-medici" aria-labelledby="cm-titolo">
<style>

<script>
(function(){

  var FOTO="img/specialisti/";
  var MEDICI=[{"id": "enrico-pierangeli", "nome": "Prof. Enrico Pierangeli", "ruolo": "Specialista in Neurochirurgia, Neurologia e Oncologia"}, {"id": "feliciana-pellegrino", "nome": "Dott.ssa Feliciana Pellegrino", "ruolo": "Fisioterapista – Riabilitazione del pavimento pelvico"}, {"id": "michele-picciallo", "nome": "Dott. Michele Picciallo", "ruolo": "Medico chirurgo – Specialista in Dermatologia e Venereologia"}, {"id": "vincenzo-de-leo", "nome": "Dott. Vincenzo De Leo", "ruolo": "Chirurgo generale – Chirurgia oncologica, laparoscopica e robotica"}, {"id": "donato-panetta", "nome": "Dott. Donato Panetta", "ruolo": "Medico chirurgo – Specialista in Ortopedia e Traumatologia"}, {"id": "maria-alessandra-lassandro", "nome": "Dott.ssa Maria Alessandra Lassandro", "ruolo": "Medico chirurgo – Specialista in Allergologia e Immunologia Clinica"}, {"id": "francesca-trabace", "nome": "Francesca Trabace", "ruolo": "Osteopata D.O. – Trattamenti osteopatici"}, {"id": "angelo-costantiello", "nome": "Dott. Angelo Costantiello", "ruolo": "Tecnico ortopedico"}, {"id": "rossella-conversano", "nome": "Rossella Conversano", "ruolo": "Personal Trainer e Attività Motoria Funzionale"}, {"id": "maria-paola-simeone", "nome": "Dott.ssa Maria Paola Simeone", "ruolo": "Ginecologa · Sessuologa · Chirurga"}];
