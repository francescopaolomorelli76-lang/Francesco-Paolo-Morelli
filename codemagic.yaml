# Compilazione iOS nel cloud (Mac di Codemagic) e invio a TestFlight.
# Guida passo passo: docs/TESTFLIGHT.md
workflows:
  # Prova gratuita: app NON firmata da installare con Sideloadly (docs/PROVA_IPHONE.md).
  # Non serve l'account Apple Developer.
  ios-unsigned:
    name: iOS prova (IPA per Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Modello vocale da includere nell'app
        script: ./scripts/fetch_models.sh
      - name: Pacchetti Flutter
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install --repo-update
      - name: Compila senza firma
        script: flutter build ios --release --no-codesign
      - name: Crea IPA
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry MangaVox.ipa Payload
    artifacts:
      - MangaVox.ipa

  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nome della chiave API di App Store Connect aggiunta in Codemagic
      # (Team settings › Integrations › Developer Portal).
      app_store_connect: MangaVox ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.morelli.mangaVox
      vars:
        # "Apple ID" numerico dell'app: App Store Connect › App › Informazioni app
        APP_STORE_APPLE_ID: 0000000000
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/offline-translation-app-32rsjv
          include: true
    scripts:
      - name: Firma del progetto Xcode
        script: xcode-project use-profiles
      - name: Modello vocale da includere nell'app
        script: ./scripts/fetch_models.sh
      - name: Pacchetti Flutter
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install --repo-update
      - name: Test
        script: flutter test
      - name: Compila IPA
        script: |
          BUILD=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0) + 1))
          flutter build ipa --release \
            --build-number=$BUILD \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
