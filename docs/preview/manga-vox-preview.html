<title>Manga Vox Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen app — top bar with mode switch, content area, one big 3D push button centred at the bottom, language pair under it. Single deliberate comic look (ink on paper). */
:root{
  --ink:#111111; --paper:#FFF8E7; --yellow:#FFD60A; --yellow-side:#C79A00; --red:#E63946; --red-side:#9E1B26;
  --cyan:#00B4D8; --cyan-side:#00708A; --white:#ffffff; --muted:#111111aa; --night:#222222;
  --display:'Bangers','Impact','Arial Black',sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.app{height:100%;display:flex;flex-direction:column;position:relative;
  background-color:var(--paper);background-image:radial-gradient(circle,#0000001c 1.3px,transparent 1.7px);background-size:12px 12px}
.app.scan{background-color:var(--night);background-image:radial-gradient(circle,#ffffff22 1.3px,transparent 1.7px)}
.app.live::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 78%,#0000 0 3deg,#00000020 3deg 4deg)}
.notice{position:relative;font-size:12px;font-weight:800;text-align:center;background:var(--yellow);border-bottom:3px solid var(--ink);
  padding-block:5px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.notice.err{background:var(--red);color:var(--white)}
.top{position:relative;display:flex;align-items:center;gap:8px;
  padding-block:8px 0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--display);font-size:30px;letter-spacing:2px;color:var(--yellow);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.spacer{flex:1}
.switch{display:flex;padding:2px;background:var(--white);border:3.5px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink)}
.switch button{width:46px;height:36px;border-radius:3px;font-size:20px;display:grid;place-items:center}
.switch button[aria-pressed="true"]{background:var(--ink)}
.content{position:relative;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;
  padding-block:12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.content.center{justify-content:center}
.bubble{position:relative;max-width:88%;background:var(--white);border:3.5px solid var(--ink);border-radius:24px;
  padding:10px 16px;margin-bottom:16px;filter:drop-shadow(4px 4px 0 var(--ink))}
.bubble.mine{align-self:flex-end}
.bubble.theirs{align-self:flex-start;background:var(--yellow)}
.bubble.hero{align-self:center;max-width:100%;text-align:center}
.bubble::after{content:"";position:absolute;bottom:-17px;left:20%;width:22px;height:18px;background:inherit;
  border-left:3.5px solid var(--ink);border-bottom:3.5px solid var(--ink);transform:skewX(-35deg)}
.bubble.mine::after{left:auto;right:20%;transform:skewX(35deg);border-left:0;border-right:3.5px solid var(--ink)}
.bubble .meta{font-size:14px;display:flex;align-items:center;gap:6px}
.bubble .big{font-weight:900;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.bubble .small{font-style:italic;font-size:13.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.hero h2{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:1px;margin:0 0 4px}
.hero p{margin:0 0 6px;font-weight:700;font-size:15px;text-wrap:balance}
.flags{font-size:22px;letter-spacing:6px}
.panel{background:var(--paper);border:3.5px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);padding:12px}
.photo{width:100%;max-height:30vh;object-fit:cover;border-radius:3px;display:block}
.pair{padding:6px 0;border-bottom:2px solid var(--ink)}
.pair:last-child{border-bottom:0}
.pair .big{font-weight:900;font-size:19px;overflow-wrap:anywhere}
.pair .small{font-style:italic;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hint-on-dark{color:var(--white);font-weight:800;text-align:center;text-wrap:balance}
/* dictation field (web stand-in for hold-to-talk) */
.dictate{position:relative;display:flex;gap:8px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.dictate textarea{flex:1;min-width:0;height:52px;resize:none;font:800 17px/1.25 var(--body);color:var(--ink);background:var(--white);
  border:3.5px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:8px 10px;-webkit-user-select:text;user-select:text}
/* the 3D button */
.stage{position:relative;display:grid;place-items:center;padding-top:14px}
.push{--face:var(--yellow);--side:var(--yellow-side);--fg:var(--ink);--d:24px;--p:3px;
  position:relative;width:min(52vw,210px);aspect-ratio:1;border-radius:50%;margin-bottom:var(--d)}
.push .ring{position:absolute;inset:-14%;border-radius:50%;pointer-events:none;opacity:0}
.push .shadow{position:absolute;inset:0;border-radius:50%;background:var(--ink);transform:translate(8px,calc(var(--d) + 8px))}
.push .body{position:absolute;left:0;right:0;top:50%;height:calc(50% + var(--d));background:var(--side);
  border:5px solid var(--ink);border-top:0;border-radius:0 0 999px 999px / 0 0 calc(50% + 2px) calc(50% + 2px);
  background-image:repeating-linear-gradient(90deg,#00000033 0 2px,transparent 2px 9px)}
.push .face{position:absolute;inset:0;border-radius:50%;border:5px solid var(--ink);display:grid;place-items:center;
  transform:translateY(var(--p));transition:transform 80ms ease-out;
  background:
    radial-gradient(circle,#00000022 1.2px,transparent 1.6px) 0 0/10px 10px,
    radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--face) 50%,white),var(--face) 55%,color-mix(in srgb,var(--face) 88%,black));
  -webkit-mask:none}
.push .face::before{content:"";position:absolute;inset:11%;border-radius:50%;border:2px solid #00000055;
  border-top-color:#ffffffdd;border-left-color:#ffffffaa;border-width:5px 2px 2px 5px}
.push .label{position:relative;font-family:var(--display);font-size:clamp(18px,5.4vw,23px);letter-spacing:1px;line-height:1;color:var(--fg);text-align:center}
.push .label .ico{display:block;font-size:clamp(30px,10vw,46px);margin-bottom:6px}
.push.down .face,.push:active .face{--p:calc(var(--d) - 4px)}
.push.rec{--face:var(--red);--side:var(--red-side);--fg:var(--white)}
.push.busy{--face:var(--cyan);--side:var(--cyan-side)}
.push.rec .ring,.push.busy .ring{animation:ring 1.1s infinite;border:6px solid var(--red)}
.push.busy .ring{border-color:var(--cyan)}
@keyframes ring{from{opacity:.9;transform:scale(.85)}to{opacity:0;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.push .ring{animation:none!important}}
.langs{position:relative;display:flex;justify-content:center;align-items:center;gap:10px;
  padding-block:2px 10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:18px;letter-spacing:1px;
  padding:4px 10px;border:3.5px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);background:var(--yellow);color:var(--ink)}
.chip.partner{background:var(--cyan)}
.chip small{font-size:12px;color:var(--white);-webkit-text-stroke:0}
.chip select{position:absolute;inset:0;opacity:0;width:100%}
.mine-wrap{position:relative}
.swap{font-size:22px;font-weight:900}
.app.scan .swap{color:var(--white)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="app" id="app">
  <div class="notice" id="notice">Anteprima web: nell'app vera tieni premuto e parli; qui detti col 🎤 della tastiera. Tutto offline solo nell'app.</div>
  <div class="top">
    <span class="logo">MANGA VOX</span>
    <span class="spacer"></span>
    <div class="switch" role="group" aria-label="Modalità">
      <button id="m-talk" aria-pressed="true" aria-label="Voce">🎤</button>
      <button id="m-scan" aria-pressed="false" aria-label="Scanner">📷</button>
    </div>
  </div>

  <div class="content center" id="content"></div>

  <div class="dictate" id="dictate" hidden>
    <label class="vh" for="txt">Frase da tradurre</label>
    <textarea id="txt" placeholder="Tocca 🎤 sulla tastiera e parla…" enterkeyhint="send"></textarea>
  </div>

  <div class="stage">
    <button class="push" id="push" aria-label="Pulsante principale">
      <span class="ring"></span><span class="shadow"></span><span class="body"></span>
      <span class="face"><span class="label" id="push-label"></span></span>
    </button>
    <input type="file" id="cam" accept="image/*" capture="environment" class="vh" tabindex="-1">
  </div>

  <div class="langs">
    <span class="mine-wrap chip" id="mine-chip">
      IO <span id="mine-flag"></span>
      <label class="vh" for="mine-sel">La mia lingua</label>
      <select id="mine-sel"></select>
    </span>
    <span class="swap" aria-hidden="true">⇄</span>
    <span class="chip partner" id="partner-chip"></span>
  </div>
</div>

<script>
const LANGS = {
  it:{flag:'🇮🇹',short:'IT',locale:'it-IT',name:'Italian',label:'Italiano'},
  en:{flag:'🇬🇧',short:'EN',locale:'en-US',name:'English',label:'English'},
  de:{flag:'🇩🇪',short:'DE',locale:'de-DE',name:'German',label:'Deutsch'},
  fr:{flag:'🇫🇷',short:'FR',locale:'fr-FR',name:'French',label:'Français'},
  ru:{flag:'🇷🇺',short:'RU',locale:'ru-RU',name:'Russian',label:'Русский'},
  zh:{flag:'🇨🇳',short:'ZH',locale:'zh-CN',name:'Simplified Chinese',label:'中文'},
};
const store={get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const deviceLang=(navigator.languages||[navigator.language||'en']).map(l=>l.slice(0,2).toLowerCase()).find(l=>LANGS[l])||'en';
const S={
  mode:'talk', btn:'idle', msgs:[], scan:null,
  mine: store.get('mv2_mine',deviceLang),
  partner: store.get('mv2_partner',deviceLang==='en'?'it':'en'),
};
let sample=null;
const $=id=>document.getElementById(id);

/* same routing as the app: my language -> partner; anything else becomes the partner and goes -> mine */
function route(detected,commit){
  if(detected===S.mine){ if(S.partner===S.mine) S.partner=S.mine==='en'?'it':'en'; return [S.mine,S.partner]; }
  if(commit){ S.partner=detected; store.set('mv2_partner',S.partner); }
  return [detected,S.mine];
}

function primeSpeech(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch{}}
function speak(text,code){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LANGS[code].locale;u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(code));if(v)u.voice=v;speechSynthesis.speak(u)}catch{}
}
function notice(msg,err){const n=$('notice');n.textContent=msg;n.classList.toggle('err',!!err)}
const ERR={not_granted:'Serve il permesso per usare Claude: senza, l\'anteprima non può tradurre.',rate_limited:'Troppe richieste: riprova tra poco.',
  session_expired:'Sessione scaduta: accedi di nuovo a Claude.',image_rejected:'Foto non valida o troppo grande.'};

function render(){
  const app=$('app'); app.classList.toggle('scan',S.mode==='scan'); app.classList.toggle('live',S.btn==='rec');
  $('m-talk').setAttribute('aria-pressed',S.mode==='talk'); $('m-scan').setAttribute('aria-pressed',S.mode==='scan');
  $('m-talk').style.filter=S.mode==='talk'?'':'grayscale(1)'; $('m-scan').style.filter=S.mode==='scan'?'':'grayscale(1)';
  const push=$('push'); push.classList.toggle('rec',S.btn==='rec'); push.classList.toggle('busy',S.btn==='busy');
  const label = S.btn==='busy' ? '<span class="ico">⏳</span>TRADUCO…'
    : S.mode==='scan' ? '<span class="ico">📷</span>SCATTA!'
    : S.btn==='rec' ? '<span class="ico">🎙</span>TOCCA PER<br>TRADURRE' : '<span class="ico">🎤</span>TOCCA<br>E PARLA';
  $('push-label').innerHTML=label;
  $('dictate').hidden=!(S.mode==='talk'&&S.btn==='rec');
  $('mine-flag').textContent=LANGS[S.mine].flag+' '+LANGS[S.mine].short;
  $('partner-chip').innerHTML=`${LANGS[S.partner].flag} ${LANGS[S.partner].short} <small>AUTO</small>`;
  const c=$('content'); c.innerHTML='';
  if(S.mode==='talk'){
    c.classList.toggle('center',!S.msgs.length);
    if(!S.msgs.length){
      c.innerHTML=`<div class="bubble hero"><h2>PARLA IN QUALSIASI LINGUA!</h2><p>La riconosco da sola: se parli ${LANGS[S.mine].label} traduco per l'altro, se l'altro risponde traduco per te.</p><div class="flags">${Object.values(LANGS).map(l=>l.flag).join(' ')}</div></div>`;
    }
    for(const m of S.msgs){
      const b=document.createElement('div'); const mine=m.from===S.mine;
      b.className='bubble '+(mine?'mine':'theirs');
      b.innerHTML=`<div class="meta">${LANGS[m.from].flag} ➜ ${LANGS[m.to].flag} 🔊</div><div class="big"></div><div class="small"></div>`;
      b.querySelector('.big').textContent=m.t; b.querySelector('.small').textContent=m.o;
      b.onclick=()=>speak(m.t,m.to); c.append(b);
    }
    c.scrollTop=c.scrollHeight;
  } else {
    c.classList.add('center');
    if(S.btn==='busy'&&S.scan?.img){c.innerHTML=`<div class="panel"><img class="photo" src="${S.scan.img}" alt="Foto"></div><p class="hint-on-dark">Leggo e riconosco la lingua… ⚡</p>`;return}
    if(!S.scan){c.innerHTML='<p class="hint-on-dark">Fotografa un cartello, un menù o un documento: riconosco la lingua e traduco.</p>';return}
    const p=document.createElement('div'); p.className='panel';
    p.innerHTML=`${S.scan.img?`<img class="photo" src="${S.scan.img}" alt="Foto">`:''}<div class="meta" style="margin:8px 0;font-size:16px">${LANGS[S.scan.from].flag} ➜ ${LANGS[S.scan.to].flag}</div>`;
    for(const it of S.scan.items){const d=document.createElement('div');d.className='pair';d.innerHTML='<div class="big"></div><div class="small"></div>';
      d.querySelector('.big').textContent=it.t;d.querySelector('.small').textContent=it.o;d.onclick=()=>speak(it.t,S.scan.to);p.append(d)}
    c.append(p);
  }
}

async function translateTalk(){
  const text=$('txt').value.trim();
  if(!text){ $('txt').focus(); return; }
  if(!sample){notice('Apri questa pagina dentro Claude per provare la traduzione.',true);return}
  primeSpeech();
  S.btn='busy'; render();
  try{
    const codes=Object.keys(LANGS).join(', ');
    const r=await sample.json(
      `Detect the language of the text below. Answer with its code among: ${codes} (or "xx" if none). `+
      `If the code is "${S.mine}", translate it into ${LANGS[S.partner].name}; otherwise translate it into ${LANGS[S.mine].name}. `+
      `It is spoken dialogue between travellers: keep it natural. Reply with only JSON like {"lang":"en","t":"translation"}.\n\nText:\n${text}`,
      {modelTier:'quick'});
    const lang=String(r?.lang||'');
    if(!LANGS[lang]){notice('Lingua non riconosciuta: IT, EN, DE, FR, RU, ZH.',true);return}
    const [from,to]=route(lang,true);
    let t=String(r?.t||'').trim();
    if(!t) throw {code:'empty'};
    S.msgs.push({from,to,o:text,t}); $('txt').value='';
    speak(t,to);
  }catch(e){ if(e?.code!=='cancelled') notice(ERR[e?.code]||'Traduzione non riuscita. Riprova.',true); }
  finally{ S.btn='idle'; render(); }
}

async function scanFile(file){
  if(!file) return;
  S.scan={img:URL.createObjectURL(file),items:[]}; S.btn='busy'; render();
  if(!sample){notice('Apri questa pagina dentro Claude per provare lo scanner.',true);S.btn='idle';S.scan=null;render();return}
  try{
    const codes=Object.keys(LANGS).join(', ');
    const r=await sample.json(
      `The image is a photo of text (sign, menu, document). Detect the main language (one of: ${codes}, or "xx"). `+
      `If it is "${S.mine}" translate into ${LANGS[S.partner].name}, otherwise into ${LANGS[S.mine].name}. `+
      `Read every text block in reading order. Reply with only JSON like {"lang":"de","items":[{"o":"original","t":"translation"}]}. If there is no text, items is [].`,
      {images:[file]});
    const lang=String(r?.lang||''); const items=Array.isArray(r?.items)?r.items.filter(x=>x&&x.t).map(x=>({o:String(x.o??''),t:String(x.t)})):[];
    if(!items.length||!LANGS[lang]){notice(items.length?'Lingua del testo non riconosciuta.':'Nessun testo trovato: avvicinati e riprova.',true);S.scan=null;return}
    const [from,to]=route(lang,false);
    S.scan={img:S.scan.img,from,to,items};
  }catch(e){ notice(ERR[e?.code]||'Scansione non riuscita. Riprova.',true); S.scan=null; }
  finally{ S.btn='idle'; render(); }
}

/* wiring */
const push=$('push');
push.addEventListener('pointerdown',()=>{push.classList.add('down');try{navigator.vibrate?.(15)}catch{}});
for(const ev of ['pointerup','pointerleave','pointercancel']) push.addEventListener(ev,()=>push.classList.remove('down'));
push.addEventListener('click',()=>{
  if(S.btn==='busy') return;
  if(S.mode==='scan'){ $('cam').click(); return; }
  if(S.btn==='idle'){ S.btn='rec'; render(); $('txt').focus(); return; }
  translateTalk();
});
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();translateTalk()}});
$('cam').onchange=e=>{scanFile(e.target.files[0]);e.target.value=''};
$('m-talk').onclick=()=>{if(S.btn==='busy')return;S.mode='talk';S.btn='idle';render()};
$('m-scan').onclick=()=>{if(S.btn==='busy')return;S.mode='scan';S.btn='idle';render()};
$('mine-sel').innerHTML=Object.entries(LANGS).map(([k,l])=>`<option value="${k}">${l.flag} ${l.label}</option>`).join('');
$('mine-sel').value=S.mine;
$('mine-sel').onchange=e=>{S.mine=e.target.value;store.set('mv2_mine',S.mine);if(S.partner===S.mine){S.partner=S.mine==='en'?'it':'en'}render()};
render();
try{speechSynthesis.getVoices()}catch{}
(async()=>{try{sample=await window.claude?.use?.('sample')}catch{sample=null}
  if(!sample) notice('Apri questa pagina dentro Claude per provare la traduzione.',true)})();
</script>
