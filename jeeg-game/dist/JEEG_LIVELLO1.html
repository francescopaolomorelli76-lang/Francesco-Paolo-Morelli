<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
canvas{display:block;background:#0a0f2a;image-rendering:auto}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}
body.touch #touch{display:block}
#touch button{pointer-events:auto;touch-action:none;border:3px solid #1b1020;border-radius:50%;width:68px;height:68px;font:bold 22px Impact,'Arial Black',sans-serif;color:#1b1020;background:rgba(255,225,74,.55);box-shadow:0 3px 0 rgba(0,0,0,.35)}
#touch button.on{background:rgba(255,255,255,.85);transform:translateY(2px)}
#touch button.small{width:auto;height:40px;border-radius:12px;padding:0 12px;font-size:14px}
#touch .pad{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end}
#touch .pad.left{left:calc(14px + env(safe-area-inset-left))}
#touch .pad.left button.small{border-radius:50%;width:48px;height:48px;margin-bottom:10px}
#touch .pad.right{right:calc(14px + env(safe-area-inset-right));display:grid;grid-template-columns:auto auto auto;grid-template-areas:"t sel ab" ". a b";gap:8px 10px;align-items:center}
#touch .pad.right .t{grid-area:t;background:rgba(200,48,42,.75);color:#fff}
#touch .pad.right [data-btn=SEL]{grid-area:sel;background:rgba(74,200,255,.6)}
#touch .pad.right .ab{grid-area:ab;width:56px;height:56px;font-size:15px;background:rgba(255,138,42,.7)}
#touch .pad.right .a{grid-area:a;background:rgba(255,90,74,.7)}
#touch .pad.right .b{grid-area:b;background:rgba(74,160,255,.7)}
#touch .top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px}
</style>

/* ---- src/input.js ---- */
/* input.js — tastiera, gamepad (Gamepad API / encoder arcade USB), touch.
 * Pulsanti LOGICI: left right up down A B AB T SEL START.
 * A+B: finestra di simultaneità (ritardo 4 frame) per evitare pugno+salto involontari.
 */
'use strict';
(function () {
  const LOGICAL = ['left', 'right', 'up', 'down', 'A', 'B', 'AB', 'T', 'SEL', 'START'];

  /* Mappa di default: compatibile con encoder arcade in modalità tastiera (layout MAME P1)
   * e con tastiera PC. */
  const DEFAULT_KEYS = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down',
    KeyZ: 'A', KeyJ: 'A', ControlLeft: 'A',
    KeyX: 'B', KeyK: 'B', AltLeft: 'B', Space: 'B',
    KeyV: 'AB', KeyU: 'AB',
    KeyT: 'T', KeyL: 'T', ShiftLeft: 'T',
    KeyC: 'SEL', KeyI: 'SEL', KeyQ: 'SEL',
    Enter: 'START', Digit1: 'START', Escape: 'START', KeyP: 'START', Digit5: 'START',
  };
  /* Gamepad "standard": 0=A(sud) 1=B(est) 2=X 3=Y 8=select 9=start 12-15=croce */
  const DEFAULT_PAD = { 0: 'A', 1: 'B', 2: 'T', 3: 'SEL', 4: 'AB', 5: 'AB', 8: 'SEL', 9: 'START', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };

  const held = {}; const prevHeld = {};
  const pressed = {};
  const kbHeld = {}; const touchHeld = {}; const padHeld = {};
  let keyMap = Object.assign({}, DEFAULT_KEYS);
  let padMap = Object.assign({}, DEFAULT_PAD);
  let lastDevice = 'keyboard';

  try {
    const saved = JSON.parse(localStorage.getItem(J.BINDINGS_KEY) || 'null');
    if (saved && saved.keys) keyMap = Object.assign({}, DEFAULT_KEYS, saved.keys);
    if (saved && saved.pad) padMap = Object.assign({}, saved.pad);
  } catch (e) { /* storage non disponibile */ }

  /* --- Rimappatura (menu CONFIGURA COMANDI) --- */
  let remapListener = null;
  function captureNext(cb) { remapListener = cb; }

  addEventListener('keydown', (e) => {
    J.audio && J.audio.unlock();
    if (remapListener) { e.preventDefault(); const cb = remapListener; remapListener = null; cb({ kind: 'key', code: e.code }); return; }
    const l = keyMap[e.code];
    if (l) { e.preventDefault(); kbHeld[l] = (kbHeld[l] || 0) | 1; kbHeld['_' + e.code] = l; lastDevice = 'keyboard'; }
  });
  addEventListener('keyup', (e) => {
    const l = keyMap[e.code];
    if (l) {
      e.preventDefault();
      delete kbHeld['_' + e.code];
      // il pulsante logico resta premuto se un altro tasto mappato sullo stesso è ancora giù
      kbHeld[l] = Object.keys(kbHeld).some((k) => k[0] === '_' && kbHeld[k] === l) ? 1 : 0;
    }
  });
  addEventListener('blur', () => { for (const k in kbHeld) delete kbHeld[k]; for (const k in touchHeld) delete touchHeld[k]; });

  /* --- Touch: pulsanti HTML con data-btn --- */
  function bindTouch(root) {
    root.querySelectorAll('[data-btn]').forEach((el) => {
      const names = el.dataset.btn.split(',');
      const down = (e) => { e.preventDefault(); J.audio && J.audio.unlock(); try { el.setPointerCapture(e.pointerId); } catch (_) {} names.forEach((n) => (touchHeld[n] = 1)); el.classList.add('on'); lastDevice = 'touch'; };
      const up = (e) => { e && e.preventDefault(); names.forEach((n) => (touchHeld[n] = 0)); el.classList.remove('on'); };
      el.addEventListener('pointerdown', down);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('lostpointercapture', up);
    });
  }

  let padPrevButtons = [];
  function pollPad() {
    for (const k in padHeld) padHeld[k] = 0;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp) continue;
      const btns = gp.buttons.map((b) => (typeof b === 'object' ? b.pressed || b.value > 0.5 : b === 1));
      if (remapListener) {
        for (let i = 0; i < btns.length; i++) if (btns[i] && !padPrevButtons[i]) { const cb = remapListener; remapListener = null; cb({ kind: 'pad', index: i }); break; }
      }
      padPrevButtons = btns;
      btns.forEach((p, i) => { if (p && padMap[i]) { padHeld[padMap[i]] = 1; lastDevice = 'pad'; } });
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (ax < -0.45) padHeld.left = 1;
      if (ax > 0.45) padHeld.right = 1;
      if (ay < -0.55) padHeld.up = 1;
      if (ay > 0.55) padHeld.down = 1;
      break; // giocatore 1 = primo controller connesso
    }
  }

  /* --- Risoluzione A / B / A+B --- */
  const COMBO_FRAMES = 4;
  let pendA = 0, pendB = 0;
  const actions = { attack: false, jump: false, beam: false };

  function update() {
    pollPad();
    for (const l of LOGICAL) {
      prevHeld[l] = held[l];
      held[l] = !!(kbHeld[l] || touchHeld[l] || padHeld[l]);
      pressed[l] = held[l] && !prevHeld[l];
    }
    actions.attack = actions.jump = actions.beam = false;
    if (pressed.AB) { actions.beam = true; pendA = pendB = 0; return; }
    const pA = pressed.A, pB = pressed.B;
    if ((pA && (pB || pendB)) || (pB && pendA)) { actions.beam = true; pendA = pendB = 0; return; }
    if (pA) pendA = COMBO_FRAMES;
    if (pB) pendB = COMBO_FRAMES;
    if (pendA && --pendA === 0) actions.attack = true;
    if (pendB && --pendB === 0) actions.jump = true;
  }
  /* Nei menu: azioni immediate senza buffer */
  function menuPressed(l) { return !!pressed[l]; }

  function setBinding(logical, ev) {
    if (ev.kind === 'key') {
      keyMap[ev.code] = logical; // aggiunge il tasto (i tasti di default restano attivi)
    } else {
      for (const k in padMap) if (padMap[k] === logical) delete padMap[k];
      padMap[ev.index] = logical;
    }
    try { localStorage.setItem(J.BINDINGS_KEY, JSON.stringify({ keys: keyMap, pad: padMap })); } catch (e) {}
  }
  function resetBindings() {
    keyMap = Object.assign({}, DEFAULT_KEYS); padMap = Object.assign({}, DEFAULT_PAD);
    try { localStorage.removeItem(J.BINDINGS_KEY); } catch (e) {}
  }
  function clearAll() { pendA = pendB = 0; for (const l of LOGICAL) { pressed[l] = false; } }
  /* Iniezione per test automatici */
  function inject(l, v) { touchHeld[l] = v ? 1 : 0; }

  J.input = { held, pressed, actions, update, menuPressed, bindTouch, captureNext, setBinding, resetBindings, clearAll, inject, LOGICAL,
    get device() { return lastDevice; } };
})();

/* ---- src/audio.js ---- */
/* audio.js — effetti sonori e musica ORIGINALI sintetizzati in WebAudio.
 * Nessun brano o campione della serie è incluso (vedi note licenze nel README).
 */
'use strict';
(function () {
  let ctx = null, master = null, musicGain = null, sfxGain = null;
  let musicOn = true, musicTimer = null, step = 0, currentSong = null;

  function unlock() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
    musicGain = ctx.createGain(); musicGain.gain.value = 0.32; musicGain.connect(master);
    sfxGain = ctx.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(master);
    if (currentSong) startMusic(currentSong);
  }

  function tone(freq, dur, type, vol, slide, dest, when) {
    if (!ctx) return;
    const t = (when || ctx.currentTime);
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(dest || sfxGain); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, filterFreq, dest) {
    if (!ctx) return;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1800;
    const g = ctx.createGain(); g.gain.value = vol || 0.3;
    src.connect(f); f.connect(g); g.connect(dest || sfxGain); src.start();
  }

  const SFX = {
    punch: () => { noise(0.08, 0.35, 2400); tone(180, 0.08, 'square', 0.12, 90); },
    kick: () => { noise(0.12, 0.45, 1600); tone(140, 0.12, 'square', 0.15, 60); },
    whoosh: () => noise(0.09, 0.12, 4000),
    jump: () => tone(300, 0.14, 'square', 0.1, 620),
    land: () => noise(0.06, 0.15, 600),
    hurt: () => { tone(420, 0.18, 'sawtooth', 0.18, 110); noise(0.1, 0.2, 1200); },
    enemyHit: () => { noise(0.07, 0.3, 3000); tone(520, 0.06, 'square', 0.08, 300); },
    enemyDie: () => { noise(0.35, 0.4, 900); tone(220, 0.3, 'sawtooth', 0.12, 50); },
    pickup: () => { tone(660, 0.08, 'square', 0.12); tone(990, 0.14, 'square', 0.12, null, null, ctx && ctx.currentTime + 0.07); },
    gloves: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'square', 0.13, null, null, ctx && ctx.currentTime + i * 0.09)); },
    checkpoint: () => { [392, 523, 784].forEach((f, i) => tone(f, 0.2, 'triangle', 0.2, null, null, ctx && ctx.currentTime + i * 0.1)); },
    transform: () => { tone(110, 1.2, 'sawtooth', 0.18, 880); noise(1.0, 0.18, 5000); },
    magnet: () => { tone(1200, 0.25, 'sine', 0.15, 300); noise(0.15, 0.3, 1500); tone(80, 0.25, 'square', 0.2, 40); },
    shooter: () => noise(1.2, 0.18, 700),
    gamma: () => { tone(220, 0.7, 'sawtooth', 0.2, 440); tone(330, 0.7, 'square', 0.08, 660); },
    proton: () => { tone(1800, 0.9, 'sine', 0.15, 600); tone(900, 0.9, 'sawtooth', 0.1, 1400); noise(0.6, 0.2, 6000); },
    denied: () => tone(140, 0.15, 'square', 0.12, 120),
    select: () => tone(880, 0.06, 'square', 0.1),
    bossWarn: () => { [0, 0.3, 0.6].forEach((d) => tone(440, 0.2, 'square', 0.15, 330, null, ctx && ctx.currentTime + d)); },
    telegraph: () => tone(900, 0.12, 'square', 0.1, 1200),
    slam: () => { noise(0.5, 0.6, 400); tone(60, 0.5, 'sine', 0.4, 30); },
    explode: () => { noise(1.2, 0.7, 700); tone(90, 1.0, 'sawtooth', 0.25, 30); },
    win: () => { [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'square', 0.13, null, null, ctx && ctx.currentTime + i * 0.13)); },
    die: () => { [440, 370, 311, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.18, null, null, ctx && ctx.currentTime + i * 0.15)); },
  };
  function play(name) { try { if (ctx && SFX[name]) SFX[name](); } catch (e) {} }

  /* Musica originale: progressioni semplici in stile anni '70 (basso + lead) */
  const SONGS = {
    stage: { bpm: 152, bass: [45, 45, 57, 45, 43, 43, 55, 43, 41, 41, 53, 41, 43, 43, 55, 47],
      lead: [69, 0, 72, 74, 76, 0, 74, 72, 74, 0, 72, 69, 67, 0, 69, 0, 65, 0, 69, 72, 74, 0, 72, 69, 71, 0, 67, 71, 74, 0, 76, 0] },
    boss: { bpm: 168, bass: [40, 40, 52, 40, 41, 41, 53, 41, 40, 40, 52, 40, 38, 38, 50, 39],

  function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

  function buildLayers() {
    layers = {};
    /* Montagne lontane */
    {
      const c = makeCanvas(1920, 300), x = c.getContext('2d'); const r = rng(7);

      pts[24][1] = pts[0][1];
      x.beginPath(); x.moveTo(0, 300); for (const p of pts) x.lineTo(p[0], p[1]); x.lineTo(1920, 300); x.closePath();

        const a = pts[i], b = pts[i + 1];
        if (a[1] < b[1]) { x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.lineTo(b[0] - 20, 300); x.lineTo(a[0] + 10, 300); x.closePath(); x.fillStyle = 'rgba(70,80,150,0.35)'; x.fill(); }
        if (a[1] < 150) { x.beginPath(); x.moveTo(a[0] - 18, a[1] + 22); x.lineTo(a[0], a[1]); x.lineTo(a[0] + 20, a[1] + 26); x.closePath(); x.fillStyle = '#eef2ff'; x.fill(); }
      }
      layers.mountains = c;
    }
    /* Colline verdi */
    {
      const c = makeCanvas(1920, 220), x = c.getContext('2d'); const r = rng(21);
      x.beginPath(); x.moveTo(0, 220);
      for (let i = 0; i <= 1920; i += 40) x.lineTo(i, 70 + Math.sin(i / 180) * 30 + Math.sin(i / 70) * 10 + r() * 6);
      x.lineTo(1920, 220); x.closePath(); x.fillStyle = '#4f9a5c'; x.fill(); x.strokeStyle = '#2b5f3a'; x.lineWidth = 2; x.stroke();
      for (let i = 0; i < 40; i++) { const tx = r() * 1920, ty = 100 + r() * 60; x.beginPath(); x.ellipse(tx, ty, 18 + r() * 14, 12 + r() * 6, 0, 0, Math.PI * 2); x.fillStyle = r() > 0.5 ? '#3c8049' : '#5aae66'; x.fill(); x.strokeStyle = '#25502f'; x.lineWidth = 1.5; x.stroke(); }
      layers.hills = c;
    }
    /* Periferia: palazzi */
    {
      const c = makeCanvas(1920, 300), x = c.getContext('2d'); const r = rng(99);
      let px = 0;
      while (px < 1920) {
        const w = 70 + r() * 90, h = 90 + r() * 170; const cols = ['#d8c9a8', '#b9c3cf', '#c9b1a0', '#a8b7c9', '#e1d7c0'];
        const col = cols[Math.floor(r() * cols.length)];
        x.fillStyle = col; x.fillRect(px, 300 - h, w, h);
        x.fillStyle = 'rgba(40,40,80,0.18)'; x.fillRect(px + w * 0.7, 300 - h, w * 0.3, h);
        x.strokeStyle = '#3a3550'; x.lineWidth = 2; x.strokeRect(px, 300 - h, w, h);
        x.fillStyle = '#5b6b96';
        for (let wy = 300 - h + 12; wy < 290; wy += 22) for (let wx = px + 10; wx < px + w - 14; wx += 20) if (r() > 0.15) x.fillRect(wx, wy, 10, 12);
        if (r() > 0.6) { x.fillStyle = '#c0392b'; x.fillRect(px + w / 2 - 2, 300 - h - 26, 4, 26); }
        px += w + 6 + r() * 30;
      }
      layers.city = c;
    }
    /* Periferia devastata */
    {
      const c = makeCanvas(1920, 300), x = c.getContext('2d'); const r = rng(5);
      let px = 0;
      while (px < 1920) {
        const w = 80 + r() * 110, h = 60 + r() * 170;
        x.beginPath(); x.moveTo(px, 300); x.lineTo(px, 300 - h);
        const n = 3 + Math.floor(r() * 4);
        for (let k = 1; k <= n; k++) x.lineTo(px + (w * k) / n, 300 - h + (r() * 60 - 10));
        x.lineTo(px + w, 300); x.closePath();
        x.fillStyle = r() > 0.5 ? '#6f5f6e' : '#7d6a62'; x.fill(); x.strokeStyle = '#2a1f2c'; x.lineWidth = 2; x.stroke();
        x.fillStyle = '#2b2236';
        for (let wy = 300 - h + 30; wy < 290; wy += 24) for (let wx = px + 10; wx < px + w - 12; wx += 22) if (r() > 0.35) x.fillRect(wx, wy, 9, 12);
        px += w + r() * 40;
      }
      layers.ruins = c;
    }
  }

  function tile(img, offset, y, scale) {
    const w = img.width * scale;
    let x = -((offset % w) + w) % w;
    for (; x < J.VIEW_W; x += w) J.g.drawImage(img, x, y, w, img.height * scale);
  }

  /* fattore di "devastazione" in base alla posizione (0 = circuito, 1 = zona giganti) */
  function ruinMix(camX) { return Math.max(0, Math.min(1, (camX - 2000) / 900)); }

  function drawSky(cam, t) {
    const g = J.g; const m = ruinMix(cam.x);
    const gr = g.createLinearGradient(0, 0, 0, J.VIEW_H);
    if (m < 1) { gr.addColorStop(0, '#2f6fd2'); gr.addColorStop(0.55, '#86c3ef'); gr.addColorStop(1, '#e8f2f0'); }
    g.fillStyle = gr; g.fillRect(0, 0, J.VIEW_W, J.VIEW_H);
    if (m > 0) {
      const g2 = g.createLinearGradient(0, 0, 0, J.VIEW_H);
      g2.addColorStop(0, '#3b2a5e'); g2.addColorStop(0.5, '#c0574a'); g2.addColorStop(1, '#f2b06a');
      g.globalAlpha = m; g.fillStyle = g2; g.fillRect(0, 0, J.VIEW_W, J.VIEW_H); g.globalAlpha = 1;
    }
    // nuvole cel-shaded
    const r = rng(3);
    for (let i = 0; i < 7; i++) {
      const bx = r() * 1800, by = 40 + r() * 130, s = 0.7 + r() * 0.8;
      let x = ((bx - cam.x * 0.05 - t * 6) % 1900 + 1900) % 1900 - 200;
      drawCloud(x, by, s, m);
    }
  }
  function drawCloud(x, y, s, m) {
    const g = J.g;
    const base = m > 0.5 ? '#e7a7a0' : '#ffffff', sh = m > 0.5 ? '#a9617a' : '#b9d4ee';
    const blobs = [[0, 0, 40], [38, -14, 34], [74, 0, 38], [30, 10, 36], [-30, 8, 26], [104, 10, 24]];
    g.save(); g.translate(x, y); g.scale(s, s * 0.8);
    g.fillStyle = '#5a6ea0';
    for (const b of blobs) { g.beginPath(); g.arc(b[0], b[1], b[2] + 2.5, 0, 7); g.fill(); }
    g.fillStyle = base; for (const b of blobs) { g.beginPath(); g.arc(b[0], b[1], b[2], 0, 7); g.fill(); }
    g.fillStyle = sh; for (const b of blobs) { g.beginPath(); g.arc(b[0] + 4, b[1] + b[2] * 0.45, b[2] * 0.62, 0, 7); g.fill(); }
    g.restore();
  }

  function drawParallax(cam, t) {
    if (!layers) buildLayers();
    const g = J.g; const z = cam.zoom; const m = ruinMix(cam.x);
    const horizon = 300 + (1 - z) * 60;
    tile(layers.mountains, cam.x * 0.06, horizon - 200, 1);
    tile(layers.hills, cam.x * 0.12, horizon - 60, 1);
    const cityY = horizon - 120 + (1 - z) * 20;
    if (m < 1) { g.globalAlpha = 1 - m; tile(layers.city, cam.x * 0.25, cityY, 0.9 + (z - 0.52) * 0.2); }
    if (m > 0) { g.globalAlpha = m; tile(layers.ruins, cam.x * 0.25, cityY, 1); }
    g.globalAlpha = 1;
    // colonne di fumo nella zona dei giganti
    if (m > 0) {
      for (let i = 0; i < 4; i++) {
        const sx = ((i * 520 - cam.x * 0.3) % 2080 + 2080) % 2080 - 100;
        for (let k = 0; k < 6; k++) {
          const yy = cityY + 40 - k * 45 - ((t * 20) % 45), rr = 22 + k * 9;
          g.globalAlpha = m * (0.55 - k * 0.07);
          g.fillStyle = k % 2 ? '#4a3b4f' : '#5b4a5d';
          g.beginPath(); g.arc(sx + Math.sin(t + k + i) * 10 + k * 8, yy, rr, 0, 7); g.fill();
        }
        g.globalAlpha = m * 0.8; g.fillStyle = '#ff9a3a';
        g.beginPath(); g.ellipse(sx, cityY + 70, 20, 8 + Math.sin(t * 9 + i) * 3, 0, 0, 7); g.fill();
      }
      g.globalAlpha = 1;
    }
  }

  /* ---- elementi in coordinate MONDO (già trasformati da camera) ---- */
  function drawWorldBack(cam, level, t) {
    const g = J.g; const S = sp();
    const x0 = cam.x - 40, x1 = cam.x + J.VIEW_W / cam.zoom + 40; const gy = level.groundY;
    // tribune del circuito (solo zona iniziale)
    if (x0 < 2700) {
      for (let bx = Math.floor(x0 / 600) * 600; bx < Math.min(x1, 2700); bx += 600) {
        if (bx < 0) continue;
        S.poly([bx + 40, gy - 30, bx + 70, gy - 150, bx + 330, gy - 150, bx + 360, gy - 30], '#c9ccd6', 2);
        for (let k = 0; k < 6; k++) S.line(bx + 64 - k * 4 + 4, gy - 140 + k * 18, bx + 336 + k * 4 - 4, gy - 140 + k * 18, '#8d93a8', 2);
        // pubblico stilizzato
        for (let k = 0; k < 26; k++) for (let row = 0; row < 3; row++) { const cx = bx + 90 + k * 9.5 + (row % 2) * 4, cy = gy - 128 + row * 18; S.circ(cx, cy, 3.2, ['#e05a4a', '#4a7ae0', '#f2d34a', '#ffffff'][(k + row) % 4], 0); }
        S.poly([bx + 60, gy - 150, bx + 70, gy - 175, bx + 330, gy - 175, bx + 340, gy - 150], '#d7472f', 2);
        g.fillStyle = '#fff'; g.font = 'bold 16px Impact, "Arial Black", sans-serif'; g.fillText('CIRCUITO', bx + 160, gy - 156);
      }
      // recinzione
      for (let fx = Math.floor(x0 / 30) * 30; fx < Math.min(x1, 2700); fx += 30) { if (fx < 0) continue; S.line(fx, gy - 34, fx, gy - 4, '#6c7183', 2); }
      S.line(Math.max(0, x0), gy - 32, Math.min(x1, 2700), gy - 32, '#6c7183', 2.5);
      S.line(Math.max(0, x0), gy - 18, Math.min(x1, 2700), gy - 18, '#6c7183', 1.5);
      // pile di pneumatici
      for (const tx of [300, 1100, 1700, 2560]) if (tx > x0 - 50 && tx < x1) for (let k = 0; k < 3; k++) { S.ell(tx, gy - 6 - k * 10, 18, 6, '#26262c', 0, 1.6); S.ell(tx, gy - 6 - k * 10, 9, 3, '#4a4a52', 0, 0); }
      // moto di Hiroshi parcheggiata (decorazione)
      if (x0 < 260) drawBike(160, gy, t);
    }
    // grande striscione "zona pericolosa" al cancello dei giganti
    const gx = level.giantGateX;
    if (gx > x0 - 300 && gx < x1 + 300) {
      for (let k = -1; k <= 1; k += 2) S.cap(gx + k * 70, gy, gx + k * 70, gy - 260, 6, '#8a8f9e', '#5d6170');
      S.poly([gx - 76, gy - 255, gx + 76, gy - 255, gx + 76, gy - 205, gx - 76, gy - 205], '#f2d23a', 2);
      for (let k = 0; k < 8; k++) S.polyNoOl([gx - 76 + k * 19, gy - 205, gx - 66 + k * 19, gy - 205, gx - 76 + k * 19 + 10, gy - 215, gx - 76 + k * 19, gy - 215], '#1b1020');
      g.fillStyle = '#1b1020'; g.font = 'bold 15px Impact, "Arial Black", sans-serif'; g.textAlign = 'center'; g.fillText('PERICOLO', gx, gy - 232); g.textAlign = 'left';
    }
    // zona devastata: crateri e auto rovesciate
    if (x1 > 2700) {
      for (let cx = Math.max(2800, Math.floor(x0 / 700) * 700 + 300); cx < x1; cx += 700) {
        S.ell(cx, gy + 4, 110, 16, '#5a4636', 0, 2); S.ell(cx, gy + 2, 80, 9, '#3b2d24', 0, 0);
      }
    }
  }
  function drawBike(x, gy, t) {
    const S = sp();
    S.circ(x - 28, gy - 14, 13, '#1f1f24', 2); S.circ(x - 28, gy - 14, 6, '#c8ccd6', 1.4);
    S.circ(x + 30, gy - 14, 13, '#1f1f24', 2); S.circ(x + 30, gy - 14, 6, '#c8ccd6', 1.4);
    S.poly([x - 30, gy - 22, x - 10, gy - 40, x + 22, gy - 40, x + 34, gy - 22, x + 8, gy - 18], '#f2f2f2', 2);
    S.poly([x - 6, gy - 40, x + 14, gy - 48, x + 26, gy - 40], '#d7322a', 1.8);
    S.line(x + 22, gy - 40, x + 28, gy - 54, '#3a3a44', 2.5);
  }

  function drawGround(cam, level) {
    const g = J.g; const S = sp(); const gy = level.groundY;
    const x0 = cam.x - 50, x1 = cam.x + J.VIEW_W / cam.zoom + 50;
    // asfalto pista
    const sx0 = Math.max(x0, -200), sx1 = Math.min(x1, 2750);
    if (sx1 > sx0) {
      g.fillStyle = '#56565f'; g.fillRect(sx0, gy, sx1 - sx0, 400);
      g.fillStyle = '#6a6a74'; g.fillRect(sx0, gy + 14, sx1 - sx0, 6);
      // cordolo rosso/bianco
      for (let cx = Math.floor(sx0 / 40) * 40; cx < sx1; cx += 40) { g.fillStyle = (cx / 40) % 2 ? '#e8e8e8' : '#d63a2a'; g.fillRect(cx, gy, 40, 9); }
      g.fillStyle = '#e8e8e8'; for (let cx = Math.floor(sx0 / 120) * 120; cx < sx1; cx += 120) g.fillRect(cx, gy + 48, 60, 5);
    }
    // terreno devastato
    const dx0 = Math.max(x0, 2700);
    if (x1 > dx0) {
      g.fillStyle = '#7a5a40'; g.fillRect(dx0, gy, x1 - dx0, 600);
      g.fillStyle = '#946c4c'; g.fillRect(dx0, gy, x1 - dx0, 14);
      g.strokeStyle = '#4a3424'; g.lineWidth = 3;
      for (let cx = Math.floor(dx0 / 160) * 160; cx < x1; cx += 160) { g.beginPath(); g.moveTo(cx, gy + 14); g.lineTo(cx + 30, gy + 50); g.lineTo(cx + 10, gy + 90); g.stroke(); }
    }
    g.strokeStyle = S.OL; g.lineWidth = 2.5; g.beginPath(); g.moveTo(x0, gy); g.lineTo(x1, gy); g.stroke();
  }

  function drawPlatform(p) {
    const S = sp(); const g = J.g;
    switch (p.kind) {
      case 'crate':
        S.poly([p.x, p.y, p.x + p.w, p.y, p.x + p.w, p.y + p.h, p.x, p.y + p.h], '#c2843f', 2.4);
        S.polyNoOl([p.x + p.w - 10, p.y + 2, p.x + p.w - 2, p.y + 2, p.x + p.w - 2, p.y + p.h - 2, p.x + p.w - 10, p.y + p.h - 2], '#9a6228');
        S.line(p.x + 4, p.y + 4, p.x + p.w - 4, p.y + p.h - 4, '#7a4a1c', 3); S.line(p.x + p.w - 4, p.y + 4, p.x + 4, p.y + p.h - 4, '#7a4a1c', 3);
        S.line(p.x, p.y + 6, p.x + p.w, p.y + 6, '#7a4a1c', 2);
        break;
      case 'ledge':
        S.poly([p.x, p.y, p.x + p.w, p.y, p.x + p.w, p.y + p.h, p.x, p.y + p.h], '#8e98b0', 2.2);
        for (let k = 0; k < p.w; k += 20) S.polyNoOl([p.x + k, p.y + p.h, p.x + k + 10, p.y + p.h, p.x + k + 16, p.y, p.x + k + 6, p.y], '#f2d23a');
        S.line(p.x + 10, p.y + p.h, p.x + 10, 460, '#5f667a', 3); S.line(p.x + p.w - 10, p.y + p.h, p.x + p.w - 10, 460, '#5f667a', 3);
        break;
      case 'car': {
        // auto da corsa distrutta
        S.poly([p.x, p.y + p.h, p.x + 10, p.y + 16, p.x + 60, p.y, p.x + 150, p.y, p.x + p.w, p.y + 20, p.x + p.w, p.y + p.h], '#2f62c8', 2.4);
        S.polyNoOl([p.x + 12, p.y + 20, p.x + 60, p.y + 4, p.x + 150, p.y + 4, p.x + p.w - 6, p.y + 22, p.x + p.w - 6, p.y + 28, p.x + 12, p.y + 28], '#4a7fe0');
        S.poly([p.x + 70, p.y + 4, p.x + 90, p.y - 14, p.x + 130, p.y - 14, p.x + 140, p.y + 4], '#a9e0f0', 2);
        S.circ(p.x + 40, p.y + p.h, 16, '#1f1f24', 2); S.circ(p.x + p.w - 40, p.y + p.h, 16, '#1f1f24', 2);
        g.fillStyle = '#fff'; g.font = 'bold 14px Impact, sans-serif'; g.fillText('7', p.x + 100, p.y + 30);
        break;
      }
      case 'rubble':
        S.poly([p.x, p.y + p.h, p.x + 8, p.y + 20, p.x + 40, p.y, p.x + p.w - 50, p.y + 6, p.x + p.w, p.y + 30, p.x + p.w, p.y + p.h], '#9b8f8a', 3);
        S.polyNoOl([p.x + p.w - 60, p.y + 10, p.x + p.w - 4, p.y + 32, p.x + p.w - 4, p.y + p.h - 4, p.x + p.w - 70, p.y + p.h - 4], '#7a6e6c');
        for (let k = 0; k < 4; k++) S.line(p.x + 30 + k * 50, p.y + 30, p.x + 50 + k * 50, p.y + p.h - 20, '#5d5352', 3);
        break;
      case 'girder':
        S.poly([p.x, p.y, p.x + p.w, p.y, p.x + p.w, p.y + p.h, p.x, p.y + p.h], '#c4462e', 3);
        for (let k = 0; k < p.w; k += 40) S.line(p.x + k, p.y + p.h, p.x + k + 20, p.y, '#7e2a1a', 3);
        S.cap(p.x + 30, p.y + p.h, p.x + 30, 460, 9, '#9b8f8a', '#6d6362'); S.cap(p.x + p.w - 30, p.y + p.h, p.x + p.w - 30, 460, 9, '#9b8f8a', '#6d6362');
        break;
    }
  }

  J.bg = { drawSky, drawParallax, drawWorldBack, drawGround, drawPlatform, drawCloud };
})();

/* ---- src/entities.js ---- */
/* entities.js — giocatore, nemici, boss, proiettili, particelle, collisioni. */
'use strict';
(function () {
  const W = () => J.world;
  const F = J.FORMS;
  const sfx = (n) => J.audio.play(n);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /* ---------------- collisioni ---------------- */
  function box(e) { return { x0: e.x - e.w / 2, y0: e.y - e.h, x1: e.x + e.w / 2, y1: e.y }; }
  function overlap(a, b) { return a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0; }

  function moveAndCollide(e, dt, opts) {
    opts = opts || {};
    const w = W(); const lv = w.level; const gy = lv.groundY;
    const prevY = e.y;
    // asse X
    e.x += e.vx * dt;
    for (const p of lv.platforms) {
      if (p.oneWay) continue;
      const b = box(e);
      if (b.x1 > p.x && b.x0 < p.x + p.w && b.y1 > p.y + 1 && b.y0 < p.y + p.h) {
        // gradino automatico per i giganti
        if (opts.step && e.y - p.y <= opts.step && e.onGround) { e.y = p.y; continue; }
        if (e.vx > 0 || (e.x < p.x + p.w / 2)) e.x = p.x - e.w / 2; else e.x = p.x + p.w + e.w / 2;
        e.hitWall = true;
      }
    }
    if (opts.minX != null) e.x = Math.max(opts.minX + e.w / 2, e.x);
    if (opts.maxX != null) e.x = Math.min(opts.maxX - e.w / 2, e.x);
    // asse Y
    e.vy += (e.grav || 1800) * dt;
    if (e.vy > 2400) e.vy = 2400;
    e.y += e.vy * dt;
    const wasGround = e.onGround; e.onGround = false;
    if (e.y >= gy) { e.y = gy; e.vy = 0; e.onGround = true; }
    for (const p of lv.platforms) {
      const b = box(e);
      if (b.x1 <= p.x + 2 || b.x0 >= p.x + p.w - 2) continue;
      if (p.oneWay) {
        if (e.vy >= 0 && prevY <= p.y + 0.5 && e.y >= p.y && !(e.dropT > 0)) { e.y = p.y; e.vy = 0; e.onGround = true; }
      } else if (b.y1 > p.y && b.y0 < p.y + p.h) {
        if (e.vy >= 0 && prevY <= p.y + 8) { e.y = p.y; e.vy = 0; e.onGround = true; }
        else if (e.vy < 0) { e.y = p.y + p.h + e.h; e.vy = 0; }
      }
    }
    if (!wasGround && e.onGround && e.landFx) e.landFx();
  }

  /* ---------------- particelle ---------------- */
  function particle(o) { W().particles.push(Object.assign({ vx: 0, vy: 0, life: 0.5, t: 0, g: 0, size: 4, col: '#fff' }, o)); }
  function sparks(x, y, n, col, speed, size) {
    for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), s = rnd(0.3, 1) * (speed || 300); particle({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.2, 0.45), col: col || '#fff6b0', size: size || 3 }); }
  }
  function hitStar(x, y, s) { particle({ kind: 'star', x, y, life: 0.18, size: s || 18, col: '#ffffff' }); }
  function dust(x, y, n, s) { for (let i = 0; i < n; i++) particle({ kind: 'dust', x: x + rnd(-10, 10) * s, y, vx: rnd(-80, 80) * s, vy: rnd(-60, -10) * s, life: rnd(0.35, 0.7), size: rnd(5, 9) * s, col: '#d8c8a8' }); }
  function shards(x, y, n, s, col) { for (let i = 0; i < n; i++) particle({ kind: 'shard', x, y, vx: rnd(-260, 260) * s, vy: rnd(-520, -120) * s, g: 1600 * s, life: rnd(0.6, 1.1), size: rnd(4, 9) * s, col: col || '#c7774a', rot: rnd(0, 6), vr: rnd(-10, 10) }); }
  function explosion(x, y, s) { particle({ kind: 'explo', x, y, life: 0.6, size: 60 * s }); sparks(x, y, 14, '#ffd34a', 500 * s, 4 * s); }
  function floatText(x, y, text, col, size) { particle({ kind: 'text', x, y, vy: -60, life: 0.9, text, col: col || '#fff', size: size || 18 }); }

  /* ---------------- GIOCATORE ---------------- */
  function makePlayer(x, form) {
    const f = F[form];
    return {
      x, y: W().level.groundY, vx: 0, vy: 0, w: f.w, h: f.h, grav: f.grav, face: 1, form,

  function onOneWay(p) { return W().level.platforms.some((q) => q.oneWay && Math.abs(p.y - q.y) < 1 && p.x > q.x && p.x < q.x + q.w); }

  /* ---------------- NEMICI ---------------- */
  const ENEMY_DEF = {

  function makeEnemy(d) {

      type: d.type, x: d.x, y: d.y || W().level.groundY, vx: 0, vy: 0, w: def.w, h: def.h, hp: def.hp, maxHp: def.hp,

  function damageEnemy(e, dmg, dir, heavy, fx, fy, beam) {
    const w = W();
    if (e.isBoss) return J.boss.damage(e, dmg, dir, heavy, fx, fy, beam);
    if (e.inv > 0 && !beam) return;
    e.hp -= dmg; e.flash = 0.12; e.inv = beam ? 0 : 0.05;

    if (canStagger) {

      e.vx = dir * (e.giant ? (heavy ? 260 : 120) : (heavy ? 340 : 170));

    }
  }
  function killEnemy(e, dir) {

    w.score += e.def.score; w.kills++;

    if (e.giant) { explosion(e.x, e.y - e.h * 0.5, 2.6); shards(e.x, e.y - e.h * 0.5, 22, 2.6); sfx('explode'); J.game.shake(12); }
    else { shards(e.x, e.y - e.h * 0.5, 8, 1, '#dcd3ea'); sfx('enemyDie'); }
  }

  function updateEnemy(e, dt) {
    const w = W(); const p = w.player;
    e.animT += dt; e.flash = Math.max(0, e.flash - dt); e.inv = Math.max(0, e.inv - dt);

  function throwSpear(e) {

  }

  /* ---------------- disegno ---------------- */
  function drawPlayer(p, t) {
    const g = J.g; const S = J.spr;
    if (p.inv > 0 && p.state !== 'hurt' && Math.floor(p.inv * 14) % 2 === 0) g.globalAlpha = 0.45;
    let anim = p.anim; let at = p.animT;
    if (anim === 'punch2') { anim = 'punch'; }
    const opts = { second: p.anim === 'punch2', cadence: p.form === 'jeeg' ? 7.5 : 11.5 };
    if (anim === 'run' || anim === 'idle') at = J.world.t;
    if (p.state === 'attack') at = p.atk.t;
    if (p.state === 'dead') { anim = 'dead'; }
    if (J.world.scene && J.world.scene.forcePose) { anim = J.world.scene.forcePose; at = J.world.t; }
    const pose = S.pose(anim, at, opts);

  function drawBeam(p, t) {
    if (p.state !== 'beam' || !p.beamActive) return;

/* boss.js — HANIWA CORAZZATO (boss livello 1), 3 fasi con segnali leggibili (telegraph). */
'use strict';
(function () {
  const W = () => J.world;
  const E = () => J.ent;
  const sfx = (n) => J.audio.play(n);

  function make(cfg) {
    return {
      isBoss: true, name: cfg.name, x: cfg.x, y: W().level.groundY, vx: 0, vy: 0, w: 170, h: 430, hp: cfg.hp, maxHp: cfg.hp,
      face: -1, state: 'intro', at: 0, st: 0, alive: true, active: false, phase: 1, inv: 0, flash: 0, grav: 2800,
      armRaise: 0, punch: 0, eyeGlow: 0, mouthGlow: 0, animT: 0, anim: 'idle', giant: true, onGround: true,
      def: { score: 5000, scale: 4.3 }, lastMove: '', deadT: 0,
    };
  }

  function phaseOf(b) { const r = b.hp / b.maxHp; return r > 0.66 ? 1 : r > 0.33 ? 2 : 3; }

  function damage(b, dmg, dir, heavy, fx, fy, beam) {
    if (!b.alive || b.state === 'intro' || b.state === 'roar') { if (b.alive) { E().sparks(fx, fy, 6, '#9fd8ff', 300, 3); } return; }
    if (b.inv > 0 && !beam) return;

    b.hp -= dmg * mult; b.flash = 0.1; b.inv = beam ? 0 : 0.08;
    E().hitStar(fx, fy, 40); E().sparks(fx, fy, 10, '#fff6b0', 520, 5); sfx('enemyHit');
    if (mult > 1) E().floatText(fx, fy - 40, 'CRITICO!', '#ff6a3a', 30);
    if (b.hp <= 0) { b.hp = 0; die(b); return; }
    const ph = phaseOf(b);
    if (ph > b.phase) {
      b.phase = ph; b.state = 'roar'; b.at = 0; b.vx = 0; b.armRaise = 1; b.eyeGlow = 1;
      sfx('bossWarn'); J.game.shake(14);
      J.game.msg(ph === 2 ? 'FASE 2 — il boss usa il cannone della bocca!' : 'FASE 3 — furia del Haniwa corazzato: carica e onde d\'urto!', 3);
      E().particle({ kind: 'ring', x: b.x, y: b.y - b.h * 0.5, life: 0.7, size: 420, col: '#ffcf5a' });
      // respinge il giocatore
      const p = W().player; p.vx = (p.x < b.x ? -1 : 1) * 600; p.vy = -500; p.onGround = false;
    }
  }

  function die(b) {
    const w = W();
    b.alive = false; b.state = 'dying'; b.deadT = 0; b.vx = 0;
    w.score += b.def.score; sfx('explode'); J.game.shake(20);

  function choose(b, p) {
    const dist = Math.abs(p.x - b.x);
    const opts = [];
    if (dist < 330) opts.push('slam', 'slam');
    if (b.phase >= 2) opts.push('shoot');
    if (b.phase >= 3) opts.push('charge', 'jump');
    if (b.phase === 1 && dist >= 330) opts.push('walk', 'walk', 'hop');
    if (b.phase >= 2 && dist >= 330) opts.push('walk');
    let pick = opts[Math.floor(Math.random() * opts.length)];
    if (pick === b.lastMove && opts.length > 1 && pick !== 'slam') pick = opts[(opts.indexOf(pick) + 1) % opts.length];
    b.lastMove = pick;
    b.at = 0;
    switch (pick) {
      case 'slam': b.state = 'slamWind'; sfx('telegraph'); break;
      case 'shoot': b.state = 'shootWind'; sfx('telegraph'); break;
      case 'charge': b.state = 'chargeWind'; sfx('bossWarn'); break;
      case 'jump': b.state = 'jumpWind'; sfx('telegraph'); break;
      case 'hop': b.state = 'hop'; b.vy = -900; b.vx = -b.face * 350; b.onGround = false; break;
      default: b.state = 'walk'; b.st = 0.9 + Math.random() * 0.6;
    }
  }

  function update(b, dt) {
    const w = W(); const p = w.player; const lv = w.level;
    b.animT += dt; b.at += dt; b.flash = Math.max(0, b.flash - dt); b.inv = Math.max(0, b.inv - dt);
    if (b.state === 'dying') {
      b.deadT += dt;
      if (Math.random() < 0.25) { E().explosion(b.x + E().rnd(-90, 90), b.y - E().rnd(40, 400), 2.2); sfx('explode'); }

    }

    const dx = p.x - b.x;
    const turn = () => { b.face = dx > 0 ? 1 : -1; };

      case 'roar': b.vx = 0; b.armRaise = 1; if (b.at > 1.1) { b.state = 'idle'; b.at = 0; b.armRaise = 0; b.eyeGlow = 0; } break;
      case 'idle': {

        const wait = b.phase === 1 ? 0.75 : b.phase === 2 ? 0.55 : 0.35;
        if (b.at > wait && p.state !== 'dead') choose(b, p);
        break;
      }
      case 'walk':
        turn(); b.anim = 'walk'; b.vx = b.face * 160 * speedK;
        if (Math.abs(dx) < 280 || b.at > b.st) { b.state = 'idle'; b.at = b.phase === 1 ? 0.3 : 0.5; }
        break;
      case 'hop': b.anim = 'idle'; if (b.onGround && b.at > 0.2) { b.vx = 0; b.state = 'idle'; b.at = 0; E().dust(b.x, b.y, 10, 3); sfx('slam'); J.game.shake(6); } break;
      case 'slamWind': {

        if (b.at > 0.06 && !b.hitDone) {
          b.hitDone = true; sfx('slam'); J.game.shake(12);
          const reach = 300;
          const hb = { x0: b.face > 0 ? b.x : b.x - reach, x1: b.face > 0 ? b.x + reach : b.x, y0: b.y - 330, y1: b.y };
          E().dust(b.x + b.face * 240, b.y, 12, 3);
          if (E().overlap(hb, E().box(p))) E().hurtPlayer(p, 22, b.x);
          if (b.phase >= 2) spawnShock(b, b.face, b.x + b.face * 260);
        }
        if (b.at > 0.75) { b.state = 'idle'; b.at = 0; b.punch = 0; b.eyeGlow = 0; }
        break;
      }
      case 'shootWind': {
        turn(); b.vx = 0; b.anim = 'windup';
        const wt = 0.85; b.mouthGlow = Math.min(1, b.at / wt);
        if (b.at >= wt) { b.state = 'shoot'; b.at = 0; b.shots = b.phase === 3 ? 5 : 3; b.shotT = 0; }
        break;
      }
      case 'shoot':
        b.anim = 'attack'; b.shotT -= dt;
        if (b.shotT <= 0 && b.shots > 0) {
          b.shots--; b.shotT = 0.22;
          const spread = (b.phase === 3 ? 5 : 3) - b.shots;
          const tx = p.x + (spread - 2) * 160;
          const T = 1.0; const vx = (tx - b.x) / T;
          W().projectiles.push({ kind: 'bossOrb', x: b.x + b.face * 60, y: b.y - b.h * 0.86, vx, vy: -1050, grav: 2100, r: 30, dmg: 15, life: 4 });
          sfx('shooter');
        }
        if (b.shots <= 0 && b.shotT <= 0) { b.state = 'idle'; b.at = 0; b.mouthGlow = 0; }
        break;
      case 'chargeWind':
        turn(); b.vx = -b.face * 30; b.anim = 'windup'; b.eyeGlow = 1;
        if (Math.random() < 0.5) E().particle({ kind: 'dust', x: b.x - b.face * 60, y: b.y - 20, vx: -b.face * 200, vy: -80, life: 0.5, size: 14, col: '#eeeeee' });
        if (b.at > 0.85) { b.state = 'charge'; b.at = 0; b.hitDone = false; sfx('whoosh'); }
        break;
      case 'charge':
        b.anim = 'walk'; b.vx = b.face * 980;
        if (Math.random() < 0.6) E().dust(b.x - b.face * 60, b.y, 2, 3);
        if (!b.hitDone && E().overlap(E().box(b), E().box(p))) { b.hitDone = true; E().hurtPlayer(p, 25, b.x); }
        if (b.x <= lv.arena.x0 + b.w / 2 + 5 || b.x >= lv.arena.x1 - b.w / 2 - 5 || b.at > 2.2) {
          b.state = 'stun'; b.at = 0; b.vx = 0; sfx('slam'); J.game.shake(16); E().sparks(b.x + b.face * 80, b.y - 200, 20, '#ffd34a', 600, 5);
          J.game.msg('Il boss è stordito: colpiscilo ora! (danni x1.6)', 2);
        }
        break;
      case 'stun': b.vx = 0; b.anim = 'idle'; b.eyeGlow = 0; if (b.at > 1.4) { b.state = 'idle'; b.at = 0; } break;
      case 'jumpWind': turn(); b.vx = 0; b.anim = 'windup'; b.armRaise = Math.min(1, b.at / 0.6); if (b.at > 0.6) { b.state = 'jump'; b.at = 0; b.vy = -1500; b.vx = (dx) * 0.9; b.onGround = false; } break;
      case 'jump':
        b.anim = 'idle'; b.armRaise = 1;
        if (b.onGround && b.at > 0.15) {
          b.state = 'idle'; b.at = -0.3; b.vx = 0; b.armRaise = 0; sfx('slam'); J.game.shake(18);

(function () {

  const E = () => J.ent;

    const g = J.g;
    g.font = 'bold ' + size + 'px Impact, "Arial Black", sans-serif'; g.textAlign = align || 'center'; g.lineJoin = 'round';
    g.lineWidth = size / 4.5; g.strokeStyle = stroke || '#1b1020'; g.strokeText(text, x, y);
    g.fillStyle = fill || '#ffe14a'; g.fillText(text, x, y); g.textAlign = 'left';
  }
  function speedLines(cx, cy, t, col, n) {
    const g = J.g; g.save(); g.strokeStyle = col || 'rgba(255,255,255,0.5)';
    for (let i = 0; i < (n || 40); i++) {
      const a = (i / (n || 40)) * Math.PI * 2 + Math.sin(i * 7.3) * 0.1;
      const r0 = 120 + ((i * 53 + t * 900) % 200), r1 = r0 + 300;
      g.lineWidth = 2 + (i % 3) * 2;
      g.beginPath(); g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); g.stroke();
    }
    g.restore();
  }
  /* pannello cut-in diagonale con ritratto */
  function cutIn(k, side, bg, drawPortrait, label, sub) {
    const g = J.g; const VW = J.VIEW_W;
    const slide = ease(k);
    const y0 = 120, h = 220;
    g.save();
    g.translate(side > 0 ? (1 - slide) * VW : -(1 - slide) * VW, 0);
    g.beginPath(); g.moveTo(0, y0 + 30); g.lineTo(VW, y0); g.lineTo(VW, y0 + h); g.lineTo(0, y0 + h + 30); g.closePath();
    g.fillStyle = bg; g.fill(); g.lineWidth = 6; g.strokeStyle = '#1b1020'; g.stroke();
    g.save(); g.clip(); speedLines(side > 0 ? 260 : 700, y0 + h / 2, J.world ? J.world.t : 0, 'rgba(255,255,255,0.35)', 36);
    drawPortrait(side > 0 ? 240 : 720, y0 + h / 2 + 10);
    g.restore();
    g.lineWidth = 4; g.strokeStyle = '#ffe14a'; g.beginPath(); g.moveTo(0, y0 + 36); g.lineTo(VW, y0 + 6); g.stroke();
    g.beginPath(); g.moveTo(0, y0 + h + 24); g.lineTo(VW, y0 + h - 6); g.stroke();
    bigText(label, side > 0 ? 640 : 320, y0 + h / 2 + 4, 44, '#ffe14a');
    if (sub) bigText(sub, side > 0 ? 640 : 320, y0 + h / 2 + 46, 22, '#ffffff');
    g.restore();
  }

  /* ---------- DIALOGO ---------- */
  function dialog(lines, onDone) {
    let i = 0, t = 0;
    return {
      kind: 'dialog', blocksPlay: true,
      update(dt) {
        t += dt;
        if (t > 0.25 && (J.input.menuPressed('A') || J.input.menuPressed('B') || J.input.menuPressed('START'))) { i++; t = 0; sfx('select'); if (i >= lines.length) { this.done = true; J.input.clearAll(); onDone && onDone(); } }
      },
      drawScreen() {
        const L = lines[Math.min(i, lines.length - 1)]; const g = J.g;
        const y = 360;
        g.fillStyle = 'rgba(10,14,40,0.88)'; g.fillRect(30, y, 900, 150); g.lineWidth = 4; g.strokeStyle = '#ffe14a'; g.strokeRect(30, y, 900, 150);
        let tx = 60;
        if (L.portrait) {
          g.save(); g.beginPath(); g.rect(40, y + 10, 140, 130); g.clip(); g.fillStyle = L.bg || '#2f6fd2'; g.fillRect(40, y + 10, 140, 130);
          if (L.portrait === 'hiroshi') J.spr.portraitHiroshi(110, y + 92, 0.8, W().t);
          if (L.portrait === 'miwa') J.spr.portraitMiwa(110, y + 92, 0.85, W().t);
          g.restore(); g.strokeStyle = '#1b1020'; g.lineWidth = 3; g.strokeRect(40, y + 10, 140, 130);
          tx = 200;
        }
        g.font = 'bold 22px Impact, "Arial Black", sans-serif'; g.fillStyle = L.col || '#ffe14a'; g.fillText(L.who || '', tx, y + 38);
        g.font = '20px "Trebuchet MS", Arial, sans-serif'; g.fillStyle = '#ffffff';
        wrap(L.text, tx, y + 70, 930 - tx - 20, 26);
        if (Math.floor(t * 3) % 2 === 0) { g.font = 'bold 15px Arial'; g.fillStyle = '#ffe14a'; g.textAlign = 'right'; g.fillText('A / START ▶', 915, y + 140); g.textAlign = 'left'; }
      },
    };
  }
  function wrap(text, x, y, maxW, lh) {
    const g = J.g; const words = text.split(' '); let line = '';
    for (const w of words) { const test = line ? line + ' ' + w : w; if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y); line = w; y += lh; } else line = test; }
    if (line) g.fillText(line, x, y);
  }

  /* ---------- TRASFORMAZIONE 1: Hiroshi umano → forma intermedia (cyborg) ---------- */
  function transformCyborg() {
    const w = W(); const p = w.player; let t = 0; let switched = false;
    p.vx = 0; p.state = 'normal'; p.atk = null;
    sfx('transform');
    return {
      kind: 'transform', blocksPlay: true, hidePlayer: true,
      update(dt) {
        t += dt; p.vx = 0;
        if (t > 1.0 && Math.random() < 0.6) E().particle({ kind: 'magnet', x: p.x + E().rnd(-40, 40), y: p.y - E().rnd(10, 90), vx: E().rnd(-200, 200), vy: E().rnd(-200, 200), life: 0.25 });
        if (t > 1.55 && !switched) { switched = true; E().setForm(p, 'cyborg'); p.hp = 100; J.game.shake(6); E().sparks(p.x, p.y - 45, 24, '#fff6b0', 420, 3); sfx('magnet'); }
        if (t > 2.9) { this.done = true; J.game.msg('FORMA CYBORG! Ora premi T per chiamare Miwa: BUILD UP con il Big Shooter!', 5); J.game.saveNow(); }
      },
      drawWorld() {
        const g = J.g; const S = J.spr;
        // aura
        const k = Math.min(1, t / 1.5);
        g.globalAlpha = 0.25 + 0.25 * Math.sin(t * 30); S.circ(p.x, p.y - 45, 40 + k * 40, '#fff6a0', 0); g.globalAlpha = 1;
        g.save(); g.translate(p.x, p.y); g.scale(p.face, 1);
        if (t < 1.55) {
          // Hiroshi unisce i pugni (pose rif. 02); lampeggia con la sagoma del cyborg
          const flick = t > 1.0 && Math.floor(t * (10 + t * 20)) % 2 === 0;
          if (flick) S.drawHumanoid(S.CYBORG, S.pose('fists', t)); else S.drawHumanoid(S.HIRO_G, S.pose('fists', t));
        } else S.drawHumanoid(S.CYBORG, S.pose(t < 2.2 ? 'cheer' : 'idle', t));
        g.restore();
      },
      drawScreen() {
        const g = J.g;
        if (t < 1.0) cutIn(Math.min(1, t / 0.25) - Math.max(0, (t - 0.8) / 0.2), 1, '#c8302a', (x, y) => J.spr.portraitHiroshi(x, y, 1.05, t), 'UNIONE DEI GUANTI!', 'Hiroshi Shiba');
        if (t > 1.45 && t < 1.75) { g.globalAlpha = 1 - Math.abs(t - 1.6) / 0.15; g.fillStyle = '#ffffff'; g.fillRect(0, 0, J.VIEW_W, J.VIEW_H); g.globalAlpha = 1; }
        if (t > 1.6) bigText('FORMA CYBORG', 480, 120, 54, '#ffe14a');
      },
    };
  }

  /* ---------- TRASFORMAZIONE 2: testa di Jeeg + BUILD UP magnetico dal Big Shooter ---------- */
  function buildUp() {
    const w = W(); const p = w.player; let t = 0;
    const gy = w.level.groundY;
    const baseX = p.x; const face = p.face;
    const airY = gy - 210; // altezza dei piedi durante l'assemblaggio in volo
    const LAUNCH = { torso: 2.7, armB: 3.25, armF: 3.6, legB: 4.0, legF: 4.35 };
    const attached = {};
    let shooter = { x: baseX + 2200, y: gy - 760 };
    J.game.setZoom(0.52);
    sfx('transform');
    p.vx = 0; p.atk = null; p.state = 'normal';
    const stages = { headDone: false, landed: false };
    return {
      kind: 'buildup', blocksPlay: true, hidePlayer: true,
      update(dt) {
        t += dt;
        // Big Shooter: entra da destra, si posiziona sopra la testa, poi riparte
        const sx = t < 1.6 ? baseX + 2200 : t < 2.6 ? baseX + 2200 - ease((t - 1.6) / 1.0) * 1700 : t < 4.6 ? baseX + 500 - (t - 2.6) * 40 : baseX + 420 - (t - 4.6) * 1600;
        const sy = t < 4.6 ? gy - 760 + Math.sin(t * 3) * 12 : gy - 760 - (t - 4.6) * 300;
        shooter.x = sx; shooter.y = sy;
        if (t > 1.6 && t < 1.62) sfx('shooter');
        if (t > 0.95 && !stages.headDone) { stages.headDone = true; E().sparks(baseX, airY - 280, 30, '#fff6b0', 600, 5); J.game.shake(8); sfx('magnet'); }
        for (const k in LAUNCH) {
          if (!attached[k] && t > LAUNCH[k] + 0.45) { attached[k] = true; sfx('magnet'); J.game.shake(7); const pos = partWorldPos(k); for (let i = 0; i < 10; i++) E().particle({ kind: 'magnet', x: pos.x, y: pos.y, vx: E().rnd(-300, 300), vy: E().rnd(-300, 300), life: 0.35 }); E().sparks(pos.x, pos.y, 14, '#bfe9ff', 500, 4); }
          if (t > LAUNCH[k] && t < LAUNCH[k] + 0.03) sfx('whoosh');
        }
        if (t > 4.9 && !stages.landed && t > 5.25) { stages.landed = true; E().dust(baseX, gy, 16, 3); J.game.shake(14); sfx('slam'); }
        if (t > 6.3) {
          this.done = true;
          E().setForm(p, 'jeeg'); p.x = baseX; p.y = gy; p.vy = 0; p.hp = 100; p.en = 100; p.face = face;
          J.game.onJeegAssembled();
        }
      },
      drawWorld() {
        const g = J.g; const S = J.spr;
        // Jeeg in volo durante il montaggio, poi atterra
        const fall = t > 4.9 ? ease((t - 4.9) / 0.35) : 0;
        const feetY = airY + (gy - airY) * fall;
        if (t < 0.95) {
          // il cyborg salta e si raccoglie: diventa la testa di Jeeg
          const k = ease(t / 0.9);
          const y = gy - k * (gy - (airY - 300));
          g.save(); g.translate(baseX, y); g.scale(face, 1); g.rotate(k * Math.PI * 2 * face);
          S.drawHumanoid(S.CYBORG, S.pose('jump', t)); g.restore();
          g.globalAlpha = k * 0.6; S.circ(baseX, y - 40, 40 + k * 60, '#fff6a0', 0); g.globalAlpha = 1;
          return;
        }
        // magnetismo: anello pulsante intorno alla testa
        g.globalAlpha = 0.3 + 0.2 * Math.sin(t * 25); S.circ(baseX, feetY - 280, 60 + Math.sin(t * 12) * 8, '#9fd8ff', 0); g.globalAlpha = 1;
        // parti in volo dal Big Shooter
        const off = {};
        for (const k of ['torso', 'armB', 'armF', 'legB', 'legF']) {
          const l = LAUNCH[k];
          if (t < l) { off[k] = { hide: true }; continue; }
          const q = ease(Math.min(1, (t - l) / 0.45));
          const fin = partWorldPos(k, feetY);
          const sx = shooter.x, sy = shooter.y + 30;
          const cx = sx + (fin.x - sx) * q, cy = sy + (fin.y - sy) * q - Math.sin(q * Math.PI) * 120;
          off[k] = { x: ((cx - fin.x) / 3) * face, y: (cy - fin.y) / 3 };
        }
        g.save(); g.translate(baseX, feetY); g.scale(face * 3, 3);
        S.drawHumanoid(S.JEEG, S.pose(t > 5.3 ? 'cheer' : 'idle', t), off);
        g.restore();
        // Big Shooter (rif. 15) pilotato da Miwa
        g.save(); g.translate(shooter.x, shooter.y); g.scale(-2.6, 2.6); S.drawBigShooter(t, true); g.restore();
      },
      drawScreen() {
        const g = J.g;
        if (t > 0.85 && t < 1.1) { g.globalAlpha = 1 - Math.abs(t - 0.95) / 0.15; g.fillStyle = '#ffffff'; g.fillRect(0, 0, J.VIEW_W, J.VIEW_H); g.globalAlpha = 1; }
        if (t > 0.95 && t < 1.7) bigText('TESTA DI JEEG!', 480, 110, 46, '#ffe14a');
        if (t > 1.55 && t < 2.6) cutIn(Math.min(1, (t - 1.55) / 0.2) - Math.max(0, (t - 2.4) / 0.2), -1, '#2f6fd2', (x, y) => J.spr.portraitMiwa(x, y, 1.15, t), 'MIWA, LANCIA I COMPONENTI!', 'Big Shooter — Miwa Uzuki');
        if (t > 2.7 && t < 4.9) bigText('AGGANCIO MAGNETICO', 480, 70, 34, '#9fd8ff');
        if (t > 5.2) { const k = Math.min(1, (t - 5.2) / 0.2); g.save(); g.translate(480, 150); g.scale(0.6 + k * 0.4, 0.6 + k * 0.4); bigText('BUILD UP!', 0, 0, 92, '#ffe14a', '#c8302a'); g.restore(); bigText('JEEG ROBOT D\'ACCIAIO', 480, 200, 30, '#ffffff'); }
      },
    };
    function partWorldPos(k, feetY) {
      feetY = feetY == null ? airY : feetY;
      const local = { torso: [0, -60], armB: [1, -62], armF: [1, -62], legB: [0, -30], legF: [0, -30] }[k];
      return { x: baseX + local[0] * 3 * face, y: feetY + local[1] * 3 };
    }
  }

  /* ---------- INTRO BOSS ---------- */
  function bossIntro(boss) {
    let t = 0;
    J.audio.startMusic('boss'); sfx('bossWarn');
    return {
      kind: 'bossintro', blocksPlay: true,
      update(dt) { t += dt; if (t > 0.6 && t < 0.62) { J.game.shake(14); sfx('slam'); } if (t > 2.6) { this.done = true; boss.active = true; boss.state = 'idle'; boss.at = 0; J.game.msg('Sconfiggi il ' + boss.name + '! Osserva i segnali "!" prima degli attacchi.', 4); } },
      drawScreen() {
        const g = J.g; const k = Math.min(1, t / 0.3);
        g.fillStyle = 'rgba(0,0,0,' + 0.45 * k + ')'; g.fillRect(0, 190, J.VIEW_W, 120);
        bigText('WARNING', 480, 240 - (1 - k) * 40, 40, '#ff4a2a');
        bigText(boss.name, 480, 290, 50, '#ffe14a');
      },
    };
  }

  /* ---------- VITTORIA ---------- */
  function victory(onDone) {
    let t = 0; const p = W().player;
    J.audio.stopMusic(); sfx('win');
    return {
      kind: 'victory', blocksPlay: true, forcePose: 'cheer',
      update(dt) { t += dt; p.vx = 0; p.anim = 'cheer'; if (t > 2.2) { this.done = true; onDone(); } },
      drawScreen() { const k = Math.min(1, t / 0.4); const g = J.g; g.save(); g.translate(480, 200); g.scale(k, k); bigText('VITTORIA!', 0, 0, 90, '#ffe14a', '#c8302a'); g.restore(); },
    };
  }

  J.scenes = { dialog, transformCyborg, buildUp, bossIntro, victory, bigText, speedLines, cutIn, wrap };
})();

/* ---- src/game.js ---- */
/* game.js — mondo, camera, checkpoint/salvataggi, HUD, menu arcade, ciclo principale a passo fisso. */
'use strict';
(function () {
  const E = () => J.ent;
  const sfx = (n) => J.audio.play(n);
  const VW = J.VIEW_W, VH = J.VIEW_H;

  const game = {
    mode: 'title', menuIndex: 0, godMode: false, modeT: 0, levelsIndex: 0, pauseIndex: 0,
    remap: null, stats: null,
  };
  J.game = game;

  /* ===================== SALVATAGGI ===================== */
  function loadSave() { try { return JSON.parse(localStorage.getItem(J.SAVE_KEY) || 'null'); } catch (e) { return null; } }
  function writeSave(s) { try { localStorage.setItem(J.SAVE_KEY, JSON.stringify(s)); } catch (e) {} }
  function hiscore() { try { return +localStorage.getItem(J.HISCORE_KEY) || 0; } catch (e) { return 0; } }
  function setHiscore(v) { try { if (v > hiscore()) localStorage.setItem(J.HISCORE_KEY, String(v)); } catch (e) {} }
  game.saveNow = function () {
    const w = J.world; if (!w) return;
    const prev = loadSave() || {};
    writeSave({
      version: 1, level: 1, cp: w.cp, cp2x: w.cp2x, gloves: w.gloves, score: w.cpScore, lives: w.lives,
      en: w.cpEnergy, unlocked: Math.max(prev.unlocked || 1, w.unlocked || 1), time: Date.now(),
    });
  };

  /* ===================== MONDO ===================== */
  function newWorld() {
    const lv = JSON.parse(JSON.stringify(J.LEVEL1));
    return {
      level: lv, t: 0, player: null, enemies: [], projectiles: [], particles: [], pickups: [], boss: null,
      cam: { x: 0, y: 0, zoom: 1, tz: 1, shake: 0 }, cp: 0, cp2x: lv.checkpoints[2].x, gloves: false, glovesSeen: false,
      score: 0, cpScore: 0, cpEnergy: 100, lives: 3, kills: 0, scene: null, arenaLocked: false, bossStarted: false,
      msg: '', msgT: 0, hitstop: 0, deathT: -1, timeStart: 0, ambushDone: false, unlocked: 1, gateWarned: false, completeT: 0,
    };
  }

  function spawnFromCheckpoint(w, idx) {
    const lv = w.level; const cp = lv.checkpoints[idx];
    const cpx = idx === 2 ? w.cp2x : cp.x;
    let form = cp.form;
    w.player = E().makePlayer(cpx, form);
    E().setForm(w.player, form);
    w.player.en = Math.max(w.cpEnergy, 50);
    w.player.inv = 1.5;
    w.cam.zoom = w.cam.tz = J.FORMS[form].zoom;
    // nemici oltre il checkpoint (quelli già superati non ricompaiono)
    w.enemies = [];
    for (const d of lv.enemies) {
      if (d.x <= cpx + 160) continue;
      if (d.ambush && !w.gloves) continue;
      w.enemies.push(E().makeEnemy(d));
    }
    w.ambushDone = w.gloves;
    w.pickups = lv.pickups.filter((q) => q.x > cpx).map((q) => Object.assign({ taken: false }, q));
    if (!w.gloves) w.pickups.push({ type: 'gloves', x: lv.gloves.x, y: groundAt(lv, lv.gloves.x), taken: false });
    w.projectiles = []; w.particles = [];
    w.boss = J.boss.make(lv.boss); w.bossStarted = false; w.arenaLocked = false;
    w.scene = null; w.deathT = -1;
    snapCamera(w);
    J.audio.startMusic('stage');
  }
  function groundAt(lv, x) {
    let y = lv.groundY;
    for (const p of lv.platforms) if (x > p.x && x < p.x + p.w && p.y < y) y = p.y;
    return y;
  }

  function startLevel(fromSave) {
    const w = newWorld(); J.world = w;
    const s = fromSave ? loadSave() : null;
    if (s) {
      w.cp = s.cp || 0; w.cp2x = s.cp2x || w.cp2x; w.gloves = !!s.gloves; w.score = w.cpScore = s.score || 0;
      w.lives = Math.max(1, s.lives || 3); w.cpEnergy = s.en || 100; w.unlocked = s.unlocked || 1;
    } else {
      const prev = loadSave(); w.unlocked = (prev && prev.unlocked) || 1;
    }
    spawnFromCheckpoint(w, w.cp);
    game.mode = 'play'; game.modeT = 0;
    game.stats = { start: performance.now() };
    if (!s) {
      game.saveNow();
      w.scene = J.scenes.dialog([
        { who: 'LIVELLO 1 — IL RISVEGLIO DEI MOSTRI', text: 'Circuito di periferia. Durante le prove di velocità, strani guerrieri dall\'antico regno Yamatai invadono la pista...', col: '#9fd8ff' },
        { who: 'HIROSHI SHIBA', text: 'Chi sono questi soldati Haniwa?! Devo fermarli... e trovare i guanti che mi ha lasciato mio padre!', portrait: 'hiroshi', bg: '#c8302a' },
        { who: 'COMANDI', text: '← → muoviti · A attacco (combo pugno-pugno-calcio) · B salto (↓+B scende dalle passerelle) · A+B raggi (solo Jeeg) · T trasformazione · SEL cambia raggio · START pausa.', col: '#9fffc0' },
      ]);
    } else {
      game.msg('Partita ripresa dal checkpoint: ' + w.level.checkpoints[w.cp].label, 3);
    }
  }
  game.startLevel = startLevel;

  /* ===================== EVENTI DI GIOCO ===================== */
  game.msg = function (t, dur) { if (!J.world) return; J.world.msg = t; J.world.msgT = dur || 2.6; };
  game.shake = function (v) { if (J.world) J.world.cam.shake = Math.max(J.world.cam.shake, v); };
  game.hitstop = function (v) { if (J.world) J.world.hitstop = Math.max(J.world.hitstop, v); };
  game.setZoom = function (z) { if (J.world) J.world.cam.tz = z; };

  game.tryTransform = function () {
    const w = J.world; const p = w.player;
    if (w.scene || p.state === 'dead') return;
    if (p.form === 'human') {
      if (!w.gloves) { sfx('denied'); game.msg('Prima devi raccogliere i GUANTI MAGNETICI!'); return; }
      if (!p.onGround) { game.msg('Atterra per trasformarti'); return; }
      w.scene = J.scenes.transformCyborg();
    } else if (p.form === 'cyborg') {
      if (!p.onGround) { game.msg('Atterra per il BUILD UP'); return; }
      w.scene = J.scenes.buildUp();
    } else { sfx('denied'); game.msg('Sei già JEEG completo'); }
  };
  game.onJeegAssembled = function () {
    const w = J.world;
    w.cp2x = Math.max(w.player.x, 200); w.cp = Math.max(w.cp, 2);
    w.cpScore = w.score; w.cpEnergy = 100;
    game.saveNow();
    sfx('checkpoint');
    game.msg('JEEG COMPLETO! Checkpoint salvato. Avanza nella zona dei giganti →  (A+B raggio, SEL cambia tipo)', 5);
  };
  game.onPlayerDeath = function () { J.world.deathT = 0; J.audio.stopMusic(); };
  game.onBossDefeated = function () {
    const w = J.world; w.bossDefeatedT = 0;
    game.msg('HANIWA CORAZZATO DISTRUTTO!', 3);
  };

  function activateCheckpoint(w, idx) {
    if (idx <= w.cp) return;
    w.cp = idx; w.cpScore = w.score; w.cpEnergy = w.player.en;
    w.player.hp = Math.min(100, w.player.hp + 35);
    game.saveNow(); sfx('checkpoint');
    const cp = w.level.checkpoints[idx];
    E().floatText(cp.x, w.level.groundY - (w.player.form === 'jeeg' ? 360 : 150), 'CHECKPOINT!', '#9fffc0', w.player.form === 'jeeg' ? 48 : 24);
    game.msg('Checkpoint attivato: ' + cp.label + ' (salvato)', 3);
  }

  /* ===================== CAMERA ===================== */
  function snapCamera(w) { updateCamera(w, 1, true); }
  function updateCamera(w, dt, snap) {
    const c = w.cam; const p = w.player; const lv = w.level;
    c.zoom += (c.tz - c.zoom) * (snap ? 1 : Math.min(1, dt * 2.2));
    const vw = VW / c.zoom;
    let tx = p.x - vw * 0.4 + p.face * vw * 0.05;
    let maxX = lv.worldW - vw;
    if (p.form !== 'jeeg' && !(w.scene && w.scene.kind === 'buildup')) maxX = Math.min(maxX, lv.giantGateX + 160 - vw);
    if (w.arenaLocked) tx = lv.arena.x0 + ((lv.arena.x1 - lv.arena.x0) - vw) / 2;
    tx = Math.max(0, Math.min(maxX, tx));
    c.x = snap ? tx : c.x + (tx - c.x) * Math.min(1, dt * 5);
    const targetY = lv.groundY - 470 / c.zoom;
    c.y = targetY;
    c.shake = Math.max(0, c.shake - dt * 30);
  }

  /* ===================== AGGIORNAMENTO PARTITA ===================== */
  function updatePlay(dt) {
    const w = J.world; const p = w.player; const lv = w.level;
    if (J.input.pressed.START && !w.scene && w.deathT < 0 && !w.bossDefeatedT) { game.mode = 'pause'; game.pauseIndex = 0; sfx('select'); return; }
    w.t += dt;
    w.msgT -= dt;
    if (w.hitstop > 0) { w.hitstop -= dt; E().updateParticles(dt); return; }

    if (w.scene) { w.scene.update(dt); if (w.scene.done) w.scene = null; }
    E().updatePlayer(p, dt);
    if (!w.scene || !w.scene.blocksPlay) {
      for (const e of w.enemies) E().updateEnemy(e, dt);
      w.enemies = w.enemies.filter((e) => e.alive || e.deadT < 1.2);
      J.boss.update(w.boss, dt);
      E().updateProjectiles(dt);
    }
    E().updateParticles(dt);

    // raccolta oggetti
    const pb = E().box(p);
    for (const q of w.pickups) {
      if (q.taken) continue;
      const big = q.x > lv.giantGateX ? 2.4 : 1;
      const qb = { x0: q.x - 18 * big, x1: q.x + 18 * big, y0: q.y - 40 * big, y1: q.y };
      if (!E().overlap(pb, qb) || p.state === 'dead') continue;
      q.taken = true;
      if (q.type === 'gloves') {
        w.gloves = true; sfx('gloves'); w.score += 1000;
        E().floatText(q.x, q.y - 50, 'GUANTI MAGNETICI!', '#ffe14a', 26);
        E().sparks(q.x, q.y - 20, 20, '#ffe14a', 300, 3);
        game.saveNow(); // i guanti restano acquisiti anche dopo una sconfitta
        game.msg('GUANTI RACCOLTI! Premi T (o il pulsante TRASF.) quando vuoi trasformarti.', 5);
        if (!w.ambushDone) { w.ambushDone = true; for (const d of lv.enemies) if (d.ambush && d.x > p.x - 100) w.enemies.push(E().makeEnemy(Object.assign({}, d, { ambushDrop: true }))); }
      } else if (q.type === 'health') { p.hp = Math.min(100, p.hp + 35); sfx('pickup'); w.score += 50; E().floatText(q.x, q.y - 40 * big, '+VITA', '#7dff8a', 18 * big); }
      else if (q.type === 'energy') { p.en = Math.min(100, p.en + 40); sfx('pickup'); w.score += 50; E().floatText(q.x, q.y - 40 * big, '+ENERGIA', '#7fdcff', 18 * big); }
    }
    // rigenerazione lenta dell'energia dei raggi (solo Jeeg)
    if (p.form === 'jeeg' && p.state !== 'beam') p.en = Math.min(100, p.en + dt * 1.5);

    // checkpoint
    for (const cp of lv.checkpoints) {
      if (cp.auto || cp.id <= w.cp) continue;
      if (p.x >= cp.x && p.state !== 'dead' && (cp.form !== 'jeeg' || p.form === 'jeeg')) activateCheckpoint(w, cp.id);
    }

    // ingresso nell'arena del boss
    if (!w.bossStarted && p.form === 'jeeg' && p.x > lv.arena.x0 + 250) {
      w.bossStarted = true; w.arenaLocked = true;
      for (const e of w.enemies) if (e.x < lv.arena.x0) e.alive = false, e.deadT = 9;
      w.scene = J.scenes.bossIntro(w.boss);
    }

    // morte → respawn
    if (w.deathT >= 0) {
      w.deathT += dt;
      if (w.deathT > 1.8) {
        w.lives--;
        if (w.lives <= 0) { game.mode = 'gameover'; game.modeT = 0; setHiscore(w.score); w.lives = 0; game.saveNow(); return; }
        w.score = w.cpScore;
        game.saveNow();
        spawnFromCheckpoint(w, w.cp);
        game.msg('Respawn al checkpoint: ' + lv.checkpoints[w.cp].label + ' — vite: ' + w.lives, 3);
      }
    }
    // vittoria
    if (w.bossDefeatedT != null && w.bossDefeatedT !== false) {
      w.bossDefeatedT += dt;
      if (w.bossDefeatedT > 2.6 && !w.victoryStarted) {
        w.victoryStarted = true;
        w.scene = J.scenes.victory(() => {
          w.scene = J.scenes.dialog([
            { who: 'MIWA UZUKI', text: 'Ce l\'hai fatta, Hiroshi! Il mostro Haniwa è stato distrutto!', portrait: 'miwa', bg: '#2f6fd2' },
            { who: 'HIROSHI SHIBA', text: 'È solo l\'inizio. La Regina Himika e il regno Yamatai non si fermeranno... Torniamo alla base!', portrait: 'hiroshi', bg: '#c8302a' },
          ], () => completeLevel());
        });
      }
    }
    updateCamera(w, dt);
  }

  function completeLevel() {
    const w = J.world;
    w.unlocked = Math.max(w.unlocked, 2);
    const timeS = Math.round((performance.now() - game.stats.start) / 1000);
    const bonus = w.lives * 1000 + Math.max(0, 600 - timeS) * 10;
    w.score += bonus; setHiscore(w.score);
    game.stats.time = timeS; game.stats.bonus = bonus;
    // salva: livello 2 sbloccato, la partita del livello 1 riparte da capo
    writeSave({ version: 1, level: 2, cp: 0, gloves: false, score: w.score, lives: 3, en: 100, unlocked: w.unlocked, time: Date.now(), level1Done: true });
    game.mode = 'complete'; game.modeT = 0;
    J.audio.startMusic('title');
  }

  /* ===================== DISEGNO PARTITA ===================== */
  function drawPlay() {
    const g = J.g; const w = J.world; const c = w.cam; const t = w.t;
    J.bg.drawSky(c, t);
    J.bg.drawParallax(c, t);
    g.save();
    const sx = (Math.random() - 0.5) * c.shake, sy = (Math.random() - 0.5) * c.shake;
    g.translate(sx, sy); g.scale(c.zoom, c.zoom); g.translate(-c.x, -c.y);
    J.bg.drawWorldBack(c, w.level, t);
    J.bg.drawGround(c, w.level);
    for (const pl of w.level.platforms) J.bg.drawPlatform(pl);
    drawCheckpoints(w, t);
    for (const q of w.pickups) if (!q.taken) drawPickup(q, t, q.x > w.level.giantGateX ? 2.4 : 1);
    J.boss.draw(w.boss, t);
    for (const e of w.enemies) E().drawEnemy(e, t);
    if (!(w.scene && w.scene.hidePlayer)) E().drawPlayer(w.player, t);

    if (w.scene && w.scene.drawScreen) w.scene.drawScreen();
    if (w.deathT >= 0) { g.fillStyle = 'rgba(0,0,0,' + Math.min(0.7, w.deathT * 0.5) + ')'; g.fillRect(0, 0, VW, VH); if (w.deathT > 0.6) J.scenes.bigText(w.lives > 1 ? 'SCONFITTO!' : 'ULTIMA VITA PERSA', 480, 270, 54, '#ff6a4a'); }
  }

  function drawCheckpoints(w, t) {
    const S = J.spr; const g = J.g; const gy = w.level.groundY;
    for (const cp of w.level.checkpoints) {
      if (cp.id === 0 || cp.auto) continue;
      const big = cp.x > w.level.giantGateX ? 2.4 : 1;
      const on = w.cp >= cp.id;
      g.save(); g.translate(cp.x, gy); g.scale(big, big);
      S.cap(0, 0, 0, -110, 3, '#c8ccd6', '#8d93a8');

      g.fillStyle = '#fff'; g.font = 'bold 11px Arial'; g.fillText('CP', 10, -96 + wave / 2);

      else { S.circ(0, 0, 11, '#2a7ae0', 2); S.poly([-2, -9, 4, -9, 0, -1, 5, -1, -3, 10, -1, 2, -5, 2], '#ffe14a', 1.2); }
    }

  }

  /* ===================== HUD ===================== */
  function bar(x, y, w, h, v, col, back) {

    g.translate(50, 70);
    if (p.form === 'jeeg') { g.scale(3.4, 3.4); S.JEEG.head(); }
    else if (p.form === 'cyborg') { g.scale(2.1, 2.1); S.CYBORG.head(); }

    g.restore();
    g.font = 'bold 15px Impact, "Arial Black", sans-serif'; g.fillStyle = '#ffe14a'; g.fillText(J.FORMS[p.form].label, 98, 30);

    const jeeg = p.form === 'jeeg';
    for (const [i, k, lab] of [[0, 'gamma', 'GAMMA'], [1, 'proton', 'PROTONICO']]) {

      g.globalAlpha = pulse * 0.5; g.beginPath(); g.arc(0, 0, 46, 0, 7); g.strokeStyle = '#fff'; g.stroke(); g.globalAlpha = 1;
      if (p.form === 'human') { g.save(); g.scale(0.55, 0.55); g.translate(0, -58); for (const sx of [-1, 1]) { S.poly([sx * 2, 40, sx * 2, 70, sx * 34, 72, sx * 42, 56, sx * 38, 40], '#f6e04a', 3); S.ell(sx * 24, 56, 7, 9, '#1b5a2a', 0, 2); } g.restore(); }
      else { g.save(); g.translate(0, 10); g.scale(1.4, 1.4); S.JEEG.head(); g.restore(); }
      g.restore();
      J.scenes.bigText('T', x + 30, y + 30, 26, '#fff');
      g.font = 'bold 12px Arial'; g.textAlign = 'center'; g.fillStyle = '#ffe14a';
      g.fillText(p.form === 'human' ? 'TRASFORMAZIONE' : 'BUILD UP', x + 60, y + 98); g.textAlign = 'left';
    }

    // barra boss

      g.fillStyle = '#1b1020'; g.fillRect(174 + 612 * 0.66, VH - 36, 2, 14); g.fillRect(174 + 612 * 0.33, VH - 36, 2, 14);
    }

  }

  /* ===================== MENU / SCHERMATE ===================== */
  function titleItems() {
    const s = loadSave();
    const items = [{ id: 'new', label: 'NUOVA PARTITA' }];
    if (s && !s.level1Done && (s.cp > 0 || s.gloves)) items.push({ id: 'continue', label: 'CONTINUA (checkpoint ' + s.cp + ')' });
    items.push({ id: 'levels', label: 'SELEZIONE LIVELLI' });
    items.push({ id: 'remap', label: 'CONFIGURA COMANDI' });
    items.push({ id: 'music', label: 'MUSICA: ' + (J.audio.musicOn ? 'ON' : 'OFF') });
    return items;
  }
  function menuNav(n, idx) {
    const inp = J.input;
    if (inp.menuPressed('up')) { sfx('select'); return (idx + n - 1) % n; }
    if (inp.menuPressed('down')) { sfx('select'); return (idx + 1) % n; }
    return idx;
  }
  const confirm = () => J.input.menuPressed('A') || J.input.menuPressed('START');

  function updateTitle(dt) {
    const items = titleItems();
    game.menuIndex = menuNav(items.length, Math.min(game.menuIndex, items.length - 1));
    if (game.modeT > 0.3 && confirm()) {
      const it = items[game.menuIndex]; sfx('checkpoint');
      if (it.id === 'new') startLevel(false);
      else if (it.id === 'continue') startLevel(true);
      else if (it.id === 'levels') { game.mode = 'levels'; game.modeT = 0; game.levelsIndex = 0; }
      else if (it.id === 'remap') { game.mode = 'remap'; game.modeT = 0; game.remap = { step: -1, done: false }; }
      else if (it.id === 'music') J.audio.toggleMusic();

  }

  function updateLevels() {
    const inp = J.input; const n = J.CAMPAIGN.length;

  function drawLevels(t) {

        g.fillText(String(L.n).padStart(2, '0') + '  ' + L.title, x + 10, y + 13);
        g.font = '11px Arial'; g.fillStyle = '#9fa6c8'; g.fillText(L.env + ' · boss: ' + L.boss, x + 36, y + 27);
        g.font = 'bold 11px Arial'; g.textAlign = 'right';
        g.fillStyle = L.playable ? '#7dff8a' : L.n <= unlocked ? '#ffe14a' : '#ff7a7a';
        g.fillText(L.playable ? 'GIOCABILE' : L.n <= unlocked ? 'SBLOCCATO · IN SVILUPPO' : 'BLOCCATO · IN SVILUPPO', x + 422, y + 13);
        g.textAlign = 'left';
      }
    }
    g.font = 'bold 13px Arial'; g.fillStyle = '#ffe14a'; g.fillText('↑↓ scegli · ←→ cambia capitolo · A gioca · B indietro', 40, 525);
  }

  const REMAP_STEPS = [['A', 'ATTACCO (A)'], ['B', 'SALTO (B)'], ['AB', 'RAGGIO (pulsante A+B dedicato)'], ['T', 'TRASFORMAZIONE (T)'], ['SEL', 'SELEZIONE RAGGIO'], ['START', 'START / PAUSA']];
  function updateRemap() {
    const r = game.remap; const inp = J.input;
    if (r.step === -1) {
      if (game.modeT > 0.3 && inp.menuPressed('A')) { r.step = 0; ask(); }
      else if (game.modeT > 0.3 && inp.menuPressed('SEL')) { J.input.resetBindings(); r.msg = 'Comandi predefiniti ripristinati'; sfx('checkpoint'); }
      else if (game.modeT > 0.3 && (inp.menuPressed('B') || inp.menuPressed('START'))) { game.mode = 'title'; game.modeT = 0; }
    } else if (r.done && game.modeT > 1.2) { game.mode = 'title'; game.modeT = 0; }
    function ask() {
      J.input.captureNext((ev) => {
        J.input.setBinding(REMAP_STEPS[r.step][0], ev); sfx('select');
        r.last = (ev.kind === 'key' ? 'Tasto ' + ev.code : 'Pulsante gamepad ' + ev.index);
        r.step++;
        if (r.step >= REMAP_STEPS.length) { r.done = true; game.modeT = 0; sfx('checkpoint'); J.input.clearAll(); }
        else ask();
      });
    }
  }
  function drawRemap(t) {
    const g = J.g; const r = game.remap;
    g.fillStyle = '#101838'; g.fillRect(0, 0, VW, VH);
    J.scenes.bigText('CONFIGURA COMANDI', 480, 60, 40, '#ffe14a');
    g.font = '17px "Trebuchet MS", Arial'; g.fillStyle = '#fff'; g.textAlign = 'center';
    if (r.step === -1) {
      g.fillText('Per console arcade, encoder USB, gamepad o tastiera.', 480, 130);
      g.fillText('A = avvia configurazione · SEL = ripristina predefiniti · B/START = indietro', 480, 160);
      g.font = '15px Arial'; g.fillStyle = '#9fd8ff';
      const lines = ['Predefiniti tastiera: frecce/WASD, Z o CTRL = A, X o ALT o SPAZIO = B, V = A+B,', 'T o SHIFT = trasformazione, C = selettore raggio, INVIO/1/5 = START, F = schermo intero.',
        'Gamepad standard: 0 = A, 1 = B, 2 = T, 3 = SEL, 4/5 = A+B, 9 = START, croce/levetta = movimento.'];
      lines.forEach((l, i) => g.fillText(l, 480, 220 + i * 26));
      if (r.msg) { g.fillStyle = '#7dff8a'; g.fillText(r.msg, 480, 330); }
    } else if (!r.done) {
      g.fillText('Premi il tasto o pulsante per:', 480, 180);
      J.scenes.bigText(REMAP_STEPS[r.step][1], 480, 250, 40, Math.floor(t * 3) % 2 ? '#ffffff' : '#ffe14a');
      g.fillStyle = '#9fd8ff'; g.fillText('Passo ' + (r.step + 1) + ' di ' + REMAP_STEPS.length + (r.last ? ' · ultimo: ' + r.last : ''), 480, 320);
    } else { J.scenes.bigText('COMANDI SALVATI!', 480, 260, 44, '#7dff8a'); }
    g.textAlign = 'left';
  }

  function updatePause() {
    const items = ['RIPRENDI', 'RIPARTI DAL CHECKPOINT', 'MUSICA ON/OFF', 'MENU PRINCIPALE'];
    game.pauseIndex = menuNav(items.length, game.pauseIndex);
    if (J.input.menuPressed('START')) { game.mode = 'play'; J.input.clearAll(); return; }
    if (J.input.menuPressed('A')) {
      sfx('select');
      if (game.pauseIndex === 0) { game.mode = 'play'; J.input.clearAll(); }
      else if (game.pauseIndex === 1) { const w = J.world; w.score = w.cpScore; spawnFromCheckpoint(w, w.cp); game.mode = 'play'; J.input.clearAll(); }
      else if (game.pauseIndex === 2) J.audio.toggleMusic();
      else { game.mode = 'title'; game.modeT = 0; J.audio.startMusic('title'); }
    }
  }
  function drawPause(t) {
    drawPlay();
    const g = J.g; g.fillStyle = 'rgba(0,0,20,0.6)'; g.fillRect(0, 0, VW, VH);
    J.scenes.bigText('PAUSA', 480, 150, 64, '#ffe14a');
    ['RIPRENDI', 'RIPARTI DAL CHECKPOINT', 'MUSICA ON/OFF', 'MENU PRINCIPALE'].forEach((l, i) => {
      g.font = 'bold 24px Impact, "Arial Black", sans-serif'; g.textAlign = 'center'; g.fillStyle = i === game.pauseIndex ? '#ffe14a' : '#fff';
      g.fillText((i === game.pauseIndex ? '▶ ' : '') + l, 480, 230 + i * 44);
    });
    g.textAlign = 'left';
  }

  function updateGameOver() {
    if (game.modeT > 1 && J.input.menuPressed('START')) { const w = J.world; w.lives = 3; w.score = w.cpScore = 0; game.saveNow(); spawnFromCheckpoint(w, w.cp); game.mode = 'play'; J.input.clearAll(); }
    if (game.modeT > 1 && J.input.menuPressed('B')) { game.mode = 'title'; game.modeT = 0; J.audio.startMusic('title'); }
    if (game.modeT > 15) { game.mode = 'title'; game.modeT = 0; J.audio.startMusic('title'); }
  }
  function drawGameOver(t) {
    const g = J.g; g.fillStyle = '#0a0612'; g.fillRect(0, 0, VW, VH);
    J.scenes.bigText('GAME OVER', 480, 220, 90, '#ff4a3a');
    g.font = 'bold 20px Arial'; g.textAlign = 'center'; g.fillStyle = '#fff';
    g.fillText('START: continua dal checkpoint (' + J.world.level.checkpoints[J.world.cp].label + ')', 480, 300);
    g.fillText('B: menu principale · ritorno automatico tra ' + Math.max(0, Math.ceil(15 - game.modeT)) + 's', 480, 334);
    g.textAlign = 'left';
  }
  function updateComplete() { if (game.modeT > 1.5 && confirm()) { game.mode = 'levels'; game.modeT = 0; game.levelsIndex = 1; } }
  function drawComplete(t) {
    const g = J.g; const w = J.world;
    g.fillStyle = '#13205a'; g.fillRect(0, 0, VW, VH);
    J.scenes.speedLines(480, 270, t, 'rgba(255,200,80,0.25)', 50);
    g.save(); g.translate(250, 500); g.scale(3.6, 3.6); J.spr.drawHumanoid(J.spr.JEEG, J.spr.pose('cheer', t)); g.restore();
    J.scenes.bigText('LIVELLO 1 COMPLETATO!', 600, 110, 48, '#ffe14a', '#c8302a');
    g.font = 'bold 22px Arial'; g.fillStyle = '#fff';
    const rows = [['Nemici sconfitti', w.kills], ['Tempo', game.stats.time + ' s'], ['Bonus vite + tempo', game.stats.bonus], ['PUNTEGGIO', w.score], ['Hi-score', hiscore()]];
    rows.forEach((r, i) => { g.fillText(r[0], 470, 190 + i * 40); g.textAlign = 'right'; g.fillText(String(r[1]), 880, 190 + i * 40); g.textAlign = 'left'; });
    g.fillStyle = '#7dff8a'; g.fillText('Livello 2 "Il rapimento di Mayumi" sbloccato (in sviluppo)', 420, 420);
    if (Math.floor(t * 2) % 2 === 0) { g.fillStyle = '#ffe14a'; g.fillText('Premi A / START', 560, 470); }
  }

  /* ===================== CICLO PRINCIPALE ===================== */
  function step(dt) {
    J.input.update();
    game.modeT += dt;
    switch (game.mode) {
      case 'title': updateTitle(dt); break;
      case 'levels': updateLevels(); break;
      case 'remap': updateRemap(); break;
      case 'play': updatePlay(dt); break;
      case 'pause': updatePause(); break;
      case 'gameover': updateGameOver(); break;
      case 'complete': updateComplete(); break;
    }
  }
  function render(t) {
    const g = J.g;
    g.setTransform(J.scale, 0, 0, J.scale, 0, 0);
    switch (game.mode) {
      case 'title': drawTitle(t); break;
      case 'levels': drawLevels(t); break;
      case 'remap': drawRemap(t); break;
      case 'play': drawPlay(); break;
      case 'pause': drawPause(t); break;
      case 'gameover': drawGameOver(t); break;
      case 'complete': drawComplete(t); break;
    }
  }

  let last = 0, acc = 0, clock = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
    acc += dt * (game.timeScale || 1);
    let n = 0;
    while (acc >= J.DT && n < 8) { step(J.DT); acc -= J.DT; clock += J.DT; n++; }
    if (n >= 8) acc = 0;
    render(clock);
    requestAnimationFrame(frame);
  }

  function resize() {
    const cv = J.canvas; const wrap = cv.parentElement;
    const aw = wrap.clientWidth, ah = wrap.clientHeight;
    const s = Math.min(aw / VW, ah / VH);
    const cssW = Math.floor(VW * s), cssH = Math.floor(VH * s);
    cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    J.scale = cv.width / VW;
  }

  game.boot = function (canvas) {
    J.canvas = canvas; J.g = canvas.getContext('2d'); J.spr.setCtx(J.g);
    resize(); addEventListener('resize', resize);
    addEventListener('keydown', (e) => { if (e.code === 'KeyF') toggleFullscreen(); if (e.code === 'KeyM') J.audio.toggleMusic(); });
    J.audio.startMusic('title');
    requestAnimationFrame(frame);
  };
  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
    else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
  game.toggleFullscreen = toggleFullscreen;

  /* API di debug / test automatici */
  window.JEEG = {
    get world() { return J.world; }, get mode() { return game.mode; }, game,
    start: (fromSave) => startLevel(fromSave), god: (v) => (game.godMode = v !== false),
    teleport: (x) => { J.world.player.x = x; }, input: J.input,
  };
})();

</script>
<script>
  (function () {
    var isTouch = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches) || /[?&]touch=1/.test(location.search);
    if (isTouch) document.body.classList.add('touch');
    J.input.bindTouch(document.getElementById('touch'));
    document.getElementById('fs').addEventListener('click', function () { J.game.toggleFullscreen(); });
    J.game.boot(document.getElementById('game'));
  })();
</script>
