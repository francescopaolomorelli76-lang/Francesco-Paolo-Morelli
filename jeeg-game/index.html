<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jeeg Robot d'Acciaio — Livello 1</title>
<!--STYLE-->
<link rel="stylesheet" href="src/style.css">
<!--/STYLE-->
</head>
<body>
<div id="wrap"><canvas id="game" aria-label="Jeeg Robot d'Acciaio — gioco"></canvas></div>

<div id="touch" aria-hidden="true">
  <div class="pad left">
    <button data-btn="left">◀</button>
    <button data-btn="down" class="small">▼</button>
    <button data-btn="right">▶</button>
  </div>
  <div class="pad right">
    <button data-btn="T" class="small t">TRASF.</button>
    <button data-btn="SEL" class="small">RAGGIO</button>
    <button data-btn="AB" class="ab">A+B</button>
    <button data-btn="A" class="a">A</button>
    <button data-btn="B" class="b">B</button>
  </div>
  <div class="top">
    <button data-btn="START" class="small">START</button>
    <button id="fs" class="small">⛶</button>
  </div>
</div>

<!--SCRIPTS-->
<script src="src/config.js"></script>
<script src="src/input.js"></script>
<script src="src/audio.js"></script>
<script src="src/sprites.js"></script>
<script src="src/background.js"></script>
<script src="src/entities.js"></script>
<script src="src/boss.js"></script>
<script src="src/scenes.js"></script>
<script src="src/game.js"></script>
<!--/SCRIPTS-->
<script>
  (function () {
    var isTouch = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches) || /[?&]touch=1/.test(location.search);
    if (isTouch) document.body.classList.add('touch');
    J.input.bindTouch(document.getElementById('touch'));
    document.getElementById('fs').addEventListener('click', function () { J.game.toggleFullscreen(); });
    J.game.boot(document.getElementById('game'));
  })();
</script>
</body>
</html>
