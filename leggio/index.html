<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mozart">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>[hidden]{display:none!important}:root{padding-top:0}body{margin:0}*{box-sizing:border-box}</style>
<title>Mozart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,900;1,6..96,600&family=Manrope:wght@400;500;600;700;800&family=Noto+Music&display=swap">
<style>
/* Mozart — palcoscenico nero, filo d'oro, carta bianca al centro.
   Layout: la pagina occupa tutto lo schermo; barre e pannelli scorrono dai quattro bordi. */
:root{
  --stage:#0b0a08;
  --panel:#16130e;
  --panel-2:#211d15;
  --panel-3:#2b261c;
  --line:#3a3326;
  --gold:#d6a84e;
  --gold-hi:#f2d382;
  --gold-deep:#8f6a22;
  --text:#f4ecdc;
  --muted:#a89c83;
  --paper:#fbf8f1;
  --danger:#e0624f;
  --ok:#7bc47f;
  --glass:rgba(18,15,10,.86);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Manrope",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-music:"Noto Music","Bravura","Apple Symbols","Segoe UI Symbol",serif;
  --r-pill:999px;
  --r-card:18px;
  --shadow:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;background:var(--stage);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.music{font-family:var(--f-music)}

#app{position:fixed;inset:0;overflow:hidden}

/* ---------- Palco e pagina ---------- */
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;background:
  radial-gradient(120% 80% at 50% 0%,#1a160f 0%,var(--stage) 60%)}
#pageWrap{position:relative;overflow:hidden;background:var(--paper);box-shadow:0 0 0 1px rgba(214,168,78,.12),0 30px 80px rgba(0,0,0,.7);transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
#pageWrap.turn-next{transform:translateX(-18px);opacity:.4}
#pageWrap.turn-prev{transform:translateX(18px);opacity:.4}
#pageCanvas,#inkCanvas{position:absolute;left:0;top:0}
#inkCanvas{touch-action:none}
body.night #pageCanvas{filter:invert(1) hue-rotate(180deg) brightness(.92)}
body.night #pageWrap{background:#111}
#ribbon{position:absolute;top:-4px;right:28px;width:22px;height:46px;background:linear-gradient(var(--gold-hi),var(--gold));clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));pointer-events:none}
#metroFlash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 var(--gold);transition:box-shadow .12s ease-out}
#metroFlash.on{box-shadow:inset 0 0 0 10px var(--gold)}
#metroFlash.accent{box-shadow:inset 0 0 0 16px var(--gold-hi)}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-size:22px;letter-spacing:.04em}

/* ---------- Bordi: indicatore di pressione lunga ---------- */
.edgeGlow{position:absolute;pointer-events:none;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);opacity:0;transition:opacity .15s}
.edgeGlow.top,.edgeGlow.bottom{left:15%;right:15%;height:3px;transform:scaleX(0);transform-origin:center}
.edgeGlow.top{top:calc(env(safe-area-inset-top,0px) + 2px)}
.edgeGlow.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 2px)}
.edgeGlow.left,.edgeGlow.right{top:15%;bottom:15%;width:3px;background:linear-gradient(180deg,transparent,var(--gold-hi),transparent);transform:scaleY(0)}
.edgeGlow.left{left:2px}.edgeGlow.right{right:2px}
.edgeGlow.charging{opacity:1;transform:scale(1);transition:opacity .1s,transform var(--lp,450ms) linear}

/* ---------- Barre ---------- */
.bar{position:absolute;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s;pointer-events:none}
.bar>*{pointer-events:auto}
#topbar{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px}
#topbar.hide{transform:translateY(-120%);opacity:0}
.bar.hide>*{pointer-events:none}
#bottombar{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-top:10px}
#bottombar.hide{transform:translateY(130%);opacity:0}
.pill{display:flex;align-items:center;gap:2px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(214,168,78,.22);border-radius:var(--r-pill);padding:5px;box-shadow:var(--shadow)}
.ib{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--text);transition:background .15s,color .15s}
.ib:hover{background:rgba(255,255,255,.06)}
.ib:active{background:rgba(214,168,78,.18)}
.ib.on{background:var(--gold);color:#1a1408}
#titlePill{flex:1;min-width:0;justify-content:center;gap:10px;padding:5px 8px 5px 14px}
#titlePill .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:15.5px}
#titlePill .t b{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em}
#titlePill .t span{color:var(--muted);font-weight:500}
.brandDot{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 1.5px var(--gold)}
.brandDot img{width:100%;height:100%;display:block}

/* Pulsante d'oro "Inserisci pagine" — presente in ogni parte dell'app */
.goldBtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;border-radius:var(--r-pill);background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-deep));color:#1b1406;font-weight:800;font-size:14px;letter-spacing:.02em;box-shadow:0 6px 18px rgba(214,168,78,.35),inset 0 1px 0 rgba(255,255,255,.5);white-space:nowrap}
.goldBtn svg.i{stroke-width:2.2}
.goldBtn:active{transform:translateY(1px)}
.goldBtn.sm{height:36px;padding:0 12px 0 9px;font-size:13px}
.goldBtn.block{width:100%;justify-content:center;height:50px;font-size:15px}
.ghostBtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--panel-2);font-weight:600}
.ghostBtn:active{background:var(--panel-3)}
.ghostBtn.danger{color:var(--danger)}

/* Scrubber pagine */
#scrub{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px}
#scrubTrack{position:relative;flex:1;height:44px;touch-action:none;cursor:pointer}
#scrubDots{position:absolute;left:8px;right:8px;top:50%;height:6px;transform:translateY(-50%);display:flex;justify-content:space-between;align-items:center}
#scrubDots i{width:5px;height:5px;border-radius:50%;background:rgba(244,236,220,.32)}
#scrubDots i.bm{background:var(--gold);width:7px;height:7px}
#scrubKnob{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 0 3px rgba(214,168,78,.6);transition:left .2s}
#scrubTrack.drag #scrubKnob{transition:none}
#scrubBubble{position:absolute;bottom:52px;transform:translateX(-50%);background:var(--gold);color:#1b1406;font-weight:800;padding:6px 12px;border-radius:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
#scrubTrack.drag #scrubBubble{opacity:1}
#pageNum{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:center;color:var(--gold-hi)}
#setlistNav{display:none}
#setlistNav.on{display:flex}

/* ---------- Pannelli laterali ---------- */
.side{position:absolute;top:0;bottom:0;z-index:30;width:min(420px,92vw);background:var(--panel);display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#library{left:0;border-right:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);transform:translateX(-105%)}
#library.open{transform:none}
#tools{right:0;width:min(360px,92vw);border-left:1px solid var(--line);padding-right:env(safe-area-inset-right,0px);transform:translateX(105%)}
#tools.open{transform:none}
.sideHead{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 10px;display:flex;flex-direction:column;gap:12px}
.sideHead .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sideHead h2{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.005em;margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);padding:0 12px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px}
.tabs{display:flex;justify-content:center;gap:4px;background:var(--panel-2);border-radius:var(--r-pill);padding:4px;align-self:center;border:1px solid var(--line)}
.tabs button{width:46px;height:38px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--muted)}
.tabs button.on{background:var(--gold);color:#1b1406}
.sideBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 120px 20px;position:relative}
.group{margin-top:14px}
.groupHead{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px 6px 0}
.item{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:active{background:rgba(214,168,78,.06)}
.item .tx{flex:1;min-width:0}
.item .tt{font-size:16.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.item .st{font-size:13.5px;color:var(--muted);margin-top:2px}
.item.cur .tt{color:var(--gold-hi)}
.item .infoBtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--gold)}
.item .chev{color:var(--muted)}
.item .chk{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--muted);flex:none;display:grid;place-items:center}
.item .chk.on{background:var(--gold);border-color:var(--gold);color:#1b1406}
.thumb{width:40px;height:52px;border-radius:4px;background:var(--paper);flex:none;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.thumb canvas{width:100%;height:100%;display:block}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--gold);border:1px solid rgba(214,168,78,.4);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.letterIdx{position:absolute;right:2px;top:150px;bottom:110px;display:flex;flex-direction:column;justify-content:center;gap:1px;font-size:11px;font-weight:700;color:var(--gold);z-index:2}
.letterIdx button{padding:1px 6px}
.sideFoot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,var(--panel) 30%)}
.empty{color:var(--muted);padding:28px 8px;line-height:1.5}

/* Attrezzi */
.toolList{padding:0 12px 40px}
.toolList h3{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:22px 8px 6px}
.toolRow{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:6px 10px;border-radius:12px;font-size:16.5px;font-weight:500;text-align:left}
.toolRow svg.i{color:var(--gold)}
.toolRow:active{background:rgba(214,168,78,.1)}
.toolRow small{margin-left:auto;color:var(--muted);font-size:12.5px}
.toolRow.gold{background:linear-gradient(180deg,rgba(242,211,130,.18),rgba(214,168,78,.08));border:1px solid rgba(214,168,78,.45);font-weight:700}

/* ---------- Popover e modali ---------- */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.35)}
.scrim.clear{background:transparent}
.pop{position:absolute;z-index:50;background:rgba(30,26,19,.97);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(214,168,78,.25);border-radius:22px;box-shadow:var(--shadow);padding:16px;max-height:calc(100% - 100px);overflow:auto;animation:popIn .18s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.pop h4{margin:0 0 12px;font-family:var(--f-display);font-size:21px;font-weight:700;text-align:center}
.modal{position:absolute;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--panel);border:1px solid rgba(214,168,78,.3);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:popIn .2s ease-out}
.modal.full{width:calc(100% - 16px);height:calc(100% - 16px);max-height:none;border-radius:22px}
.mHead{display:flex;align-items:center;gap:10px;padding:16px 16px 12px 22px;border-bottom:1px solid var(--line)}
.mHead h3{flex:1;margin:0;font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.mHead .eyebrow{display:block;margin-bottom:3px}
.mBody{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.mFoot{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:0 12px;font-size:16px;outline:none}
.field textarea{height:80px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* Inserisci pagine: tre grandi scelte */
.srcCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.srcCard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel-2);text-align:left;min-height:132px}
.srcCard svg.i{width:34px;height:34px;color:var(--gold)}
.srcCard b{font-size:16px}
.srcCard span{font-size:13px;color:var(--muted);line-height:1.4}
.srcCard.hero{border-color:var(--gold);background:linear-gradient(160deg,rgba(242,211,130,.16),rgba(214,168,78,.04) 60%)}
.srcCard:active{transform:scale(.99)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:38px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:14px}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#1b1406}

/* ---------- Scanner ---------- */
#scanModal .mBody{padding:0;flex:1;overflow:hidden;display:flex;flex-direction:column;gap:0}
.scanStage{flex:1;min-height:0;position:relative;background:#050403;display:grid;place-items:center;overflow:hidden;touch-action:none}
.scanStage canvas{max-width:100%;max-height:100%;display:block}
.scanOverlay{position:absolute;inset:0;pointer-events:none}
.scanOverlay svg{width:100%;height:100%;overflow:visible}
.handle{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--gold-hi);background:rgba(214,168,78,.25);box-shadow:0 0 0 2px rgba(0,0,0,.5);pointer-events:auto;touch-action:none}
.loupe{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid var(--gold);box-shadow:var(--shadow);pointer-events:none;overflow:hidden;display:none;background:#000}
.loupe.on{display:block}
.loupe canvas{width:100%;height:100%}
.scanCtl{padding:12px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);background:var(--panel)}
.scanSteps{display:flex;gap:6px}
.scanSteps button{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;font-size:14px;color:var(--muted)}
.scanSteps button.on{color:#1b1406;background:var(--gold);border-color:var(--gold)}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.sl{display:flex;flex-direction:column;gap:2px}
.sl span{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.sl span em{font-style:normal;color:var(--gold-hi);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold) var(--v,50%),var(--panel-3) var(--v,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--panel-3)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0}
.scanQueue{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.scanQueue .q{width:44px;height:58px;border-radius:5px;background:#fff;flex:none;overflow:hidden;border:2px solid var(--gold)}
.scanQueue .q img{width:100%;height:100%;object-fit:cover}
.compare{position:absolute;left:12px;top:12px;z-index:3}

/* ---------- Modalità annotazione ---------- */
#annobar{position:absolute;top:0;left:0;right:0;z-index:25;background:rgba(22,19,14,.97);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);transform:translateY(-110%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#annobar.open{transform:none}
.annoTop{display:flex;align-items:center;gap:8px;height:54px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.annoTop .ttl{flex:1;text-align:center;font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.annoTop .ttl span{color:var(--gold)}
.annoTools{display:flex;align-items:center;height:60px;overflow-x:auto;border-top:1px solid var(--line);padding-left:max(4px,env(safe-area-inset-left,0px));scrollbar-width:none}
.annoTools::-webkit-scrollbar{display:none}
.annoTools .sep{width:1px;height:34px;background:var(--line);margin:0 4px;flex:none}
.preset{position:relative;width:56px;height:60px;flex:none;display:grid;place-items:center}
.preset.on{background:rgba(214,168,78,.16)}
.preset.on::after{content:"···";position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:var(--gold);letter-spacing:1px}
.preset canvas{width:44px;height:44px;border-radius:12px;background:#efe9dd;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.atool{width:52px;height:60px;flex:none;display:grid;place-items:center;color:var(--gold-hi)}
.atool.on{background:rgba(214,168,78,.18)}
.atool.dis{opacity:.35}
#ink-sel{position:absolute;border:1.5px dashed var(--gold);pointer-events:none;z-index:5}
#selBar{position:absolute;z-index:26;display:flex;gap:4px}
#textEntry{position:absolute;z-index:26;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:6px}
#textEntry input{width:220px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);padding:0 10px;font-size:17px;outline:none}

/* Stile pennello */
.brushPrev{height:86px;border-radius:14px;border:1px solid var(--line);background:repeating-conic-gradient(#e8e4dc 0 25%,#fff 0 50%) 0 0/16px 16px;overflow:hidden}
.brushPrev canvas{width:100%;height:100%;display:block}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.sw.on{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--gold-hi)}
.switchRow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch{width:52px;height:32px;border-radius:16px;background:var(--panel-3);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--gold)}
.switch.on::after{transform:translateX(20px)}
.popActions{display:flex;justify-content:center;gap:24px;margin-top:12px}
.popActions button{width:48px;height:48px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center}

/* Segni musicali */
#stampPanel{width:min(440px,calc(100% - 24px))}
.stampHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.stampHead select{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:0 10px;font-size:16px;font-weight:700;font-family:var(--f-display)}
.catChips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.catChips::-webkit-scrollbar{display:none}
.catChips button{flex:none;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.catChips button.on{background:var(--gold);color:#1b1406;border-color:var(--gold)}
.stampGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-height:min(46vh,380px);overflow-y:auto;touch-action:pan-y}
.stamp{height:66px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.03);color:var(--text);overflow:hidden;position:relative}
.stamp.on{background:rgba(214,168,78,.28);box-shadow:inset 0 0 0 1.5px var(--gold)}
.stamp canvas{width:100%;height:100%}
.stamp small{position:absolute;bottom:2px;left:2px;right:2px;font-size:9px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--panel-3)}
.dots i.on{background:var(--gold-hi)}
.stampFoot{display:flex;align-items:center;gap:10px}
.stampFoot .sl{flex:1}

/* Forme */
.shapeList{display:flex;flex-direction:column;gap:2px;min-width:260px}
.shapeRow{display:flex;align-items:center;gap:12px;height:52px;border-radius:12px;padding:0 10px}
.shapeRow.on{background:rgba(214,168,78,.16)}
.shapeRow canvas{width:60px;height:40px}
.shapeRow b{flex:1;font-weight:600}

/* ---------- Metronomo ---------- */
#metroPop{width:min(400px,calc(100% - 24px))}
.dialWrap{position:relative;width:100%;aspect-ratio:1/1;max-width:340px;margin:6px auto}
.dialWrap svg{width:100%;height:100%;touch-action:none}
.dialNum{position:absolute;font-variant-numeric:tabular-nums;line-height:1}
.dialNum b{display:block;font-family:var(--f-display);font-size:40px;font-weight:700}
.dialNum small{font-size:12.5px;color:var(--muted);font-weight:600}
.dialNum.tl{left:0;top:0}.dialNum.tr{right:0;top:0;text-align:right}.dialNum.bl{left:0;bottom:0}.dialNum.br{right:0;bottom:0;text-align:right}
.dialNum.tl,.dialNum.tr{cursor:pointer}
.metroRow{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
.metroRow button{flex:1;height:38px;border-radius:var(--r-pill);background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:700}
.metroRow button.on{border-color:var(--gold);color:var(--gold-hi)}
.noteGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.noteGrid button{height:58px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);font-weight:800;font-size:17px}
.noteGrid button.on{background:var(--gold);color:#1b1406}
.tuner{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.tuner .note{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1}
.tuner .hz{color:var(--muted);font-variant-numeric:tabular-nums}
.gauge{width:100%;max-width:320px}

/* Pianoforte */
#pianoSheet{position:absolute;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:1px solid var(--gold-deep);padding:10px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .3s}
#pianoSheet.open{transform:none}
.pianoHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.keys{position:relative;height:150px;display:flex;touch-action:none}
.wk{flex:1;background:linear-gradient(#fff,#efe9dd);border:1px solid #aaa;border-radius:0 0 8px 8px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:11px;font-weight:700;color:#6b5b3a}
.wk.dn,.bk.dn{background:var(--gold)}
.bk{position:absolute;top:0;height:60%;background:linear-gradient(#2a2622,#0b0a08);border-radius:0 0 6px 6px;z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.5)}

/* Riordina */
.pageGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.pg{display:flex;flex-direction:column;gap:6px;align-items:center}
.pg .pv{width:100%;aspect-ratio:3/4;background:#fff;border-radius:6px;overflow:hidden;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4);position:relative}
.pg .pv canvas{max-width:100%;max-height:100%}
.pg .pv .n{position:absolute;left:6px;top:6px;background:var(--gold);color:#1b1406;font-weight:800;font-size:12px;border-radius:8px;padding:2px 7px}
.pg .pv .nw{position:absolute;right:6px;top:6px;background:#1b1406;color:var(--gold-hi);font-weight:800;font-size:10px;border-radius:8px;padding:2px 6px}
.pg .acts{display:flex;gap:2px}
.pg .acts button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2)}
.pg.del .pv{opacity:.25}

/* Toast e suggerimenti */
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);z-index:90;background:var(--text);color:#16130e;font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:absolute;inset:0;z-index:95;background:rgba(0,0,0,.55);display:grid;place-items:center}
#busy div{background:var(--panel);border:1px solid var(--gold);border-radius:18px;padding:18px 24px;font-weight:700;display:flex;gap:12px;align-items:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--panel-3);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{line-height:1.5;color:var(--muted);font-size:14px}
.hint b{color:var(--text)}
kbd{font-family:inherit;font-weight:800;color:var(--gold-hi)}

@media (max-width:760px){
  #topbar .hideSm{display:none}
  #titlePill .t b{font-size:15px}
  .goldBtn .lbl{display:none}
  .goldBtn{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

<script>
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
// Archivio locale (IndexedDB) con ripiego in memoria.
const DB = {
  db:null, mem:{scores:new Map(), kv:new Map()},
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{
        const r=indexedDB.open('fpm-leggio',1);
        r.onupgradeneeded=()=>{const d=r.result; if(!d.objectStoreNames.contains('scores'))d.createObjectStore('scores',{keyPath:'id'}); if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
        setTimeout(()=>rej(new Error('timeout')),4000);
      });
    }catch(e){ this.db=null; }
  },
  _req(store,mode,fn){
    if(!this.db) return Promise.resolve(undefined);
    return new Promise(res=>{
      try{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>res(undefined);t.onabort=()=>res(undefined);}catch(e){res(undefined)}
    });
  },
  async allScores(){ if(!this.db) return [...this.mem.scores.values()]; return (await this._req('scores','readonly',s=>s.getAll()))||[]; },
  async putScore(o){ this.mem.scores.set(o.id,o); return this._req('scores','readwrite',s=>s.put(o)); },
  async delScore(id){ this.mem.scores.delete(id); return this._req('scores','readwrite',s=>s.delete(id)); },
  async get(k){ if(!this.db) return this.mem.kv.get(k); return this._req('kv','readonly',s=>s.get(k)); },
  async set(k,v){ this.mem.kv.set(k,v); return this._req('kv','readwrite',s=>s.put(v,k)); },
  async del(k){ this.mem.kv.delete(k); return this._req('kv','readwrite',s=>s.delete(k)); },
};

// Disegno vettoriale dei segni (origine al centro, s = dimensione in px).
const VDRAW = {
  stacc:(c,s)=>{dot(c,0,0,s*.12)},
  staccis:(c,s)=>{c.beginPath();c.moveTo(-s*.12,-s*.3);c.lineTo(s*.12,-s*.3);c.lineTo(0,s*.3);c.closePath();c.fill()},
  tenuto:(c,s)=>{c.fillRect(-s*.38,-s*.05,s*.76,s*.1)},
  portato:(c,s)=>{c.fillRect(-s*.38,-s*.25,s*.76,s*.1);dot(c,0,s*.15,s*.11)},
  accent:(c,s)=>{ln(c,s*.09,[[-s*.4,-s*.22],[s*.4,0],[-s*.4,s*.22]])},
  accStacc:(c,s)=>{ln(c,s*.09,[[-s*.4,-s*.36],[s*.4,-s*.16],[-s*.4,s*.04]]);dot(c,0,s*.3,s*.11)},
  marcato:(c,s)=>{c.beginPath();c.moveTo(-s*.26,s*.32);c.lineTo(0,-s*.34);c.lineTo(s*.26,s*.32);c.lineTo(s*.12,s*.32);c.lineTo(0,-s*.04);c.lineTo(-s*.12,s*.32);c.closePath();c.fill()},
  marcStacc:(c,s)=>{c.save();c.translate(0,-s*.12);VDRAW.marcato(c,s*.8);c.restore();dot(c,0,s*.36,s*.1)},
  marcDown:(c,s)=>{c.save();c.rotate(Math.PI);VDRAW.marcato(c,s);c.restore()},
  tenAcc:(c,s)=>{c.fillRect(-s*.36,s*.22,s*.72,s*.09);ln(c,s*.08,[[-s*.36,-s*.36],[s*.36,-s*.18],[-s*.36,0]])},
  fermSq:(c,s)=>{ln(c,s*.08,[[-s*.45,s*.2],[-s*.45,-s*.25],[s*.45,-s*.25],[s*.45,s*.2]]);dot(c,0,s*.1,s*.1)},
  fermTri:(c,s)=>{ln(c,s*.08,[[-s*.45,s*.2],[0,-s*.3],[s*.45,s*.2]]);dot(c,0,s*.12,s*.1)},
  breathV:(c,s)=>{ln(c,s*.1,[[-s*.22,-s*.3],[0,s*.3],[s*.22,-s*.3]])},
  upBow:(c,s)=>{ln(c,s*.08,[[-s*.25,-s*.35],[0,s*.35],[s*.25,-s*.35]])},
  downBow:(c,s)=>{c.fillRect(-s*.32,-s*.3,s*.64,s*.13);c.fillRect(-s*.32,-s*.3,s*.08,s*.62);c.fillRect(s*.24,-s*.3,s*.08,s*.62)},
  harmonic:(c,s)=>{ring(c,0,0,s*.18,s*.07)},
  snapPizz:(c,s)=>{ring(c,0,s*.08,s*.2,s*.07);ln(c,s*.07,[[0,-s*.38],[0,s*.08]])},
  open:(c,s)=>{ring(c,0,0,s*.2,s*.08)},
  thumb:(c,s)=>{ring(c,0,-s*.08,s*.18,s*.07);ln(c,s*.07,[[0,s*.1],[0,s*.38]])},
  doit:(c,s)=>{curve(c,s*.07,[-s*.35,s*.2],[s*.1,s*.2],[s*.35,-s*.3])},
  fall:(c,s)=>{curve(c,s*.07,[-s*.35,-s*.2],[s*.1,-s*.2],[s*.35,s*.3])},
  scoop:(c,s)=>{curve(c,s*.07,[-s*.35,s*.3],[-s*.2,-s*.1],[s*.35,-s*.15])},
  vibrato:(c,s)=>{wave(c,s,3,s*.09)},
  trillLine:(c,s)=>{c.font=`700 italic ${s*.55}px ${css('--f-display')}`;c.textAlign='left';c.textBaseline='middle';c.fillText('tr',-s*.5,0);c.save();c.translate(s*.2,0);wave(c,s*.6,3,s*.07);c.restore()},
  mordent:(c,s)=>{zig(c,s);ln(c,s*.06,[[0,-s*.38],[0,s*.38]])},
  prall:(c,s)=>{zig(c,s)},
  trem1:(c,s)=>{slash(c,s,1)}, trem2:(c,s)=>{slash(c,s,2)}, trem3:(c,s)=>{slash(c,s,3)},
  multiRest:(c,s)=>{c.fillRect(-s*.45,-s*.12,s*.9,s*.24);c.fillRect(-s*.47,-s*.3,s*.06,s*.6);c.fillRect(s*.41,-s*.3,s*.06,s*.6)},
  hairCresc:(c,s)=>{ln(c,s*.06,[[s*.48,-s*.2],[-s*.48,0],[s*.48,s*.2]])},
  hairDim:(c,s)=>{ln(c,s*.06,[[-s*.48,-s*.2],[s*.48,0],[-s*.48,s*.2]])},
  volta1:(c,s)=>{volta(c,s,'1.')}, volta2:(c,s)=>{volta(c,s,'2.')},
  pedLine:(c,s)=>{ln(c,s*.06,[[-s*.48,-s*.25],[-s*.48,s*.2],[-s*.05,s*.2],[s*.1,-s*.05],[s*.25,s*.2],[s*.48,s*.2],[s*.48,-s*.25]])},

};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v)}
function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function ring(c,x,y,r,w){c.lineWidth=w;c.beginPath();c.arc(x,y,r,0,7);c.stroke()}
function ln(c,w,pts){c.lineWidth=w;c.lineJoin='miter';c.lineCap='butt';c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke()}
function curve(c,w,a,b,d){c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(a[0],a[1]);c.quadraticCurveTo(b[0],b[1],d[0],d[1]);c.stroke()}
function wave(c,s,n,w){c.lineWidth=w;c.lineCap='round';c.beginPath();const L=s*.9,x0=-L/2,step=L/(n*2);c.moveTo(x0,0);for(let i=0;i<n*2;i++){const x=x0+step*i;c.quadraticCurveTo(x+step/2,(i%2?1:-1)*s*.14,x+step,0)}c.stroke()}
function zig(c,s){c.lineWidth=s*.08;c.lineJoin='round';c.beginPath();c.moveTo(-s*.45,s*.08);c.lineTo(-s*.28,-s*.14);c.lineTo(-s*.1,s*.1);c.lineTo(s*.1,-s*.14);c.lineTo(s*.28,s*.1);c.lineTo(s*.45,-s*.12);c.stroke()}
function slash(c,s,n){for(let i=0;i<n;i++){const y=(i-(n-1)/2)*s*.22;c.beginPath();c.moveTo(-s*.3,y+s*.1);c.lineTo(s*.3,y-s*.06);c.lineTo(s*.3,y-s*.16);c.lineTo(-s*.3,y);c.closePath();c.fill()}}
function volta(c,s,t){ln(c,s*.05,[[-s*.45,s*.3],[-s*.45,-s*.25],[s*.48,-s*.25]]);c.font=`700 ${s*.36}px ${css('--f-body')}`;c.textAlign='left';c.textBaseline='middle';c.fillText(t,-s*.36,s*.05)}
function timeSig(c,s,a,b){c.font=`900 ${s*.5}px ${css('--f-display')}`;c.textAlign='center';c.textBaseline='middle';c.fillText(a,0,-s*.21);c.fillText(b,0,s*.23)}

// Disegna un segno centrato in (x,y) con dimensione s.
function drawGlyph(c,g,x,y,s,color){
  c.save();c.translate(x,y);c.fillStyle=color;c.strokeStyle=color;
  if(g.v){
    if(g.v.startsWith('ts:')){const [a,b]=g.v.slice(3).split('/');timeSig(c,s,a,b);}
    else if(VDRAW[g.v]) VDRAW[g.v](c,s);
  } else {
    const fam = g.f==='m'?css('--f-music'):g.f==='i'?css('--f-display'):g.f==='e'?'"Apple Color Emoji","Noto Color Emoji",sans-serif':css('--f-body');
    const style = g.f==='i'?'italic 600':g.f==='b'?'800':'400';
    const sz = g.f==='m'? s : g.f==='i'? s*.42 : s*.5;
    c.font=`${style} ${sz}px ${fam}`;c.textAlign='left';c.textBaseline='alphabetic';
    const mt=c.measureText(g.c);
    const w=(mt.actualBoundingBoxLeft||0)+(mt.actualBoundingBoxRight||mt.width);
    const h=(mt.actualBoundingBoxAscent||sz*.7)+(mt.actualBoundingBoxDescent||0);
    c.fillText(g.c,-(mt.actualBoundingBoxRight||mt.width)+w/2,(mt.actualBoundingBoxAscent||sz*.7)-h/2);
  }
  c.restore();
}
// Misura l'ingombro (per adattare l'anteprima nei riquadri).
function glyphBox(c,g,s){
  if(g.v) return {w:s,h:s};
  const fam = g.f==='m'?css('--f-music'):g.f==='i'?css('--f-display'):css('--f-body');
  const sz = g.f==='m'? s : g.f==='i'? s*.42 : s*.5;
  c.font=`${g.f==='i'?'italic 600':g.f==='b'?'800':'400'} ${sz}px ${fam}`;
  const mt=c.measureText(g.c);
  return {w:(mt.actualBoundingBoxLeft||0)+(mt.actualBoundingBoxRight||mt.width), h:(mt.actualBoundingBoxAscent||sz*.7)+(mt.actualBoundingBoxDescent||0)};
}

function busy(msg){let b=$('#busy');if(!msg){b&&b.remove();return}if(!b){b=document.createElement('div');b.id='busy';$('#app').appendChild(b)}b.innerHTML=`<div><span class="spin"></span>${esc(msg)}</div>`}

// ---------- Libreria: caricamento e salvataggio ----------
async function loadAll(){
  await DB.open();
  ST.scores = await DB.allScores();
  ST.setlists = (await DB.get('setlists'))||[];
  Object.assign(ST.settings, (await DB.get('settings'))||{});

}
const saveSettings=()=>DB.set('settings',ST.settings);
const saveSetlists=()=>DB.set('setlists',ST.setlists);
const saveAnn=debounce(()=>{ if(ST.cur) DB.set('ann:'+ST.cur.id, ST.ann); },400);

async function addScore(bytes, meta={}){
  const doc = await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
  const sc = {id:uid(), title:meta.title||'Senza titolo', composer:meta.composer||'', genre:meta.genre||'', tags:meta.tags||[], key:meta.key||'',
    added:Date.now(), opened:0, pages:doc.numPages, bookmarks:[], crop:{l:0,t:0,r:0,b:0}, bytes};
  doc.destroy();
  ST.scores.push(sc); await DB.putScore(sc); return sc;
}
async function replaceBytes(sc, bytes, annMap){
  sc.bytes=bytes; thumbCache.delete(sc.id);
  const doc = await pdfjsLib.getDocument({data:bytes.slice(0)}).promise; sc.pages=doc.numPages;
  await DB.putScore(sc);
  if(ST.cur && ST.cur.id===sc.id){ if(ST.doc) ST.doc.destroy(); ST.doc=doc; if(annMap){ST.ann=annMap; DB.set('ann:'+sc.id,annMap);} ST.page=clamp(ST.page,0,sc.pages-1); await renderPage(); updateChrome(); }
  else { doc.destroy(); if(annMap) DB.set('ann:'+sc.id,annMap); }
}

// ---------- Apertura e rendering ----------
async function openScore(id, page=0, opts={}){
  const sc = ST.scores.find(s=>s.id===id); if(!sc) return;
  if(ST.annotate) Anno.exit(true);
  if(ST.doc){ try{ST.doc.destroy()}catch(e){} }
  ST.cur=sc; sc.opened=Date.now(); DB.putScore(sc);
  ST.doc = await pdfjsLib.getDocument({data:sc.bytes.slice(0)}).promise;
  sc.pages=ST.doc.numPages;
  ST.ann = (await DB.get('ann:'+id))||{};
  ST.page = clamp(page,0,sc.pages-1);
  if(!opts.keepSetlist) ST.activeSetlist=null;
  $('#loading').hidden=true; pageWrap.hidden=false;
  await renderPage(); updateChrome(); renderLibrary();
  try{localStorage.setItem('fpm-last',JSON.stringify({id,page:ST.page}))}catch(e){}
}

async function renderPage(dir){
  if(!ST.doc) return;
  const seq=++renderSeq;
  if(dir && ST.settings.turnAnim){pageWrap.classList.add(dir>0?'turn-next':'turn-prev');}
  const pg = await ST.doc.getPage(ST.page+1);
  if(seq!==renderSeq) return;
  const crop = ST.cur.crop||{l:0,t:0,r:0,b:0};
  const vp1 = pg.getViewport({scale:1});
  const W=stage.clientWidth, H=stage.clientHeight;
  const padX = 8, padY = 8;
  const cw = vp1.width*(1-crop.l-crop.r), ch = vp1.height*(1-crop.t-crop.b);
  const scale = Math.min((W-padX*2)/cw, (H-padY*2)/ch);
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  const vp = pg.getViewport({scale:scale*dpr});
  const off = document.createElement('canvas'); off.width=Math.round(vp.width); off.height=Math.round(vp.height);
  const octx = off.getContext('2d'); octx.fillStyle='#fff'; octx.fillRect(0,0,off.width,off.height);
  if(renderTask){try{renderTask.cancel()}catch(e){}}
  renderTask = pg.render({canvasContext:octx, viewport:vp});
  try{ await renderTask.promise; }catch(e){ return; }
  if(seq!==renderSeq) return;
  const cssW = vp.width/dpr, cssH = vp.height/dpr;
  pageGeom={w:off.width,h:off.height,cssW,cssH,dpr,offX:-crop.l*cssW,offY:-crop.t*cssH};
  pageCanvas.width=off.width; pageCanvas.height=off.height;
  pageCanvas.getContext('2d').drawImage(off,0,0);
  for(const c of [pageCanvas,inkCanvas]){ c.style.width=cssW+'px'; c.style.height=cssH+'px'; c.style.left=pageGeom.offX+'px'; c.style.top=pageGeom.offY+'px'; }
  inkCanvas.width=off.width; inkCanvas.height=off.height;
  pageWrap.style.width=(cw*scale)+'px'; pageWrap.style.height=(ch*scale)+'px';
  Anno.redraw();
  pageWrap.classList.remove('turn-next','turn-prev');
  $('#ribbon').hidden = !(ST.cur.bookmarks||[]).some(b=>b.p===ST.page);
  updateChrome();
}

function goPage(p, animate=true){
  if(!ST.cur) return;
  const n=ST.cur.pages;
  if(p>=n){ if(ST.activeSetlist){ setlistStep(1); } else toast('Ultima pagina'); return; }
  if(p<0){ if(ST.activeSetlist){ setlistStep(-1, true); } else toast('Prima pagina'); return; }
  const dir = p>ST.page?1:-1; ST.page=p;
  if(ST.annotate) Anno.pageChanged();
  renderPage(animate?dir:0);
  try{localStorage.setItem('fpm-last',JSON.stringify({id:ST.cur.id,page:p}))}catch(e){}
}
const nextPage=()=>goPage(ST.page+1), prevPage=()=>goPage(ST.page-1);

function updateChrome(){
  const sc=ST.cur;
  $('#titleText').innerHTML = sc? `<b>${esc(sc.title)}</b><span>, p. ${ST.page+1} di ${sc.pages}</span>` : '<b>Mozart</b>';
  $('#pageNum').textContent = sc? `${ST.page+1} / ${sc.pages}` : '–';
  $('#annoTitle').innerHTML = `Pagina ${ST.page+1} <span>(${esc(Anno.layers[Anno.layer]?.name||'Livello 1')})</span>`;
  buildScrub();
  $('#setlistNav').classList.toggle('on', !!ST.activeSetlist);
}

// ---------- Scrubber pagine ----------
function buildScrub(){
  const sc=ST.cur; const dots=$('#scrubDots'); if(!sc){dots.innerHTML='';return}
  const n=sc.pages, show=Math.min(n,48); const bm=new Set((sc.bookmarks||[]).map(b=>b.p));
  let h=''; for(let i=0;i<show;i++){const p=Math.round(i*(n-1)/Math.max(1,show-1)); h+=`<i class="${bm.has(p)?'bm':''}"></i>`;}
  dots.innerHTML=h;
  placeKnob(n>1? ST.page/(n-1) : 0);
}
function placeKnob(f){const tr=$('#scrubTrack');const w=tr.clientWidth-16;$('#scrubKnob').style.left=(8+f*w)+'px';$('#scrubBubble').style.left=(8+f*w)+'px'}
(function initScrub(){
  const tr=$('#scrubTrack'); let drag=false, target=0;
  const at=e=>{const r=tr.getBoundingClientRect();return clamp((e.clientX-r.left-8)/(r.width-16),0,1)};
  tr.addEventListener('pointerdown',e=>{if(!ST.cur)return;drag=true;tr.setPointerCapture(e.pointerId);tr.classList.add('drag');move(e)});
  const move=e=>{if(!drag)return;const f=at(e);const n=ST.cur.pages;target=Math.round(f*(n-1));placeKnob(n>1?target/(n-1):0);const bm=(ST.cur.bookmarks||[]).find(b=>b.p===target);$('#scrubBubble').textContent=`p. ${target+1}${bm?' · '+bm.name:''}`};
  tr.addEventListener('pointermove',move);
  tr.addEventListener('pointerup',()=>{if(!drag)return;drag=false;tr.classList.remove('drag');if(target!==ST.page)goPage(target)});
  tr.addEventListener('pointercancel',()=>{drag=false;tr.classList.remove('drag')});

// ---------- Barre e bordi (pressione lunga) ----------
function setBars(top,bottom){ST.bars.top=top;ST.bars.bottom=bottom;$('#topbar').classList.toggle('hide',!top||ST.annotate);$('#bottombar').classList.toggle('hide',!bottom||ST.annotate)}
function openSide(which,open=true){
  const el=$('#'+which); el.classList.toggle('open',open);
  if(open){ const other=which==='library'?'tools':'library'; $('#'+other).classList.remove('open'); if(which==='library') renderLibrary(); }
}
const closeSides=()=>{openSide('library',false);openSide('tools',false)};
const anySideOpen=()=>$('#library').classList.contains('open')||$('#tools').classList.contains('open');

(function initStageGestures(){
  const EDGE=44; let st=null, timer=null;
  const glow=e=>$('.edgeGlow.'+e);
  const clearGlow=()=>{$$('.edgeGlow').forEach(g=>g.classList.remove('charging'))};
  const edgeOf=(x,y)=>{const W=innerWidth,H=innerHeight;
    if(y<EDGE+ (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0)) return 'top';
    if(y>H-EDGE) return 'bottom'; if(x<EDGE) return 'left'; if(x>W-EDGE) return 'right'; return null};
  function reveal(edge){
    if(navigator.vibrate) try{navigator.vibrate(12)}catch(e){}
    if(edge==='top') setBars(true,ST.bars.bottom);
    else if(edge==='bottom') setBars(ST.bars.top,true);
    else if(edge==='left') openSide('library');
    else if(edge==='right') openSide('tools');
  }
  stage.addEventListener('pointerdown',e=>{
    if(ST.annotate && e.target===inkCanvas) return;
    const edge=edgeOf(e.clientX,e.clientY);
    st={x:e.clientX,y:e.clientY,t:Date.now(),edge,done:false};
    if(edge){ const g=glow(edge); g.style.setProperty('--lp',ST.settings.longPress+'ms'); requestAnimationFrame(()=>g.classList.add('charging'));
      timer=setTimeout(()=>{st.done=true;clearGlow();reveal(edge)},ST.settings.longPress); }
  });
  stage.addEventListener('pointermove',e=>{if(!st)return;if(Math.hypot(e.clientX-st.x,e.clientY-st.y)>14){clearTimeout(timer);clearGlow()}});
  const end=e=>{
    clearTimeout(timer);clearGlow(); if(!st) return; const s=st; st=null; if(s.done) return;
    if(ST.annotate) return;
    const dx=e.clientX-s.x, dy=e.clientY-s.y;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.3){ dx<0?nextPage():prevPage(); return; }
    if(Math.hypot(dx,dy)>14) return;
    if(anySideOpen()){ closeSides(); return; }
    if(Date.now()-s.t>ST.settings.longPress) return;
    const W=innerWidth, x=e.clientX;
    if(ST.settings.tapZones && x<W*.3) prevPage();
    else if(ST.settings.tapZones && x>W*.7) nextPage();
    else setBars(!(ST.bars.top&&ST.bars.bottom), !(ST.bars.top&&ST.bars.bottom));
  };
  stage.addEventListener('pointerup',end);
  stage.addEventListener('pointercancel',()=>{clearTimeout(timer);clearGlow();st=null});
  // Anche sopra le barre: tenere premuto sul bordo apre il pannello corrispondente
  addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea,select')) return;
    if(['ArrowRight','PageDown',' ','ArrowDown'].includes(e.key)){e.preventDefault();nextPage()}
    else if(['ArrowLeft','PageUp','ArrowUp'].includes(e.key)){e.preventDefault();prevPage()}
    else if(e.key==='Escape'){closeLayers();closeSides()}
  });
  addEventListener('resize',debounce(()=>{renderPage()},150));
})();

// ---------- Popover e modali ----------
const layerRoot=$('#layerRoot');
function closeLayers(){layerRoot.innerHTML='';Metro.onClose&&Metro.onClose();}
function popover(anchor, html, opts={}){
  closeLayers();
  const scrim=document.createElement('div');scrim.className='scrim clear';scrim.onpointerdown=()=>closeLayers();
  const p=document.createElement('div');p.className='pop';p.id=opts.id||'';p.innerHTML=html;
  layerRoot.append(scrim,p); hydrateIcons(p);
  const r=anchor? anchor.getBoundingClientRect() : {left:innerWidth/2,right:innerWidth/2,bottom:80,top:80,width:0};
  const pw=p.offsetWidth, W=innerWidth;
  let left=clamp(r.left+r.width/2-pw/2, 10, W-pw-10);
  let top=r.bottom+10; if(opts.above) top=Math.max(10,r.top-p.offsetHeight-10);
  if(top+p.offsetHeight>innerHeight-10) top=Math.max(10,innerHeight-p.offsetHeight-10);
  p.style.left=left+'px'; p.style.top=top+'px';
  return p;
}
function modal(title, body, foot, opts={}){
  closeLayers();
  const scrim=document.createElement('div');scrim.className='scrim';if(!opts.sticky)scrim.onpointerdown=()=>closeLayers();

  layerRoot.append(scrim,m2); hydrateIcons(m2);
  m2.querySelector('[data-close]').onclick=()=>{opts.onClose&&opts.onClose();closeLayers()};
  return m2;
}

const byTitle=(a,b)=>a.title.localeCompare(b.title,'it',{sensitivity:'base'});
function matches(sc){const q=ST.libQuery;if(!q)return true;return (sc.title+' '+sc.composer+' '+sc.genre+' '+(sc.tags||[]).join(' ')).toLowerCase().includes(q)}
function scoreRow(sc){

function groupRows(title,rows){return `<div class="group"><div class="groupHead">${esc(title)}</div>${rows}</div>`}
function drillRow(key,label,count){return `<div class="item" data-drill="${esc(key)}"><div class="tx"><div class="tt">${esc(label)}</div><div class="st">${count} ${count===1?'elemento':'elementi'}</div></div><span class="chev">${iconSvg('chevRight')}</span></div>`}
function renderLibrary(){
  const body=$('#libBody'), idx=$('#letterIdx'); idx.innerHTML='';

    const groups={}; list.sort(byTitle).forEach(s=>{const L=(s.title[0]||'#').toUpperCase().normalize('NFD')[0];const k=/[A-Z]/.test(L)?L:'#';(groups[k]=groups[k]||[]).push(s)});
    const keys=Object.keys(groups).sort();

    idx.innerHTML=keys.map(k=>`<button data-jump="${k}">${k}</button>`).join('');
  } else if(ST.libTab==='recent'){
    const op=[...list].filter(s=>s.opened).sort((a,b)=>b.opened-a.opened).slice(0,12);
    const ad=[...list].sort((a,b)=>b.added-a.added).slice(0,12);
    h=groupRows('Aperti di recente',op.map(scoreRow).join('')||'<div class="empty">Nessuno spartito aperto.</div>')+groupRows('Aggiunti di recente',ad.map(scoreRow).join(''));
  } else if(['composers','genres','tags'].includes(ST.libTab)){

    const map=new Map(); list.forEach(s=>{const vals=field==='tags'?(s.tags||[]):[s[field]||'(senza '+(field==='composer'?'compositore':'genere')+')'];vals.forEach(v=>{if(!map.has(v))map.set(v,[]);map.get(v).push(s)})});
    if(ST.libDrill!=null && map.has(ST.libDrill)){ title=ST.libDrill; h=back(TAB_TITLES[ST.libTab])+map.get(ST.libDrill).sort(byTitle).map(scoreRow).join(''); }
    else { const keys=[...map.keys()].sort((a,b)=>a.localeCompare(b,'it')); h=keys.map(k=>drillRow(k,k,map.get(k).length)).join('')||'<div class="empty">Ancora niente qui. Aggiungi '+(field==='tags'?'etichette':field==='genre'?'un genere':'un compositore')+' dalle informazioni dello spartito (ⓘ).</div>'; }

      <div style="display:flex;gap:8px;margin-top:14px"><button class="ghostBtn" data-slplay="${sl.id}">${iconSvg('play')}Suona dall'inizio</button><button class="ghostBtn danger" data-sldel="${sl.id}">${iconSvg('trash')}Elimina</button></div>`; }
    else h=ST.setlists.map(s=>drillRow(s.id,s.name,s.items.length)).join('')+`<div style="margin-top:14px"><button class="ghostBtn" data-slnew>${iconSvg('plus')}Nuova setlist</button></div>`;
  }

async function drawThumb(id, el){
  const sc=ST.scores.find(s=>s.id===id); if(!sc) return;
  let url=thumbCache.get(id);
  if(!url){
    try{
      const doc=await pdfjsLib.getDocument({data:sc.bytes.slice(0)}).promise; const pg=await doc.getPage(1);
      const vp=pg.getViewport({scale:1}); const s=120/vp.height; const v2=pg.getViewport({scale:s});
      const c=document.createElement('canvas');c.width=v2.width;c.height=v2.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:x,viewport:v2}).promise; url=c.toDataURL('image/jpeg',.7); thumbCache.set(id,url); doc.destroy();
    }catch(e){return}
  }
  el.innerHTML=`<img src="${url}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`;

async function setlistStep(d,toEnd){
  const a=ST.activeSetlist; if(!a) return; const sl=ST.setlists.find(x=>x.id===a.id); if(!sl) return;

  ST.activeSetlist={id:sl.id,i}; updateChrome(); toast(`${i+1}/${sl.items.length} · ${ST.cur.title}`);
}

function showCrop(){
  if(!ST.cur) return; const c=ST.cur.crop=ST.cur.crop||{l:0,t:0,r:0,b:0};
  const sl=(k,l)=>`<div class="sl"><span>${l}<em id="cv-${k}">${Math.round(c[k]*100)}%</em></span><input type="range" id="cr-${k}" min="0" max="25" value="${Math.round(c[k]*100)}" style="--v:${c[k]*400}%"></div>`;
  const m2=modal('Ritaglia margini',`<div class="hint">Togli i bordi bianchi della scansione: la musica si ingrandisce sullo schermo. Vale per tutte le pagine di questo spartito.</div><div class="sliders">${sl('t','Sopra')}${sl('b','Sotto')}${sl('l','Sinistra')}${sl('r','Destra')}</div>`,
    `<button class="ghostBtn" data-reset>Azzera</button><button class="goldBtn" data-ok>${iconSvg('check')}Fatto</button>`);
  const upd=debounce(()=>{DB.putScore(ST.cur);renderPage()},120);
  ['t','b','l','r'].forEach(k=>{const i=$('#cr-'+k);i.oninput=()=>{c[k]=i.value/100;i.style.setProperty('--v',(i.value/25*100)+'%');$('#cv-'+k).textContent=i.value+'%';upd()}});
  m2.querySelector('[data-reset]').onclick=()=>{Object.assign(c,{l:0,t:0,r:0,b:0});closeLayers();DB.putScore(ST.cur);renderPage()};
  m2.querySelector('[data-ok]').onclick=closeLayers;
  m2.style.top='auto';m2.style.bottom='20px';m2.style.transform='translateX(-50%)';$('.scrim',layerRoot).style.background='transparent';
}

function showBackup(){
  const m2=modal('Backup',`<div class="hint">Salva tutta la libreria (spartiti, annotazioni, setlist, segnalibri) in un unico file, oppure ripristinala da un backup.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="goldBtn" id="bkSave">${iconSvg('backup')}Crea backup</button><button class="ghostBtn" id="bkLoad">${iconSvg('up')}Ripristina</button></div><div id="bkOut"></div>`);
  $('#bkSave').onclick=async()=>{busy('Preparo il backup…');const data={v:1,setlists:ST.setlists,scores:[]};
    for(const s of ST.scores){const {bytes,...meta}=s;let b64='';const u8=new Uint8Array(bytes);for(let i=0;i<u8.length;i+=32768)b64+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));data.scores.push({...meta,pdf:btoa(b64),ann:await DB.get('ann:'+s.id)})}
    busy();offerDownload(new Blob([JSON.stringify(data)],{type:'application/json'}),`Mozart-backup-${new Date().toISOString().slice(0,10)}.json`,$('#bkOut'))};
  $('#bkLoad').onclick=()=>{const f=$('#fileBackup');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;busy('Ripristino…');try{const data=JSON.parse(await file.text());for(const s of data.scores){const bin=atob(s.pdf);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const {pdf,ann,...meta}=s;const sc={...meta,bytes:u8.buffer};if(!ST.scores.some(x=>x.id===sc.id)){ST.scores.push(sc);await DB.putScore(sc);if(ann)await DB.set('ann:'+sc.id,ann)}}
      for(const sl of data.setlists||[]) if(!ST.setlists.some(x=>x.id===sl.id)) ST.setlists.push(sl); saveSetlists(); busy(); closeLayers(); renderLibrary(); toast('Backup ripristinato')}catch(e){busy();toast('File di backup non valido')}};f.click()};
}
function offerDownload(blob,name,where){
  const url=URL.createObjectURL(blob);
  if(navigator.canShare && navigator.share){ try{const file=new File([blob],name,{type:blob.type}); if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});}}catch(e){} }
  const a=document.createElement('a');a.href=url;a.download=name;a.className='goldBtn';a.style.textDecoration='none';a.innerHTML=iconSvg('share')+'Salva “'+esc(name)+'”';
  if(where){where.innerHTML='';where.appendChild(a);where.insertAdjacentHTML('beforeend','<div class="hint" style="margin-top:8px">Se il salvataggio non parte, apri Mozart da Safari o dalla Home dell\'iPad.</div>')}
  else { const m2=modal('File pronto',`<div id="dlBox"></div>`); $('#dlBox').appendChild(a); }
}

// ---------- Unisci spartiti ed esporta ----------
async function mergeSelected(){
  busy('Unisco gli spartiti…');
  try{
    const ids=[...ST.selected]; const scs=ids.map(id=>ST.scores.find(s=>s.id===id));
    const out=await PDFLib.PDFDocument.create(); const ann={}; let off=0;
    for(const s of scs){const src=await PDFLib.PDFDocument.load(s.bytes,{ignoreEncryption:true});const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p));
      const a=(await DB.get('ann:'+s.id))||{};for(const k in a)ann[+k+off]=a[k];off+=pages.length}
    const bytes=(await out.save()).buffer;
    const sc=await addScore(bytes,{title:scs.map(s=>s.title).join(' + '),composer:scs[0].composer,genre:scs[0].genre});
    await DB.set('ann:'+sc.id,ann);
    ST.libSelect=false;ST.selected.clear();busy();renderLibrary();openScore(sc.id);toast('Spartiti uniti in uno nuovo');
  }catch(e){busy();toast('Non riesco a unire questi PDF')}
}
async function exportPdf(){
  if(!ST.cur) return; busy('Preparo il PDF con le annotazioni…');
  try{
    const doc=await PDFLib.PDFDocument.load(ST.cur.bytes,{ignoreEncryption:true}); const pages=doc.getPages();
    for(let i=0;i<pages.length;i++){
      const strokes=ST.ann[i]; if(!strokes||!strokes.length) continue;
      const pg=pages[i]; const {width,height}=pg.getSize(); const sc=3;
      const c=document.createElement('canvas');c.width=Math.round(width*sc);c.height=Math.round(height*sc);
      Anno.paint(c.getContext('2d'),strokes,c.width,c.height,true);
      const png=await doc.embedPng(await (await new Promise(r=>c.toBlob(r,'image/png'))).arrayBuffer());
      pg.drawImage(png,{x:0,y:0,width,height});
    }
    const bytes=await doc.save(); busy();
    offerDownload(new Blob([bytes],{type:'application/pdf'}),(ST.cur.title||'spartito')+' (annotato).pdf');
  }catch(e){busy();toast('Esportazione non riuscita')}
}

// ---------- Libreria di esempio ----------
async function makeDemoLibrary(){
  const demos=[
    {title:'Esempio · Finaletto per coro',composer:'Esempi FPM',genre:'Opera',tags:['esempio','coro'],pages:4,key:'Sol maggiore',ks:1},
    {title:'Esempio · Corale a quattro voci',composer:'Esempi FPM',genre:'Sacra',tags:['esempio','coro'],pages:2,key:'Fa maggiore',ks:-1},
    {title:'Esempio · Vocalizzi del coro',composer:'Esempi FPM',genre:'Esercizi',tags:['esempio','riscaldamento'],pages:2,key:'Do maggiore',ks:0},
  ];
  for(const d of demos){
    const bytes=await demoPdf(d);
    const sc=await addScore(bytes,d); sc.added=Date.now()-Math.random()*1e8; if(d.pages===4){sc.bookmarks=[{p:2,name:'n. 171 · Di sì felice'}]} DB.putScore(sc);
  }
  const fin=ST.scores.find(s=>s.pages===4);
  ST.setlists=[{id:uid(),name:'Esempio · Concerto di novembre',items:ST.scores.map(s=>s.id)}]; saveSetlists();
  // Qualche segno già messo, per mostrare le annotazioni
  if(fin) await DB.set('ann:'+fin.id,{0:[
    {t:'stamp',g:{c:U(0x1D110),f:'m'},x:.34,y:.25,size:.05,color:'#d23b2f',layer:0},
    {t:'pen',color:'#1f5fd6',w:.0035,alpha:1,pts:[[.12,.395],[.2,.392],[.3,.394],[.42,.391]],layer:0},
    {t:'stamp',g:{c:P+P,f:'m'},x:.13,y:.44,size:.045,color:'#d23b2f',layer:0},
    {t:'hl',color:'#f4e04d',w:.022,alpha:.42,pts:[[.12,.52],[.5,.52],[.88,.521]],layer:0},
    {t:'stamp',g:{v:'breathV'},x:.6,y:.47,size:.035,color:'#d23b2f',layer:0},
  ]});
}
async function demoPdf(d){
  const {PDFDocument,StandardFonts,rgb}=PDFLib; const doc=await PDFDocument.create();
  const fB=await doc.embedFont(StandardFonts.TimesRomanBold), fI=await doc.embedFont(StandardFonts.TimesRomanItalic), fR=await doc.embedFont(StandardFonts.TimesRoman);
  let seed=d.title.length*977; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const black=rgb(.08,.08,.08);
  for(let p=0;p<d.pages;p++){
    const pg=doc.addPage([595,842]); const W=595,H=842;
    if(p===0){ pg.drawText(d.title.replace('Esempio · ',''),{x:W/2-fB.widthOfTextAtSize(d.title.replace('Esempio · ',''),22)/2,y:H-70,size:22,font:fB,color:black});
      pg.drawText('Spartito di esempio generato da Mozart',{x:W/2-fI.widthOfTextAtSize('Spartito di esempio generato da Mozart',11)/2,y:H-90,size:11,font:fI,color:rgb(.35,.35,.35)});
      pg.drawText('Allegro',{x:60,y:H-125,size:13,font:fB,color:black}); }
    pg.drawText(String(440+p),{x:p%2?W-60:40,y:H-40,size:11,font:fB,color:black});
    const systems=p===0?5:6; const top=p===0?H-160:H-80;
    for(let sy=0;sy<systems;sy++){
      const y0=top-sy*120; const left=60,right=W-40;
      for(let st=0;st<2;st++){
        const yb=y0-st*44;
        for(let l=0;l<5;l++) pg.drawLine({start:{x:left,y:yb-l*7},end:{x:right,y:yb-l*7},thickness:.7,color:black});
        // chiave stilizzata e armatura
        if(st===0){pg.drawEllipse({x:left+12,y:yb-21,xScale:5,yScale:7,borderColor:black,borderWidth:1.4});pg.drawLine({start:{x:left+14,y:yb+8},end:{x:left+10,y:yb-34},thickness:1.4,color:black})}
        else {pg.drawEllipse({x:left+12,y:yb-8,xScale:5,yScale:5,color:black});pg.drawCircle({x:left+22,y:yb-4,size:1.3,color:black});pg.drawCircle({x:left+22,y:yb-11,size:1.3,color:black})}
        const bars=4, bw=(right-left-40)/bars;
        for(let b=0;b<=bars;b++) pg.drawLine({start:{x:left+40+b*bw,y:yb},end:{x:left+40+b*bw,y:yb-28},thickness:b===bars&&sy===systems-1&&p===d.pages-1?3:.9,color:black});
        for(let b=0;b<bars;b++){ const n=3+Math.floor(rnd()*3);
          for(let k=0;k<n;k++){ const x=left+48+b*bw+k*(bw-14)/n; const step=Math.floor(rnd()*9)-1; const y=yb-28+step*3.5;
            const filled=rnd()>.25; pg.drawEllipse({x,y,xScale:4.2,yScale:3,rotate:PDFLib.degrees(-20),color:filled?black:undefined,borderColor:black,borderWidth:filled?0:1.1});
            const up=step<4; pg.drawLine({start:{x:up?x+3.8:x-3.8,y},end:{x:up?x+3.8:x-3.8,y:up?y+22:y-22},thickness:.9,color:black});
            if(rnd()>.85) pg.drawCircle({x:x,y:up?y-7:y+7,size:1.1,color:black});
          } }
      }
      if(p<2){ const words=['Di','sì','fe','li','ce','in','ne','sto','ser','biam','me','mo','ria','e','ter','na'];
        let x=110; for(let w=0;w<9;w++){const t=words[(sy*9+w)%words.length]+(w<8?' -':'');pg.drawText(t,{x,y:y0-38,size:9.5,font:fR,color:black});x+=50} }
      if(sy===1&&p===0) pg.drawText('pp',{x:72,y:y0-34,size:12,font:fI,color:black});
    }
  }
  return (await doc.save()).buffer;
}

async function boot(){
  hydrateIcons();

  try{ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; }catch(e){}
  await loadAll();
  Anno.init(); Piano.build();
  let last=null; try{last=JSON.parse(localStorage.getItem('fpm-last')||'null')}catch(e){}
  const start = (last && ST.scores.find(s=>s.id===last.id)) ? last : {id:[...ST.scores].sort((a,b)=>b.pages-a.pages)[0]?.id, page:0};
  if(start.id) await openScore(start.id,start.page||0);
  renderLibrary();
  if(ST.settings.firstRun){ if(innerWidth>=900) openSide('library'); setTimeout(()=>toast('Suggerimento: tieni premuto sui bordi dello schermo per mostrare barre e pannelli',4200),900); ST.settings.firstRun=false; saveSettings(); }
}

const Anno = {

    {k:'hl',color:'#f4e04d',size:30,alpha:.42},{k:'pen',color:'#d23b2f',size:3,alpha:1},{k:'hl',color:'#f4e04d',size:70,alpha:.42},
    {k:'pen',color:'#7a4a2a',size:22,alpha:1},{k:'pen',color:'#d23b2f',size:14,alpha:1},{k:'pen',color:'#d23b2f',size:8,alpha:1},

  hist:{}, snapshot:null, live:null, selIdx:[], selBox:null, stampCat:0,

  init(){
    this.layers=this.layers; this.buildBar();

    c.addEventListener('pointerdown',e=>this.down(e));
    c.addEventListener('pointermove',e=>this.move(e));

  },
  W(p){return p.size*.00028+.0004},
  get strokes(){ return (ST.ann[ST.page]=ST.ann[ST.page]||[]); },
  set strokes(v){ ST.ann[ST.page]=v; },

  enter(){
    if(!ST.cur) return toast('Apri prima uno spartito');
    ST.annotate=true; this.snapshot=JSON.stringify(ST.ann); this.hist={};
    $('#annobar').classList.add('open'); setBars(ST.bars.top,ST.bars.bottom);
    inkCanvas.style.pointerEvents='auto'; stage.style.cursor='crosshair'; this.buildBar(); updateChrome();
  },
  exit(silent){
    ST.annotate=false; $('#annobar').classList.remove('open'); inkCanvas.style.pointerEvents='none'; stage.style.cursor='';
    this.clearSel(); $('#textEntry')?.remove(); closeLayers(); saveAnn(); setBars(true,true); this.redraw();
    if(!silent) toast('Annotazioni salvate');
  },
  cancel(){ if(this.snapshot){ST.ann=JSON.parse(this.snapshot);saveAnn();} this.exit(true); toast('Modifiche annullate'); },
  pageChanged(){ this.clearSel(); $('#textEntry')?.remove(); updateChrome(); },

  // ---- barra strumenti ----
  buildBar(){
    const bar=$('#annoTools'); if(!bar) return;
    let h=this.presets.map((p,i)=>`<button class="preset${this.mode==='preset'&&this.sel===i?' on':''}" data-p="${i}" aria-label="Strumento ${i+1}"><canvas width="88" height="88"></canvas></button>`).join('');
    const t=(id,icon,label,on,dis)=>`<button class="atool${on?' on':''}${dis?' dis':''}" data-t="${id}" aria-label="${label}" title="${label}">${iconSvg(icon)}</button>`;
    const hs=this.hist[ST.page]||{u:[],r:[]};
    h+=`<span class="sep"></span>`+t('stamps','clef','Segni musicali',false)+t('ruler','ruler','Righello: linee dritte',this.ruler)+t('lasso','lasso','Lazo: seleziona e sposta',this.mode==='lasso')+t('text','text','Testo',this.mode==='text')+t('eraser','eraser','Gomma',this.mode==='eraser')
      +t('clear','trash','Cancella la pagina')+t('undo','undo','Annulla',false,!hs.u.length)+t('redo','redo','Ripeti',false,!hs.r.length)+t('layers','layers','Livelli');
    bar.innerHTML=h;
    bar.querySelectorAll('[data-p]').forEach(b=>this.drawPresetIcon(b.querySelector('canvas'),this.presets[+b.dataset.p]));
    bar.onclick=e=>{
      const p=e.target.closest('[data-p]');
      if(p){const i=+p.dataset.p; if(this.mode==='preset'&&this.sel===i) this.openStyle(p); else {this.mode='preset';this.sel=i;this.clearSel();this.buildBar(); if(this.presets[i].k==='stamp') this.openStamps();} return;}
      const b=e.target.closest('[data-t]'); if(!b) return; const k=b.dataset.t;
      if(k==='ruler'){this.ruler=!this.ruler;toast(this.ruler?'Righello attivo: le linee vengono dritte':'Righello spento')}
      else if(k==='stamps') this.openStamps();
      else if(['lasso','text','eraser'].includes(k)){this.mode=this.mode===k?'preset':k;this.clearSel()}
      else if(k==='clear'){ if(!this.strokes.length) return; this.push(); this.strokes=this.strokes.filter(s=>(s.layer||0)!==this.layer); this.redraw(); saveAnn(); toast('Livello della pagina cancellato · Annulla per ripristinare') }
      else if(k==='undo') this.undo(); else if(k==='redo') this.redo();
      else if(k==='layers') this.openLayers(b);
      this.buildBar();
    };
  },
  drawPresetIcon(c,p){
    const x=c.getContext('2d'); x.clearRect(0,0,88,88);
    if(p.k==='stamp'){ x.globalAlpha=p.alpha; const g=p.g; const b=glyphBox(x,g,60); const s=60*Math.min(1,52/Math.max(b.w,b.h,1)); drawGlyph(x,g,44,44,s,p.color); return; }
    if(p.k==='shape'){ x.globalAlpha=p.alpha; drawShape(x,{shape:p.shape,a:[14,30],b:[74,58],w:5,color:p.color}); return; }
    const w=clamp(this.W(p)*900,2,30);
    x.globalAlpha=p.k==='hl'?Math.max(.55,p.alpha):1; x.strokeStyle=p.color; x.lineWidth=w; x.lineCap=p.k==='hl'?'butt':'round';
    if(p.k==='mask'){x.fillStyle='#3a3326';x.fillRect(10,10,68,68);x.strokeStyle='#fff'}
    x.beginPath(); x.moveTo(18,70); x.lineTo(70,18); x.stroke();
  },

  // ---- disegno ----
  pt(e){ const r=inkCanvas.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height, e.pressure||.5]; },
  push(){ const h=this.hist[ST.page]=this.hist[ST.page]||{u:[],r:[]}; h.u.push(JSON.stringify(this.strokes)); if(h.u.length>60)h.u.shift(); h.r=[]; },
  undo(){ const h=this.hist[ST.page]; if(!h||!h.u.length) return; h.r.push(JSON.stringify(this.strokes)); this.strokes=JSON.parse(h.u.pop()); this.clearSel(); this.redraw(); saveAnn(); this.buildBar(); },
  redo(){ const h=this.hist[ST.page]; if(!h||!h.r.length) return; h.u.push(JSON.stringify(this.strokes)); this.strokes=JSON.parse(h.r.pop()); this.redraw(); saveAnn(); this.buildBar(); },
  down(e){
    if(!ST.annotate) return;
    if(ST.settings.pencilOnly && e.pointerType==='touch'){ this.touchNav={x:e.clientX,y:e.clientY}; return; }
    inkCanvas.setPointerCapture(e.pointerId);
    const p=this.pt(e); const pr=this.presets[this.sel];
    if(this.mode==='eraser'){ this.push(); this.live={t:'erase',hit:false}; this.erase(p); return; }
    if(this.mode==='text'){ this.textAt(p); return; }
    if(this.mode==='lasso'){
      if(this.selBox && p[0]>=this.selBox.x0&&p[0]<=this.selBox.x1&&p[1]>=this.selBox.y0&&p[1]<=this.selBox.y1){ this.push(); this.live={t:'drag',from:p}; return; }
      this.clearSel(); this.live={t:'lasso',pts:[p]}; return;
    }
    if(pr.k==='stamp'){ this.live={t:'stamp',g:pr.g,x:p[0],y:p[1],size:pr.size*.0016,color:pr.color,alpha:pr.alpha,layer:this.layer}; this.redraw(); return; }
    if(pr.k==='shape'){ this.live={t:'shape',shape:pr.shape,a:[p[0],p[1]],b:[p[0],p[1]],w:this.W(pr),color:pr.color,alpha:pr.alpha,layer:this.layer}; return; }
    this.live={t:pr.k,color:pr.k==='mask'?'#ffffff':pr.color,alpha:pr.alpha,w:this.W(pr),pts:[[p[0],p[1]]],layer:this.layer};
  },
  move(e){
    if(this.touchNav) return;
    const L=this.live; if(!L) return;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    const p=this.pt(e);
    if(L.t==='erase'){ this.erase(p); return; }
    if(L.t==='lasso'){ L.pts.push(p); this.redraw(); return; }
    if(L.t==='drag'){ const dx=p[0]-L.from[0], dy=p[1]-L.from[1]; L.from=p; this.selIdx.forEach(i=>moveStroke(this.strokes[i],dx,dy)); this.selBox.x0+=dx;this.selBox.x1+=dx;this.selBox.y0+=dy;this.selBox.y1+=dy; this.redraw(); return; }
    if(L.t==='stamp'){ L.x=p[0]; L.y=p[1]; this.redraw(); return; }
    if(L.t==='shape'){ L.b=[p[0],p[1]]; this.redraw(); return; }
    if(this.ruler){ L.pts=[L.pts[0],[p[0],p[1]]]; }
    else for(const ev of evs){ const q=this.pt(ev); const last=L.pts[L.pts.length-1]; if(Math.hypot(q[0]-last[0],q[1]-last[1])>.0012) L.pts.push([q[0],q[1]]); }
    this.redraw();
  },
  up(e){
    if(this.touchNav){ const dx=e.clientX-this.touchNav.x; this.touchNav=null; if(Math.abs(dx)>60) dx<0?nextPage():prevPage(); return; }
    const L=this.live; this.live=null; if(!L) return;
    if(L.t==='erase'){ if(!L.hit){ const h=this.hist[ST.page]; h&&h.u.pop(); } saveAnn(); this.buildBar(); return; }
    if(L.t==='lasso'){ this.selectLasso(L.pts); this.redraw(); return; }
    if(L.t==='drag'){ saveAnn(); this.showSelBar(); this.buildBar(); return; }
    if(L.t==='shape' && Math.hypot(L.b[0]-L.a[0],L.b[1]-L.a[1])<.01){ this.redraw(); return; }
    if((L.t==='pen'||L.t==='hl'||L.t==='mask') && L.pts.length===1) L.pts.push([L.pts[0][0]+.0005,L.pts[0][1]+.0005]);
    this.push(); this.strokes.push(L); this.redraw(); saveAnn(); this.buildBar();
  },
  erase(p){
    const r=.014, arr=this.strokes; let changed=false;
    for(let i=arr.length-1;i>=0;i--){ const s=arr[i]; if((s.layer||0)!==this.layer) continue; if(hitStroke(s,p[0],p[1],r)){ arr.splice(i,1); changed=true; } }
    if(changed){ this.live.hit=true; this.redraw(); }
  },
  textAt(p){
    $('#textEntry')?.remove(); const pr=this.presets[this.sel];
    const r=inkCanvas.getBoundingClientRect(); const box=document.createElement('div'); box.id='textEntry';
    box.innerHTML=`<input id="teIn" placeholder="Scrivi… (es. rit., respira)" enterkeyhint="done"><button class="goldBtn sm" id="teOk">${iconSvg('check')}</button>`;
    $('#app').appendChild(box);
    box.style.left=clamp(r.left+p[0]*r.width-10,8,innerWidth-320)+'px'; box.style.top=clamp(r.top+p[1]*r.height-26,70,innerHeight-120)+'px';
    const commit=()=>{const v=$('#teIn').value.trim(); box.remove(); if(!v) return; this.push(); this.strokes.push({t:'text',text:v,x:p[0],y:p[1],size:Math.max(.018,pr.size*.0012),color:pr.k==='mask'?'#111':pr.color,alpha:1,layer:this.layer}); this.redraw(); saveAnn(); this.buildBar(); };
    $('#teOk').onclick=commit; $('#teIn').onkeydown=e=>{if(e.key==='Enter')commit();if(e.key==='Escape')box.remove()}; setTimeout(()=>$('#teIn').focus(),20);
  },
  selectLasso(poly){
    if(poly.length<3) return; const idx=[];
    this.strokes.forEach((s,i)=>{ if((s.layer||0)!==this.layer) return; const pts=strokePts(s); if(pts.some(q=>inPoly(q,poly))) idx.push(i); });
    if(!idx.length){ toast('Niente da selezionare qui'); return; }
    this.selIdx=idx; this.updSelBox(); this.showSelBar();
  },
  updSelBox(){ let x0=1,y0=1,x1=0,y1=0; this.selIdx.forEach(i=>strokePts(this.strokes[i]).forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)})); const pad=.015; this.selBox={x0:x0-pad,y0:y0-pad,x1:x1+pad,y1:y1+pad}; },
  showSelBar(){
    $('#selBar')?.remove(); if(!this.selBox) return; const r=inkCanvas.getBoundingClientRect();
    const b=document.createElement('div'); b.id='selBar'; b.className='pill';
    b.innerHTML=`<button class="ib" data-s="dup" aria-label="Duplica">${iconSvg('copy')}</button><button class="ib" data-s="del" aria-label="Elimina">${iconSvg('trash')}</button><button class="ib" data-s="done" aria-label="Fine">${iconSvg('check')}</button>`;
    $('#app').appendChild(b); b.style.left=clamp(r.left+this.selBox.x0*r.width,8,innerWidth-170)+'px'; b.style.top=clamp(r.top+this.selBox.y0*r.height-60,120,innerHeight-60)+'px';
    b.onclick=e=>{const k=e.target.closest('[data-s]')?.dataset.s; if(!k) return;
      if(k==='del'){this.push();this.strokes=this.strokes.filter((_,i)=>!this.selIdx.includes(i));this.clearSel()}
      if(k==='dup'){this.push();const n=this.selIdx.map(i=>{const c=JSON.parse(JSON.stringify(this.strokes[i]));moveStroke(c,.02,.02);return c});const base=this.strokes.length;this.strokes.push(...n);this.selIdx=n.map((_,i)=>base+i);this.updSelBox();this.showSelBar()}
      if(k==='done') this.clearSel();
      this.redraw(); saveAnn(); this.buildBar(); };
  },
  clearSel(){ this.selIdx=[]; this.selBox=null; $('#selBar')?.remove(); this.redraw&&ST.cur&&this.redraw(); },

  redraw(){
    if(!inkCanvas.width) return; const x=inkCanvas.getContext('2d'); const W=inkCanvas.width,H=inkCanvas.height;
    x.clearRect(0,0,W,H);
    this.paint(x,ST.ann[ST.page]||[],W,H,false);
    const L=this.live;
    if(L && !['erase','lasso','drag'].includes(L.t)) this.paint(x,[L],W,H,true);
    if(L && L.t==='lasso'){ x.save(); x.setLineDash([8,6]); x.strokeStyle='#c8962e'; x.lineWidth=2; x.beginPath(); L.pts.forEach((p,i)=>i?x.lineTo(p[0]*W,p[1]*H):x.moveTo(p[0]*W,p[1]*H)); x.stroke(); x.restore(); }
    if(this.selBox){ const b=this.selBox; x.save(); x.setLineDash([10,6]); x.strokeStyle='#c8962e'; x.lineWidth=2.5; x.strokeRect(b.x0*W,b.y0*H,(b.x1-b.x0)*W,(b.y1-b.y0)*H); x.restore(); }
  },
  paint(x,strokes,W,H,all){
    for(const s of strokes){
      if(!all && this.layers[s.layer||0] && !this.layers[s.layer||0].vis) continue;
      x.save(); x.globalAlpha=s.alpha??1;
      if(s.t==='pen'||s.t==='hl'||s.t==='mask'){
        x.strokeStyle=s.color; x.lineWidth=s.w*W; x.lineCap=s.t==='hl'?'butt':'round'; x.lineJoin='round';
        const P2=s.pts.map(p=>[p[0]*W,p[1]*H]); x.beginPath(); x.moveTo(P2[0][0],P2[0][1]);
        for(let i=1;i<P2.length-1;i++){const mx=(P2[i][0]+P2[i+1][0])/2,my=(P2[i][1]+P2[i+1][1])/2;x.quadraticCurveTo(P2[i][0],P2[i][1],mx,my)}
        const l=P2[P2.length-1]; x.lineTo(l[0],l[1]); x.stroke();
      } else if(s.t==='shape'){ drawShape(x,{shape:s.shape,a:[s.a[0]*W,s.a[1]*H],b:[s.b[0]*W,s.b[1]*H],w:s.w*W,color:s.color}); }
      else if(s.t==='stamp'){ drawGlyph(x,s.g,s.x*W,s.y*H,s.size*W,s.color); }
      else if(s.t==='text'){ x.fillStyle=s.color; x.font=`italic 600 ${s.size*W}px ${css('--f-display')}`; x.textBaseline='middle'; x.fillText(s.text,s.x*W,s.y*H); }
      x.restore();
    }
  },

  // ---- pannelli ----
  openStyle(anchor){
    const pr=this.presets[this.sel];
    if(pr.k==='stamp') return this.openStamps();
    if(pr.k==='shape') return this.openShapes(anchor);
    const hsl=hexToHsl(pr.color);
    const sl=(id,l,min,max,v,suf='')=>`<div class="sl"><span>${l}<em id="${id}v">${v}${suf}</em></span><input type="range" id="${id}" min="${min}" max="${max}" value="${v}" style="--v:${(v-min)/(max-min)*100}%"></div>`;
    const p=popover(anchor,`<h4>Stile pennello</h4><div style="width:300px;display:flex;flex-direction:column;gap:10px">

function sameGlyph(a,b){return a&&b&&a.c===b.c&&a.v===b.v&&a.f===b.f}
function strokePts(s){ if(s.pts) return s.pts; if(s.t==='shape') return [s.a,s.b]; return [[s.x,s.y]]; }
function moveStroke(s,dx,dy){ if(s.pts) s.pts=s.pts.map(p=>[p[0]+dx,p[1]+dy]); else if(s.t==='shape'){s.a=[s.a[0]+dx,s.a[1]+dy];s.b=[s.b[0]+dx,s.b[1]+dy]} else {s.x+=dx;s.y+=dy} }
function hitStroke(s,x,y,r){
  if(s.t==='stamp') return Math.hypot(s.x-x,s.y-y)<Math.max(r,s.size*.5);
  if(s.t==='text') return x>=s.x-r&&x<=s.x+s.size*s.text.length*.55+r&&Math.abs(y-s.y)<s.size*.7+r;
  const pts=strokePts(s);
  for(let i=0;i<pts.length-1;i++) if(segDist(x,y,pts[i],pts[i+1])<r+(s.w||0)/2) return true;
  return pts.length===1 && Math.hypot(pts[0][0]-x,pts[0][1]-y)<r;
}
function segDist(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const l=dx*dx+dy*dy;let t=l?((x-a[0])*dx+(y-a[1])*dy)/l:0;t=clamp(t,0,1);return Math.hypot(x-(a[0]+t*dx),y-(a[1]+t*dy))}
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>p[1])!==(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]))c=!c}return c}
function drawShape(x,s){
  const [ax,ay]=s.a,[bx,by]=s.b; x.save(); x.strokeStyle=s.color; x.fillStyle=s.color; x.lineWidth=Math.max(1,s.w); x.lineCap='round'; x.lineJoin='round';
  const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;

    case 'cresc':{const my=(ay+by)/2,hh=Math.max(Math.abs(by-ay)/2,Math.abs(bx-ax)*.07);x.moveTo(bx,my-hh);x.lineTo(ax,my);x.lineTo(bx,my+hh);break}
    case 'dim':{const my=(ay+by)/2,hh=Math.max(Math.abs(by-ay)/2,(Math.abs(bx-ax))*.07);x.moveTo(ax,my-hh);x.lineTo(bx,my);x.lineTo(ax,my+hh);break}
    case 'slurUp': case 'slurDown':{const up=s.shape==='slurUp'?-1:1;const sg=dx>=0?1:-1;const h=len*.25*up*sg;const mx=(ax+bx)/2,my=(ay+by)/2;x.moveTo(ax,ay);x.quadraticCurveTo(mx+nx*h,my+ny*h,bx,by);break}
    case 'line': x.moveTo(ax,ay);x.lineTo(bx,by);break;
    case 'dashed': x.setLineDash([s.w*3,s.w*3]);x.moveTo(ax,ay);x.lineTo(bx,by);x.lineTo(bx,by+s.w*5);break;
    case 'arrow':{x.moveTo(ax,ay);x.lineTo(bx,by);const a=Math.atan2(dy,dx),hl=Math.max(10,s.w*4);x.moveTo(bx,by);x.lineTo(bx-hl*Math.cos(a-.45),by-hl*Math.sin(a-.45));x.moveTo(bx,by);x.lineTo(bx-hl*Math.cos(a+.45),by-hl*Math.sin(a+.45));break}
    case 'ellipse': x.ellipse((ax+bx)/2,(ay+by)/2,Math.abs(dx)/2||1,Math.abs(dy)/2||1,0,0,7);break;
    case 'rect': x.rect(Math.min(ax,bx),Math.min(ay,by),Math.abs(dx),Math.abs(dy));break;
    case 'bracketL':{const w=Math.max(6,Math.abs(dx)*.4);x.moveTo(ax+w,ay);x.lineTo(ax,ay);x.lineTo(ax,by);x.lineTo(ax+w,by);break}
    case 'bracketR':{const w=Math.max(6,Math.abs(dx)*.4);x.moveTo(bx-w,ay);x.lineTo(bx,ay);x.lineTo(bx,by);x.lineTo(bx-w,by);break}
    case 'wavy':{const n=Math.max(2,Math.round(len/(s.w*7+6)));const st=len/n;x.moveTo(ax,ay);for(let i=0;i<n;i++){const t0=i*st;const cx=ax+dx/len*(t0+st/2)+nx*(i%2?1:-1)*st*.5,cy=ay+dy/len*(t0+st/2)+ny*(i%2?1:-1)*st*.5;x.quadraticCurveTo(cx,cy,ax+dx/len*(t0+st),ay+dy/len*(t0+st))}break}

function hexToHsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s*100,l*100]}

const Insert = {

  open(){

      <div class="hint">In <b>${esc(ST.cur.title)}</b>, ora a pagina <b>${ST.page+1}</b> di ${ST.cur.pages}. Scegli da dove prendere le nuove pagine:</div>

      </div>
      <div class="field"><label>Dove inserirle</label><div class="seg" id="insPos">
        ${[['before','Prima di questa'],['after','Dopo questa'],['start','All\'inizio'],['end','Alla fine']].map(([k,l])=>`<button data-pos="${k}" class="${this.pos===k?'on':''}">${l}</button>`).join('')}</div></div>`,
      null,{eyebrow:'Spartito aperto'});

  // ---- PDF ----

    this.target=target; const f=$('#filePdf'); f.value='';
    f.onchange=async()=>{ const files=[...f.files]; if(!files.length) return;
      if(target==='new'){ busy('Importo…'); let last=null; for(const file of files){ try{ last=await addScore(await file.arrayBuffer(),{title:file.name.replace(/\.pdf$/i,'').replace(/[_]+/g,' ')}); }catch(e){ toast('“'+file.name+'” non è un PDF leggibile'); } } busy(); renderLibrary(); if(last){ openScore(last.id); toast(files.length>1?files.length+' spartiti importati':'Spartito importato'); } return; }
      this.choosePages(await files[0].arrayBuffer(), files[0].name);

  async choosePages(bytes,name){

    const m2=modal('Pagine da inserire',`<div class="hint"><b>${esc(name)}</b> ha ${n} pagine. Le inserisco ${this.posLabel()}.</div>

      `<button class="ghostBtn" data-no>Annulla</button><button class="goldBtn" data-ok>${iconSvg('plusDoc')}Inserisci</button>`);

      catch(e){ busy(); toast('Inserimento non riuscito'); }
    };
  },

  // Esegue l'inserimento nel PDF aperto e sposta le annotazioni.
  async insertPages(builder){
    const sc=ST.cur; const at=this.posIndex();
    const doc=await PDFLib.PDFDocument.load(sc.bytes,{ignoreEncryption:true});
    const count=await builder(doc,at);
    const bytes=(await doc.save()).buffer;
    const ann={}; for(const k in ST.ann){ const i=+k; ann[i>=at?i+count:i]=ST.ann[k]; }
