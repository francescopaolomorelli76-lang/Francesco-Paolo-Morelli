# Progetto Xcode generato con XcodeGen (brew install xcodegen; xcodegen generate)
name: Mozart
options:
  bundleIdPrefix: com.morelli
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Mozart:
    type: application
    platform: iOS
    sources:
      - path: Mozart
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morelli.mozart
        PRODUCT_NAME: Mozart
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Mozart/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
    info:
      path: Mozart/Info.plist
      properties:
        CFBundleDisplayName: Mozart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBlack
          UIImageName: LaunchCover
          UIImageRespectsSafeAreaInsets: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSMicrophoneUsageDescription: Mozart usa il microfono per l'accordatore e per registrare le tue prove.
        NSCameraUsageDescription: Mozart usa la fotocamera per scansionare gli spartiti.
        NSPhotoLibraryUsageDescription: Mozart apre le foto degli spartiti per trasformarle in pagine.
        NSPhotoLibraryAddUsageDescription: Mozart può salvare immagini nella libreria foto.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Backup forScore
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.forScore.4sb, com.morelli.mozart.4sb]
          - CFBundleTypeName: Immagine
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Archivio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.morelli.mozart.4sb
            UTTypeDescription: Backup forScore
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [4sb]
